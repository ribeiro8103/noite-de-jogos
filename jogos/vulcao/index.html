<style>

*{box-sizing:border-box} html,body{margin:0;height:100%;background:#06222b;color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#banner{position:absolute;left:50%;top:15%;transform:translate(-50%,-30px) scale(.9);opacity:0;transition:all .35s cubic-bezier(.2,1.4,.4,1);z-index:9;text-align:center;pointer-events:none;background:rgba(6,34,43,.88);color:#fff;border-radius:26px;padding:16px 38px;border:3px solid var(--sun);max-width:80vw}

.pch{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 14px 5px 5px;background:#eef6f7;border:3px solid var(--c,#ccc);font-weight:800} .pch.done{background:#d9f5e2} .pch.pick{background:var(--sun)}
.timer{font-family:var(--disp);font-size:clamp(60px,10vw,150px);line-height:1;color:var(--sea2)} .timer.low{color:var(--coral);animation:pulse .5s infinite alternate} @keyframes pulse{to{transform:scale(1.08)}}
.mgbig{border-radius:26px;padding:5vh 6vw;font-family:var(--disp);font-size:clamp(40px,7vw,110px);color:#fff} .mgbig.red{background:#d3263a} .mgbig.green{background:#1fae5a}

.cbox{background:var(--card);border-radius:22px;padding:22px;max-width:480px;width:90%} .cbox p{font-size:18px;font-weight:700;margin:0 0 12px} .cbox .opts{display:flex;flex-direction:column;gap:8px}

.code-l{letter-spacing:.25em;text-transform:uppercase;font-size:12px;font-weight:800;color:var(--sun);margin-top:14px} .code{font-family:var(--disp);font-size:66px;letter-spacing:.12em;line-height:1}

.lbp{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:14px;padding:6px 10px;margin-bottom:6px} .lbp b{font-size:17px} .lbp .muted{color:#a9cbd3;font-size:13px;flex:1} .lbp .x{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:9px;width:30px;height:30px}
.addlocal{display:flex;gap:8px;margin-top:8px} .addlocal input,.addlocal select,.opt select{flex:1;border-radius:11px;border:0;padding:9px 11px;font:inherit;font-weight:700;min-width:0}
.opt{display:flex;align-items:center;gap:10px;margin:7px 0;font-weight:700;font-size:15px} .opt select{flex:0 0 250px} .opt input[type=checkbox]{width:20px;height:20px}

#localpad{position:absolute;right:14px;bottom:14px;width:380px;height:min(640px,78vh);display:none;flex-direction:column;z-index:15;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);border:3px solid #fff} #localpad.show{display:flex} #localpad.min{height:44px}
.lp-tabs{background:var(--sea2);color:#fff;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px} .lp-tabs button{border:2px solid var(--c);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:3px 10px;font-weight:800} .lp-tabs button.on{background:var(--c);color:#06222b} .lp-tabs .muted{color:#a9cbd3}

/* comando */
#padroot{background:var(--sand);overflow:auto}
.join{max-width:460px;margin:0 auto;padding:26px 18px;display:flex;flex-direction:column;gap:12px}
.join label{font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:5px} .join input{border:2px solid var(--line);border-radius:14px;padding:13px;font:800 20px Nunito;text-align:center;width:100%}
.hats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px} .hatb{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 2px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px} .hatb span{font-size:26px} .hatb.on{border-color:var(--sea);background:#dff3f7} .hatb:disabled{opacity:.3}
.pad{display:flex;flex-direction:column;height:100%;background:var(--sand)}
.pad-h{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--sea2);color:#fff;padding-top:max(10px,env(safe-area-inset-top))} .pad-h .ph-n{flex:1;min-width:0;line-height:1.15} .pad-h b{font-size:17px;display:block} .pad-h span{font-size:13px;opacity:.85;font-weight:700} .pad-h .ph-m{text-align:right;font-weight:800;font-size:13px;line-height:1.2}
