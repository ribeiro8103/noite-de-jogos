<!DOCTYPE html>
<html lang="pt-PT">
<head>
<script src="../../rede.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<title>O Clube — sociedade secreta de apostadores</title>
<style>
:root{
  --bg:#07100c; --felt:#0d1f17; --felt2:#12291f; --gold:#d8b25a; --gold2:#f3d68c; --cream:#f3ead6; --muted:#9fb3a7;
  --red:#d9534f; --green:#4cc38a; --blue:#4fa3d9; --line:rgba(216,178,90,.28);
  --serif: "Playfair Display","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  --sans: "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit}
.hide{display:none!important}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.serif{font-family:var(--serif)}
.deco{background:radial-gradient(ellipse at 50% 0%, #1b3a2b 0%, var(--felt) 45%, var(--bg) 100%)}
.deco::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:repeating-linear-gradient(45deg, rgba(216,178,90,.05) 0 2px, transparent 2px 18px),repeating-linear-gradient(-45deg, rgba(216,178,90,.04) 0 2px, transparent 2px 18px)}
.logo{font-family:var(--serif);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);text-align:center;line-height:1}
.logo small{display:block;font-size:.28em;letter-spacing:.5em;color:var(--muted);margin-top:.8em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.85em 1.3em;border-radius:14px;background:linear-gradient(180deg,#e6c56f,#b8913c);color:#1a1206;font-weight:700;letter-spacing:.02em;box-shadow:0 6px 0 #6e5520, 0 10px 24px rgba(0,0,0,.4);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6e5520}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:linear-gradient(180deg,#e6716d,#b33c38);color:#fff;box-shadow:0 6px 0 #6b201d}
.btn.green{background:linear-gradient(180deg,#6fe0a8,#2f9d6a);color:#062014;box-shadow:0 6px 0 #1b5a3c}
.btn.blue{background:linear-gradient(180deg,#7fc1ee,#3683b8);color:#04121d;box-shadow:0 6px 0 #1e4b6b}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.big{width:100%;font-size:1.15em;padding:1em}
.btn.huge{width:100%;font-size:1.35em;padding:1.1em;flex-direction:column}
.btn.huge small{font-size:.6em;font-weight:500;opacity:.8}
/* ===== Ecrã inicial ===== */
#start{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#start.show{display:flex}
.st-box{width:min(520px,100%);display:flex;flex-direction:column;gap:18px;text-align:center}
.st-box .logo{font-size:clamp(46px,10vw,84px)}
.st-box .tag{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.1em}
/* ===== TV ===== */
#tv{position:fixed;inset:0;display:none;font-size:clamp(12px,1.05vw,22px)}
#tv.show{display:block}
#tv .top{position:absolute;left:0;right:0;top:0;height:5.2em;display:flex;align-items:center;gap:1.2em;padding:0 1.6em;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0))}
#tv .top .logo{font-size:2.1em;letter-spacing:.3em}
.rnd{font-family:var(--serif);font-size:1.25em}
.rnd b{color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.3em .75em;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip .av{font-size:1.15em}
.law{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:var(--serif);font-style:italic;color:var(--gold2);text-align:center}
.flagc{background:rgba(217,83,79,.18);box-shadow:inset 0 0 0 1px rgba(217,83,79,.5)}
.hostc{display:flex;gap:.4em}
.hostc button{width:2.4em;height:2.4em;border-radius:10px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);font-size:1em}
.hostc button:hover{background:rgba(216,178,90,.2)}
#tv .stage{position:absolute;left:0;top:5.2em;bottom:3em;right:24em;display:flex;align-items:safe center;justify-content:safe center;padding:1.5em 2.5em;overflow:auto}
#tv .side{position:absolute;right:0;top:5.2em;bottom:3em;width:24em;border-left:1px solid var(--line);padding:1em;overflow:hidden;background:rgba(0,0,0,.18)}
#tv .ticker{position:absolute;left:0;right:0;bottom:0;height:3em;display:flex;align-items:center;gap:2em;padding:0 1.6em;border-top:1px solid var(--line);background:rgba(0,0,0,.35);overflow:hidden;white-space:nowrap}
.ticker .tk{opacity:.85}
.ticker .tk.good{color:var(--green)} .ticker .tk.bad{color:#ff8a86} .ticker .tk.warn{color:var(--gold2)}
.rank h3{font-family:var(--serif);letter-spacing:.3em;font-weight:400;color:var(--gold);text-transform:uppercase;font-size:.9em;margin-bottom:.6em;text-align:center}
.prow{position:relative;display:flex;align-items:center;gap:.6em;padding:.45em .55em;margin-bottom:.35em;border-radius:12px;background:rgba(255,255,255,.035);transition:transform .8s cubic-bezier(.2,.8,.2,1), background .3s;cursor:pointer}
.prow .av{font-size:1.6em;width:1.5em;text-align:center}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{display:block;color:var(--muted);font-size:.72em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;font-family:var(--serif)}
.prow .fx{font-family:var(--serif);font-size:1.5em;color:var(--gold2);min-width:2.2em;text-align:right}
.prow .bar{position:absolute;left:0;bottom:0;height:3px;border-radius:3px;transition:width 1.2s}
.prow .tags{display:flex;gap:.15em;font-size:.85em}
.prow.off{opacity:.55}
.prow.bump .fx{animation:bump .9s}
.prow.done{box-shadow:inset 0 0 0 1.5px rgba(76,195,138,.7)}
.prow.wait{box-shadow:inset 0 0 0 1.5px rgba(216,178,90,.35)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.45);color:#fff}100%{transform:scale(1)}}
.delta{position:absolute;right:.6em;top:-.4em;font-weight:800;font-size:.95em;animation:rise 2.4s forwards;pointer-events:none}
.delta.p{color:var(--green)} .delta.m{color:#ff8a86}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
/* stage cards */
.card{background:linear-gradient(180deg,rgba(18,41,31,.92),rgba(9,22,16,.95));border:1px solid var(--line);border-radius:22px;padding:2em 2.4em;box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 6px rgba(216,178,90,.05);position:relative}
.card.deco-c::after{content:"";position:absolute;inset:10px;border:1px solid rgba(216,178,90,.14);border-radius:16px;pointer-events:none}
.sg{width:100%;max-width:62em;text-align:center;display:flex;flex-direction:column;gap:1.1em;align-items:center}
.sg h1{font-family:var(--serif);font-weight:400;font-size:3.2em;letter-spacing:.06em;line-height:1.1}
.sg h2{font-family:var(--serif);font-weight:400;font-size:2.1em;line-height:1.2}
.sg .kicker{letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-size:.85em}
.sg .big-q{font-family:var(--serif);font-size:2.5em;line-height:1.25;max-width:24em}
.sg p.lead{font-size:1.3em;color:var(--cream);opacity:.9;max-width:36em;line-height:1.45}
.typeic{font-size:5em;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6))}
.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{0%{opacity:0;transform:translateY(30px) scale(.97)}100%{opacity:1;transform:none}}
.slow-in{animation:enter 1.4s cubic-bezier(.2,.8,.2,1) both}
.timer{display:inline-flex;align-items:center;gap:.5em;font-family:var(--serif);font-size:1.6em;color:var(--gold2)}
.timer .ring{width:1.6em;height:1.6em}
.timer.low{color:#ff8a86;animation:pulse 1s infinite}
.timer.huge{font-size:6em}
@keyframes pulse{50%{opacity:.55}}
.who{display:inline-flex;align-items:center;gap:.35em;padding:.15em .6em .15em .3em;border-radius:99px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;white-space:nowrap}
.who .av{font-size:1.15em}
.row{display:flex;gap:1em;flex-wrap:wrap;justify-content:center;align-items:center}
.opts{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center}
.opt{min-width:9em;padding:.9em 1.2em;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:.4em;position:relative}
.opt .l{font-size:1.15em;font-weight:600}
.opt .stack{display:flex;flex-wrap:wrap;gap:.2em;justify-content:center;min-height:1.6em}
.opt.win{background:rgba(76,195,138,.18);box-shadow:inset 0 0 0 2px var(--green);transform:scale(1.05);transition:transform .5s}
.opt.lose{opacity:.45}
.betpill{display:inline-flex;align-items:center;gap:.25em;padding:.15em .45em;border-radius:99px;background:rgba(0,0,0,.35);font-size:.9em;opacity:0;transform:scale(.6);transition:all .5s cubic-bezier(.2,1.4,.4,1)}
.betpill.on{opacity:1;transform:none}
.betpill b{color:var(--gold2)}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#d8b25a 45%,#8a6a22);box-shadow:0 0 0 2px rgba(0,0,0,.25) inset;vertical-align:-.12em}
.flip{perspective:1200px}
.ans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.8em;width:100%}
.acard{height:6.4em;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.acard .f,.acard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5em;gap:.25em}
.acard .f{background:repeating-linear-gradient(45deg,#1d3a2c 0 8px,#173126 8px 16px);box-shadow:inset 0 0 0 1px var(--line)}
.acard .f::after{content:"?";font-family:var(--serif);font-size:2em;color:var(--gold)}
.acard .b{background:var(--cream);color:#1a1206;transform:rotateY(180deg);font-weight:700}
.acard .b small{font-weight:500;font-size:.8em;color:#5d5444}
.acard .b .txt{font-family:var(--serif);font-size:1.25em;text-align:center;line-height:1.15}
.acard.shown{transform:rotateY(180deg)}
.acard.ok .b{background:#d9f7e6;box-shadow:0 0 0 3px var(--green)}
.acard.truth .b{background:linear-gradient(180deg,#f8e6ae,#e0bd61)}
.voters{display:flex;gap:.25em;flex-wrap:wrap;justify-content:center;min-height:1.7em}
.vt{font-size:1.4em;opacity:0;transform:translateY(-12px) scale(.5);transition:all .6s cubic-bezier(.2,1.4,.4,1)}
.vt.on{opacity:1;transform:none}
.duo{display:flex;align-items:center;gap:2em;font-size:1.6em}
.duo .fighter{display:flex;flex-direction:column;align-items:center;gap:.2em}
.duo .fighter .av{font-size:3em}
.duo .vs{font-family:var(--serif);font-size:2em;color:var(--gold)}
.counter{font-family:var(--serif);font-size:8em;line-height:1;color:var(--gold2)}
.counter small{font-size:.3em;color:var(--muted)}
.thermo{width:min(40em,90%);height:3em;border-radius:99px;background:linear-gradient(90deg,#3a8fd9,#9bd2ff 35%,#ffd27a 65%,#ff5a2a);position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.thermo .needle{position:absolute;top:-.6em;bottom:-.6em;width:.5em;border-radius:4px;background:#fff;box-shadow:0 0 18px #fff;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.hc{font-size:4em;transition:transform .3s}
.wheel-wrap{position:relative;width:min(28em,56vh);height:min(28em,56vh);margin-top:1.4em}
.wheel{width:100%;height:100%;transition:transform 6.6s cubic-bezier(.12,.6,.08,1)}
.wheel-ptr{position:absolute;left:50%;top:-1.2em;transform:translateX(-50%);font-size:2.4em;color:var(--gold2);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));z-index:2}
.wheel-hub{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f3d68c,#8a6a22);box-shadow:0 0 30px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:#1a1206;font-size:1.1em;letter-spacing:.2em}
.podium{display:flex;align-items:flex-end;gap:1.2em;justify-content:center}
.podium .pl{display:flex;flex-direction:column;align-items:center;gap:.3em}
.podium .pl .av{font-size:2.4em}
.podium .blk{width:7em;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#e6c56f,#8a6a22);display:flex;align-items:flex-start;justify-content:center;padding-top:.4em;font-family:var(--serif);font-size:1.6em;color:#1a1206}
.crown{animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.tbl{width:100%;border-collapse:collapse;font-size:1em}
.tbl td,.tbl th{padding:.45em .6em;border-bottom:1px solid rgba(216,178,90,.15);text-align:left}
.tbl th{color:var(--gold);font-weight:500;letter-spacing:.08em;font-size:.85em;text-transform:uppercase}
.spot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.88));animation:fadein .5s}
@keyframes fadein{from{opacity:0}}
.spot .card{max-width:46em;text-align:center;display:flex;flex-direction:column;gap:.9em;align-items:center;font-size:1.15em}
.stamp{font-family:var(--serif);font-size:3em;letter-spacing:.1em;padding:.1em .5em;border:4px solid;border-radius:12px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp.ok{color:var(--green)} .stamp.no{color:var(--red)}
@keyframes stamp{0%{transform:scale(3) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.ktext{font-family:var(--serif);font-size:1.7em;line-height:1.3;font-style:italic}
.lobby{display:grid;grid-template-columns:1fr 1.2fr;gap:2em;width:100%;max-width:70em;align-items:start}
.code{font-family:var(--serif);font-size:6.5em;letter-spacing:.18em;color:var(--gold2);line-height:1}
#qr{display:inline-block;margin:.6em 0;min-height:10px}
#qr img,#qr canvas{border:10px solid #fff;border-radius:12px;display:block}
.howto{text-align:left;line-height:1.7;margin:.5em auto;max-width:24em;font-size:1.05em}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:.7em}
.lp{padding:.8em;border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:.2em;animation:enter .7s both}
.lp .av{font-size:2.4em}
.lp small{color:var(--muted);font-style:italic;font-family:var(--serif)}
.segm{display:inline-flex;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.segm button{padding:.5em 1em}
.segm button.on{background:var(--gold);color:#1a1206;font-weight:700}
.localpads{position:absolute;left:1em;bottom:3.6em;width:23em;max-height:70%;z-index:20;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid var(--line);background:var(--felt)}
.localpads .lp-tabs{display:flex;gap:.3em;padding:.4em;background:rgba(0,0,0,.4);flex-wrap:wrap}
.localpads .lp-tabs button{padding:.3em .6em;border-radius:8px;background:rgba(255,255,255,.06)}
.localpads .lp-tabs button.on{background:var(--gold);color:#1a1206}
.localpads .lp-body{position:relative;height:30em;overflow:auto;font-size:.85em}
.cover{position:absolute;inset:0;z-index:5;background:var(--felt2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.6em;text-align:center;padding:1em}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:1em}
.modal .card{max-width:34em;display:flex;flex-direction:column;gap:1em;text-align:center}
.pause-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1em;font-family:var(--serif);font-size:3em;color:var(--gold)}
/* ===== Telemóvel ===== */
#padroot{position:fixed;inset:0;display:none;overflow:hidden}
#padroot.show{display:block}
.pad{position:absolute;inset:0;display:flex;flex-direction:column;font-size:16px}
.pad .hd{display:flex;align-items:center;gap:.6em;padding:calc(.7em + env(safe-area-inset-top)) .9em .7em;border-bottom:1px solid var(--line);background:rgba(0,0,0,.35)}
.pad .hd .av{font-size:2em}
.pad .hd .nm{flex:1;min-width:0}
.pad .hd .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .hd .nm small{color:var(--muted);font-style:italic;font-family:var(--serif);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .hd .money{font-family:var(--serif);font-size:1.9em;color:var(--gold2);display:flex;align-items:center;gap:.25em}
.pad .hd .money small{font-size:.4em;color:#ff8a86;font-family:var(--sans)}
.badges{display:flex;gap:.3em;flex-wrap:wrap;margin-top:.15em}
.badge{font-size:.7em;padding:.1em .45em;border-radius:99px;background:rgba(216,178,90,.18);color:var(--gold2)}
.pad .body{flex:1;overflow-y:auto;padding:1em;display:flex;flex-direction:column;gap:1em;-webkit-overflow-scrolling:touch}
.pad .tabs{display:flex;border-top:1px solid var(--line);background:rgba(0,0,0,.45)}
.pad .tabs button{flex:1;padding:.75em .2em calc(.75em + env(safe-area-inset-bottom));font-size:.85em;color:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;gap:.15em}
.pad .tabs button span{font-size:1.4em}
.pad .tabs button.on{color:var(--gold2)}
.pad .tabs .dot{position:absolute;top:.4em;right:30%;background:var(--red);color:#fff;border-radius:99px;font-size:.7em;padding:0 .4em}
.pcard{background:rgba(255,255,255,.05);border-radius:16px;padding:1em;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:.75em}
.pcard h3{font-family:var(--serif);font-weight:400;font-size:1.3em;color:var(--gold2)}
.pcard .q{font-family:var(--serif);font-size:1.35em;line-height:1.3}
.pcard.role{background:linear-gradient(180deg,rgba(216,178,90,.22),rgba(216,178,90,.06));box-shadow:inset 0 0 0 1.5px var(--gold)}
.pcard.alert{background:rgba(217,83,79,.15);box-shadow:inset 0 0 0 1.5px var(--red)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.pbtn{padding:.8em .5em;border-radius:14px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:.45em;justify-content:center;font-weight:600;min-height:3.2em;text-align:center;line-height:1.15}
.pbtn .av{font-size:1.4em}
.pbtn.on{background:var(--gold);color:#1a1206;box-shadow:none}
.pbtn:disabled{opacity:.35}
.stepper{display:flex;align-items:center;gap:.6em;justify-content:center}
.stepper button{width:2.8em;height:2.8em;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line);font-size:1.3em;font-weight:700}
.stepper .val{font-family:var(--serif);font-size:2.6em;color:var(--gold2);min-width:2em;text-align:center}
.quick{display:flex;gap:.4em;justify-content:center}
.quick button{padding:.35em .8em;border-radius:99px;background:rgba(255,255,255,.07);font-size:.85em}
.inp{width:100%;padding:.9em 1em;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.3);color:var(--cream);font-size:1.1em;outline:none}
.inp:focus{border-color:var(--gold)}

.hotbtns button:active{transform:scale(.96)}

<script>
// O CLUBE — motor do jogo (corre na TV; puro JS, testável em Node)
(function(G){
const D = G.CLUBE_DATA;
const E = {};
let NOW = () => Date.now();
E.setNow = f => { NOW = f; };
const sh = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.random()*a.length|0];
const range = n => [...Array(n).keys()];
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
E.norm = norm;

// tempos (ms) — ritmo lento, com tempo para pensar
const T = { intro:11000, bet:50000, betEach:1100, ans:100000, revEach:2600, judge:60000, vote:45000, voteEach:1900,
  result:11000, spin:7500, spinWait:25000, event:9000, chk:25000, prep:75000, tell:240000, word:20000,
  pick:40000, card:9000, auc:25000, cnt:30000, def:30000, secret:30000, qf:150000, guess:45000, shop:60000,
  law:60000, blind:30000, speech1:30000, speech2:60000, jack:30000, accFx:7500, deal:14000 };
E.T = T;

E.newState = () => ({ ph:'lobby', code:'', players:[], nR:6, rnd:0, cro:0, decks:{}, pv:null, chk:null, chkQ:[],
  accOpt:{}, accFx:null, log:[], toasts:[], tn:0, flags:{}, law:'', lawBy:'', padIdx:-1, finesUsed:0, cust:[],
  lastType:'', newLaw:'', startedAt:0, endAt:0, rank:null });

function log(S, t){ S.log.push(t); if(S.log.length>60) S.log.shift(); }
function toast(S, t, kind){ S.toasts.push({n:++S.tn, t, k:kind||'info'}); if(S.toasts.length>8) S.toasts.shift(); log(S,t); }
E.toast = toast;
function draw(S, cat, len){
  let d = S.decks[cat];
  if(!d || !d.length){ d = S.decks[cat] = sh(range(len)); }
  return d.pop();
}
const NP = S => S.players.length;
const nm = (S,k) => (S.players[k]||{}).name || '?';
const others = (S,k) => range(NP(S)).filter(i=>i!==k);

// ---------- contratos ----------
const KL = () => D.contracts.length;
E.kInfo = (S, c) => {
  if(!c) return {t:'', v:0};
  let t, v;
  if(c.d < KL()){ t = D.contracts[c.d][0]; v = D.contracts[c.d][1]; }
  else { const cu = S.cust[c.d-KL()]; t = cu ? cu.t : '—'; v = cu ? cu.v : 5; }
  const who = S.players[c.p] ? S.players[c.p].name : 'alguém';
  return { t: t.replace(/\{P\}/g, who), v };
};
function kHasP(S, d){ const t = d < KL() ? D.contracts[d][0] : (S.cust[d-KL()]||{}).t || ''; return t.includes('{P}'); }
function newK(S, k, avoid){
  const tot = KL() + S.cust.length;
  for(let tries=0; tries<60; tries++){
    const d = draw(S, 'k', tot);
    if(d >= KL()){ const cu = S.cust[d-KL()]; if(!cu || cu.by === k) continue; }
    if(S.players[k].k.some(c=>c && c.d===d)) continue;
    if(avoid && avoid.includes(d)) continue;
    const p = kHasP(S,d) ? pick(others(S,k)) : -1;
    return { d, p };
  }
  return { d: Math.random()*KL()|0, p: pick(others(S,k)) };
}
function decoy(S, k, exclude){
  const tot = KL() + S.cust.length;
  for(let t=0;t<80;t++){
    const d = Math.random()*tot|0;
    if(exclude.includes(d)) continue;
    if(d>=KL() && (S.cust[d-KL()]||{}).by===k) continue;
    return { d, p: kHasP(S,d) ? pick(range(NP(S))) : -1 };
  }
  return { d:0, p:-1 };
}

// ---------- jogadores ----------
E.addPlayer = (S, o) => {
  if(S.players.length >= 10) return -1;
  const used = S.players.map(p=>p.col);
  const col = D.colors.find(c=>!used.includes(c)) || D.colors[S.players.length % D.colors.length];
  const usedAv = S.players.map(p=>p.av);
  let av = o.av && !usedAv.includes(o.av) ? o.av : (D.avatars.find(a=>!usedAv.includes(a)) || '🎩');
  S.players.push({ name:(o.name||'Jogador').slice(0,14), nick:(o.nick||'').slice(0,24), av, col, cid:o.cid||null, local:!!o.local,
    f:20, debt:0, k:[], so:false, accR:0,
    st:{ wins:0, kc:0, accH:0, hitBy:0, azMax:0, azGold:0, loan:0, imp:0, finOk:0, finN:0 } });
  if(o.cust && String(o.cust).trim().length > 5) S.cust.push({ t:String(o.cust).trim().slice(0,90), v:5, by:S.players.length-1 });
  return S.players.length-1;
};

// ---------- início ----------
E.start = (S, opts) => {
  opts = opts || {};
  S.nR = opts.nR || 6;
  const liga = opts.liga || null;
  S.players.forEach((p,k)=>{
    p.f = 20;
    if(liga && liga.lastLoser && norm(liga.lastLoser)===norm(p.name)) { p.f = 25; }
    p.k = []; p.k.push(newK(S,k)); p.k.push(newK(S,k));
  });
  S.law = liga && liga.law ? liga.law : '';
  S.lawBy = liga && liga.lastPadrinho ? liga.lastPadrinho : '';
  S.padIdx = S.lawBy ? S.players.findIndex(p=>norm(p.name)===norm(S.lawBy)) : -1;
  S.cro = Math.random()*NP(S)|0;
  S.rnd = 0; S.ph = 'play'; S.startedAt = NOW();
  S.pv = { type:'intro', step:'intro', dl: NOW() + 16000 };
  log(S, 'As portas fecham-se. O que acontece no Clube fica no Clube.');
};

// ---------- fases / limites ----------
E.stage = S => S.ph==='final' ? 'F' : (S.rnd <= Math.ceil(S.nR/2) ? 'A' : 'E');
E.lim = S => { const s = E.stage(S); return s==='A' ? {min:1,max:5,prize:3,n:'Aquecimento'} : s==='E' ? {min:2,max:10,prize:5,n:'Escalada'} : {min:0,max:0,prize:10,n:'Grande Final'}; };
function betRange(S, k){
  const p = S.players[k], L = E.lim(S);
  if(S.ph==='final') return { min: Math.min(p.f, Math.ceil(p.f/2)), max: p.f };
  return { min: Math.min(L.min, p.f), max: Math.min(L.max, p.f) };
}
E.betRange = betRange;
const alvoOf = S => (S.cro - 1 + NP(S)) % NP(S);

function nextRound(S){
  S.rnd++;
  if(S.rnd > S.nR){ startFinal(S); return; }
  // Segunda Oportunidade ao mais pobre no início da Escalada
  if(S.rnd === Math.ceil(S.nR/2)+1){
    const min = Math.min(...S.players.map(p=>p.f-p.debt));
    const poor = S.players.map((p,k)=>k).filter(k=>S.players[k].f-S.players[k].debt===min);
    const k = pick(poor); S.players[k].so = true;
    toast(S, `${nm(S,k)} recebe a Segunda Oportunidade: a primeira aposta perdida (3+ fichas) é devolvida.`, 'good');
  }
  if(S.flags.ml && S.flags.ml.until < S.rnd) S.flags.ml = null;
  S.pv = { type:null, step:'spin', alvo: alvoOf(S), dl: NOW() + T.spinWait };
}

function spin(S){
  const pv = S.pv; if(pv.step!=='spin' || pv.res) return;
  const keys = ['qcq','ment','duelo','leilao','voto','qf','caos'];
  const w = { qcq:3, ment:3, duelo:3, leilao:2, voto:3, qf:2, caos:2 };
  let bag = []; keys.forEach(k=>{ if(k!==S.lastType) for(let i=0;i<w[k];i++) bag.push(k); });
  pv.res = (G.__CLUBE_FORCE && keys.includes(G.__CLUBE_FORCE)) ? G.__CLUBE_FORCE : pick(bag); pv.spinAt = NOW(); pv.dl = NOW() + T.spin;
}

function startType(S, type){
  S.lastType = type;
  const alvo = alvoOf(S);
  const base = { type, step:'intro', alvo, dl: NOW()+T.intro };
  if(type==='qcq'){ const q = draw(S,'qcq',D.qcq.length); Object.assign(base, { q, num: !!D.qcq[q][1] }); }
  if(type==='ment'){ base.sub = Math.random()<0.5 ? '2v' : 'imp'; if(base.sub==='2v') base.th = draw(S,'th',D.mentThemes.length); else { base.word = D.impWords[draw(S,'w',D.impWords.length)]; base.imp = Math.random()*NP(S)|0; } }
  if(type==='duelo'){ base.picker = poorest(S); }
  if(type==='leilao'){ base.cat = draw(S,'cat',D.cats.length); }
  if(type==='voto'){ base.q = draw(S,'vt',D.votes.length); }
  if(type==='qf'){ const a = draw(S,'qf',D.qf.length); const tgt = pick(others(S,alvo)); base.act = D.qf[a].replace(/\{P\}/g, nm(S,tgt)); base.judge = S.cro!==alvo ? S.cro : (alvo+1)%NP(S); }
  if(type==='caos'){ base.card = G.__CLUBE_CHAOS!=null ? Math.max(0, D.chaos.findIndex(c=>c[0]===G.__CLUBE_CHAOS)) : draw(S,'ch',D.chaos.length); base.cid = D.chaos[base.card][0];
    if(base.cid==='ouro'){ base.alvo = S.cro; base.q = draw(S,'qcq',D.qcq.length); base.num = !!D.qcq[base.q][1]; }
    if(base.cid==='dupla'){ base.picker = poorest(S); } }
  S.pv = base;
  log(S, `Ronda ${S.rnd}: ${D.TYPES[type].n}`);
}
function poorest(S){ const m = Math.min(...S.players.map(p=>p.f)); return pick(S.players.map((p,k)=>k).filter(k=>S.players[k].f===m)); }
function richest(S){ const m = Math.max(...S.players.map(p=>p.f)); return pick(S.players.map((p,k)=>k).filter(k=>S.players[k].f===m)); }

// ---------- apostas ----------
function openBet(S, opts, only){
  const pv = S.pv;
  pv.bo = opts; pv.bets = {}; pv.only = only || null; pv.step = 'bet'; pv.dl = NOW()+T.bet;
  S.players.forEach((p,k)=>{ if(p.f<=0){ p.f += 10; p.debt += 15; p.st.loan = 1; toast(S, `${p.name} pediu um empréstimo ao Banco: +10 fichas (deve 15).`, 'warn'); } });
}
const pOpt = (S,k,label) => ({ id:'p'+k, p:k, l: label || nm(S,k) });
function allowedOpts(S, k){ const pv = S.pv; if(pv.only && pv.only[k]) return pv.only[k]; return pv.bo.map(o=>o.id); }
E.allowedOpts = allowedOpts;
function closeBet(S){
  const pv = S.pv;
  Object.entries(pv.bets).forEach(([k,b])=>{ const p = S.players[k]; b.a = Math.max(0, Math.min(b.a, p.f)); p.f -= b.a; });
  pv.step = 'betrev'; pv.revAt = NOW();
  pv.dl = NOW() + 2200 + T.betEach * Object.keys(pv.bets).length;
}
function resolveBets(S, winIds){
  const pv = S.pv; const res = {};
  if(!pv.bets){ pv.betRes = res; return; }
  const W = new Set(winIds);
  const correct = Object.keys(pv.bets).filter(k=>W.has(pv.bets[k].o) && pv.bets[k].a>0);
  const infl = S.flags.infl === S.rnd && S.ph!=='final';
  Object.entries(pv.bets).forEach(([k,b])=>{
    const p = S.players[k];
    if(b.a<=0){ res[k] = 0; return; }
    if(W.has(b.o)){
      const az = correct.length===1 && NP(S)>=3;
      const gain = b.a * (az?2:1) * (infl?2:1);
      p.f += b.a + gain; res[k] = gain;
      if(az){ p.st.azMax = Math.max(p.st.azMax, gain); if(b.a>=10) p.st.azGold = 1; res.az = +k; }
    } else {
      const extra = infl ? Math.min(p.f, b.a) : 0;
      p.f -= extra;
      if(p.so && b.a>=3 && S.ph!=='final'){ p.f += b.a + extra; p.so = false; res[k] = 0; res.so = +k; toast(S, `${p.name} usou a Segunda Oportunidade!`, 'good'); }
      else res[k] = -(b.a+extra);
    }
  });
  pv.betRes = res;
}
function finish(S, W, winIds, opt){
  opt = opt || {};
  const pv = S.pv;
  resolveBets(S, winIds || W.map(k=>'p'+k));
  const prize = opt.noPrize ? 0 : (opt.prize != null ? opt.prize : E.lim(S).prize) * (opt.mult||1);
  W.forEach(k=>{ S.players[k].f += prize; S.players[k].st.wins++; });
  pv.W = W; pv.prize = prize; pv.winIds = winIds || W.map(k=>'p'+k);
  pv.step = 'result'; pv.dl = NOW() + T.result;
  if(W.length) log(S, `Venceu: ${W.map(k=>nm(S,k)).join(', ')}`);
}
function endRound(S){
  S.cro = (S.cro + 1) % NP(S);
  if(S.ph==='final'){ endGame(S); return; }
  nextRound(S);
}

// ---------- avançar (input completo, prazo ou "avançar") ----------
function advance(S){
  const pv = S.pv; if(!pv) return;
  const n = NP(S), all = range(n);
  if(pv.type==='intro'){ nextRound(S); return; }
  if(pv.step==='spin'){ if(!pv.res){ spin(S); return; } startType(S, pv.res); return; }
  if(pv.step==='result' || pv.step==='event'){ endRound(S); return; }
  if(pv.step==='bet'){ closeBet(S); return; }
  const t = pv.type;
  // —— QCQ / final / ouro ——
  if(t==='qcq' || t==='final' || (t==='caos' && pv.cid==='ouro')){
    if(pv.step==='intro'){
      if(t==='final'){ openBet(S, all.map(k=>pOpt(S,k))); return; }
      if(t==='caos'){ askQ(S); return; }
      openBet(S, others(S,pv.alvo).map(k=>pOpt(S,k)).concat([{ id:'p'+pv.alvo, p:pv.alvo, l:'Ninguém acerta (vence o Alvo)' }]),
        Object.fromEntries([[pv.alvo, ['p'+pv.alvo]]]));
      return;
    }
    if(pv.step==='betrev'){ askQ(S); return; }
    if(pv.step==='ans'){
      pv.order = sh(others(S,pv.alvo).filter(k=>pv.ans[k]!=null));
      pv.step = 'reveal'; pv.revAt = NOW(); pv.dl = NOW() + T.revEach*(pv.order.length+1) + 2500; return;
    }
    if(pv.step==='reveal'){
      const truth = pv.ans[pv.alvo];
      if(pv.num){
        const tv = parseFloat(String(truth).replace(',','.'));
        let best = Infinity; const dist = {};
        pv.order.forEach(k=>{ const g = parseFloat(String(pv.ans[k]).replace(',','.')); if(!isNaN(g) && !isNaN(tv)){ dist[k]=Math.abs(g-tv); best=Math.min(best,dist[k]); } });
        pv.ok = pv.order.filter(k=>dist[k]===best && best!==Infinity);
        afterJudge(S); return;
      }
      pv.step = 'judge'; pv.dl = NOW()+T.judge;
      pv.ok = pv.order.filter(k=>truth!=null && norm(pv.ans[k])===norm(truth));
      return;
    }
    if(pv.step==='judge'){ afterJudge(S); return; }
  }
  // —— Mentiroso ——
  if(t==='ment' && pv.sub==='2v'){
    if(pv.step==='intro'){ pv.step='lie'; pv.dl=NOW()+T.prep; return; }
    if(pv.step==='lie'){ if(!pv.lie) pv.lie = 1+(Math.random()*3|0); openBet(S, [{id:'L:eng',l:'O Alvo engana a mesa'},{id:'L:apa',l:'A mesa apanha a mentira'}]); return; }
    if(pv.step==='betrev'){ pv.step='tell'; pv.dl=NOW()+T.tell; return; }
    if(pv.step==='tell'){ pv.step='vote'; pv.votes={}; pv.dl=NOW()+T.vote; return; }
    if(pv.step==='vote'){ pv.step='reveal'; pv.revAt=NOW(); pv.dl=NOW()+T.voteEach*Object.keys(pv.votes).length+5000; return; }
    if(pv.step==='reveal'){
      const voters = Object.keys(pv.votes).map(Number);
      const ok = voters.filter(k=>+pv.votes[k]===+pv.lie);
      const alvoW = ok.length*2 < voters.length;
      pv.ok = ok; pv.alvoW = alvoW;
      finish(S, alvoW ? [pv.alvo] : ok, [alvoW ? 'L:eng' : 'L:apa']); return;
    }
  }
  if(t==='ment' && pv.sub==='imp'){
    if(pv.step==='intro'){ pv.step='deal'; pv.dl=NOW()+T.deal; return; }
    if(pv.step==='deal'){ openBet(S, all.map(k=>pOpt(S,k)), Object.fromEntries([[pv.imp, others(S,pv.imp).map(k=>'p'+k)]])); return; }
    if(pv.step==='betrev'){ pv.step='words'; pv.order=sh(all.slice()); pv.wi=0; pv.wAt=NOW(); pv.dl=NOW()+T.word; return; }
    if(pv.step==='words'){
      pv.wi++;
      if(pv.wi >= pv.order.length*2){ pv.step='vote'; pv.votes={}; pv.dl=NOW()+T.vote; return; }
      pv.wAt=NOW(); pv.dl=NOW()+T.word; return;
    }
    if(pv.step==='vote'){ pv.step='reveal'; pv.revAt=NOW(); pv.dl=NOW()+T.voteEach*Object.keys(pv.votes).length+6000; return; }
    if(pv.step==='reveal'){
      const cnt = tally(pv.votes); const mx = Math.max(0, ...Object.values(cnt));
      pv.caught = mx>0 && cnt[pv.imp]===mx;
      if(pv.caught){ pv.step='guess'; pv.dl=NOW()+T.guess; return; }
      impEnd(S); return;
    }
    if(pv.step==='guess'){ impEnd(S); return; }
  }
  // —— Duelo (e Dupla ou Nada) ——
  if(t==='duelo' || (t==='caos' && pv.cid==='dupla')){
    if(pv.step==='intro'){ pv.step='pick'; pv.dl=NOW()+T.pick; return; }
    if(pv.step==='pick'){
      if(!pv.duo){ if(t==='duelo'){ pv.duo = sh(all.slice()).slice(0,2); } else { pv.duo=[pv.picker, pick(others(S,pv.picker))]; } }
      pv.dc = draw(S,'du',D.duels.length); pv.step='card'; pv.dl=NOW()+T.card; return;
    }
    if(pv.step==='card'){
      if(t==='duelo'){ openBet(S, pv.duo.map(k=>pOpt(S,k))); return; }
      pv.step='play'; pv.playAt=NOW(); pv.dl=NOW()+D.duels[pv.dc][2]*1000+30000; return;
    }
    if(pv.step==='betrev'){ pv.step='play'; pv.playAt=NOW(); pv.dl=NOW()+D.duels[pv.dc][2]*1000+30000; return; }
    if(pv.step==='play'){ pv.step='vote'; pv.votes={}; pv.dl=NOW()+T.vote; return; }
    if(pv.step==='vote'){
      const cnt = tally(pv.votes); const a=cnt[pv.duo[0]]||0, b=cnt[pv.duo[1]]||0;
      const W = a>b ? [pv.duo[0]] : b>a ? [pv.duo[1]] : pv.duo.slice();
      if(t==='duelo'){ finish(S, W); return; }
      // dupla ou nada
      const ch = pv.duo[0], op = pv.duo[1]; const P=S.players;
      pv.msg = [];
      if(W.length===1 && W[0]===ch){ const x=Math.min(10,P[op].f); P[op].f-=x; P[ch].f+=x; pv.msg.push(`${nm(S,ch)} ganhou e recebe ${x} fichas de ${nm(S,op)}!`); }
      else if(W.length===1){ const x=Math.min(3,P[ch].f); P[ch].f-=x; P[op].f+=x; pv.msg.push(`${nm(S,ch)} perdeu e paga ${x} fichas a ${nm(S,op)}.`); }
      else pv.msg.push('Empate! Ninguém paga nada.');
      pv.W=W; pv.step='event'; pv.dl=NOW()+T.event; return;
    }
  }
  // —— Leilão ——
  if(t==='leilao'){
    if(pv.step==='intro'){
      pv.order = range(n).map(i=>(S.cro+1+i)%n); pv.act = pv.order.slice(); pv.hi=0; pv.hk=-1; pv.prev=-1; pv.cur=pv.order[0]; pv.hist=[];
      pv.step='auc'; pv.dl=NOW()+T.auc; return;
    }
    if(pv.step==='auc'){ // tempo esgotado para o licitador atual
      const k = pv.cur;
      if(pv.hk<0) aucBid(S,k,3); else aucPass(S,k);
      return;
    }
    if(pv.step==='betrev'){ pv.step='play'; pv.cnt=0; pv.playAt=NOW()+5000; pv.dl=NOW()+5000+T.cnt; return; }
    if(pv.step==='play'){ const ok = pv.cnt>=pv.hi; pv.success = ok; finish(S, [ok?pv.hk:pv.riv]); return; }
  }
  // —— Voto Secreto ——
  if(t==='voto'){
    if(pv.step==='intro'){ openBet(S, all.map(k=>pOpt(S,k))); return; }
    if(pv.step==='betrev'){ pv.step='vote'; pv.votes={}; pv.dl=NOW()+T.vote; return; }
    if(pv.step==='vote'){ pv.order = sh(Object.keys(pv.votes).map(Number)); pv.step='reveal'; pv.revAt=NOW(); pv.dl=NOW()+T.voteEach*pv.order.length+4500; return; }
    if(pv.step==='reveal'){
      const cnt = tally(pv.votes); const mx = Math.max(0,...Object.values(cnt));
      pv.el = mx>0 ? Object.keys(cnt).map(Number).filter(k=>cnt[k]===mx) : [];
      pv.step='def'; pv.dl=NOW()+T.def; return;
    }
    if(pv.step==='def'){ finish(S, pv.el); return; }
  }
  // —— Quente e Frio ——
  if(t==='qf'){
    if(pv.step==='intro'){ pv.step='secret'; pv.dl=NOW()+T.secret; return; }
    if(pv.step==='secret'){
      const only = {}; only[pv.alvo] = ['L:sim'];
      openBet(S, [{id:'L:sim',l:'Consegue'},{id:'L:nao',l:'Não consegue'}], only); return;
    }
    if(pv.step==='betrev'){ pv.step='play'; pv.temp=[]; pv.playAt=NOW()+4000; pv.dl=NOW()+4000+T.qf; return; }
    if(pv.step==='play'){ pv.success=false; finish(S, [], ['L:nao']); return; }
  }
  // —— Caos ——
  if(t==='caos'){ chaosAdvance(S); return; }
}

function askQ(S){ const pv=S.pv; pv.step='ans'; pv.ans={}; pv.dl=NOW()+T.ans; }
function afterJudge(S){
  const pv = S.pv;
  if(pv.type==='final'){
    const pts = pv.pts;
    const ok = pv.ok||[];
    others(S,pv.alvo).forEach(k=>{ if(pv.ans[k]!=null) S.players[k].st.finN++; });
    ok.forEach(k=>{ pts[k]=(pts[k]||0)+1; S.players[k].st.finOk++; });
    if(!ok.length) pts[pv.alvo]=(pts[pv.alvo]||0)+1;
    pv.hist.push({ alvo:pv.alvo, q:pv.q, ok:ok.slice() });
    pv.qi++;
    if(pv.qi >= pv.alvos.length){
      const mx = Math.max(0,...Object.values(pts));
      const W = range(NP(S)).filter(k=>(pts[k]||0)===mx && mx>0);
      finish(S, W); return;
    }
    pv.alvo = pv.alvos[pv.qi]; pv.q = pv.qs[pv.qi]; pv.num = !!D.qcq[pv.q][1]; pv.ok=null; pv.order=null;
    askQ(S); return;
  }
  if(pv.type==='caos'){ // pergunta de ouro
    const ok = pv.ok||[];
    ok.forEach(k=>S.players[k].f+=8);
    pv.msg = ok.length ? [`${ok.map(k=>nm(S,k)).join(', ')} ${ok.length>1?'ganham':'ganha'} 8 fichas!`] : ['Ninguém acertou. O Croupier é um mistério.'];
    pv.W = ok; pv.step='event'; pv.dl=NOW()+T.event; return;
  }
  const ok = pv.ok||[];
  finish(S, ok.length ? ok : [pv.alvo]);
}
function impEnd(S){
  const pv = S.pv;
  const impW = !pv.caught || pv.guessOk;
  const W = impW ? [pv.imp] : Object.keys(pv.votes).map(Number).filter(k=>+pv.votes[k]===pv.imp);
  if(impW) S.players[pv.imp].st.imp = 1;
  pv.impW = impW;
  finish(S, W, ['p'+pv.imp]);
}
function tally(votes){ const c={}; Object.values(votes||{}).forEach(v=>{ c[v]=(c[v]||0)+1; }); return c; }

function aucNextFrom(S, from){
  const pv = S.pv, o = pv.order, n = o.length;
  let i = o.indexOf(from);
  for(let s=1; s<=n; s++){ const c = o[(i+s)%n]; if(pv.act.includes(c) && c!==pv.hk) return c; }
  return -1;
}
function aucBid(S, k, v){
  const pv = S.pv;
  if(v <= pv.hi) return false;
  if(pv.hk!==k) pv.prev = pv.hk;
  pv.hi = v; pv.hk = k; pv.hist.push([k,v]);
  aucNext(S, k); return true;
}
function aucPass(S, k){
  const pv = S.pv;
  if(pv.hk<0) return aucBid(S,k,3);
  const i = pv.act.indexOf(k); if(i<0) return false;
  pv.act.splice(i,1); pv.hist.push([k,0]);
  aucNext(S, k); return true;
}
function aucNext(S, from){
  const pv = S.pv;
  const nx = aucNextFrom(S, from);
  if(nx<0 || pv.hi>=40){ // fim do leilão
    pv.riv = pv.prev>=0 ? pv.prev : (pv.hk+1)%NP(S);
    pv.cur = -1;
    openBet(S, [pOpt(S,pv.hk, `${nm(S,pv.hk)} consegue ${pv.hi}`), pOpt(S,pv.riv, `${nm(S,pv.riv)} (falha)`)]);
    return;
  }
  pv.cur = nx; pv.dl = NOW()+T.auc;
}
E.aucCur = S => { const pv=S.pv; if(!pv||pv.step!=='auc') return -1; return pv.cur; };

// ---------- Caos ----------
function chaosAdvance(S){
  const pv = S.pv, P = S.players, n = NP(S), all = range(n);
  const id = pv.cid;
  const ev = (msgs) => { pv.msg = msgs; pv.step='event'; pv.dl=NOW()+T.event; };
  if(pv.step==='intro'){
    if(id==='rev'){ const r=richest(S), p=poorest(S); if(r===p) return ev(['Estão todos iguais. A revolução fica para outro dia.']); const x=Math.min(5,P[r].f); P[r].f-=x; P[p].f+=x; return ev([`${nm(S,r)} dá ${x} fichas a ${nm(S,p)}.`]); }
    if(id==='imp'){ const ld = S.padIdx>=0 ? S.padIdx : richest(S); let tot=0; P.forEach((p,k)=>{ const x=Math.min(k===ld?4:2,p.f); p.f-=x; tot+=x; }); return ev([`O Banco cobrou ${tot} fichas. ${nm(S,ld)} pagou a dobrar.`]); }
    if(id==='ass'){ pv.step='pick1'; pv.picker=S.cro; pv.dl=NOW()+T.pick; return; }
    if(id==='esq'){ const moved = P.map((p,k)=>{ const i=Math.random()*p.k.length|0; return p.k.splice(i,1)[0]; }); moved.forEach((c,k)=>{ const to=(k+1)%n; if(c.p===to) c.p=k; P[to].k.push(c); }); return ev(['Cada um passou um contrato ao jogador seguinte. Vejam o telemóvel!']); }
    if(id==='amn'){ pv.step='swap'; pv.dl=NOW()+T.blind; return; }
    if(id==='inf'){ S.flags.infl = S.rnd+1; return ev(['Na próxima ronda as apostas certas pagam o triplo e as erradas custam o dobro.']); }
    if(id==='del'){ const r=richest(S); const i=Math.random()*P[r].k.length|0; const c=P[r].k[i]; const info=E.kInfo(S,c); P[r].k[i]=newK(S,r,[c.d]); return ev([`${nm(S,r)} tinha este contrato:`, `“${info.t}”`, 'Queimado. Tira outro.']); }
    if(id==='mer'){ pv.step='shop'; pv.dl=NOW()+T.shop; return; }
    if(id==='sil'){ S.flags.sil = S.rnd+1; return ev(['Na próxima ronda só o Croupier pode falar. Ele multa quem falar (1 ficha).']); }
    if(id==='ml'){ pv.step='law'; pv.dl=NOW()+T.law; return; }
    if(id==='cego'){ pv.step='blind'; pv.bl={}; pv.dl=NOW()+T.blind; return; }
    if(id==='trib'){ pv.crime = D.crimes[draw(S,'cr',D.crimes.length)]; pv.step='pick1'; pv.picker=S.cro===pv.alvo?(pv.alvo+1)%n:S.cro; pv.dl=NOW()+T.pick; return; }
    if(id==='jack'){ let pot=0; P.forEach(p=>{ const x=Math.min(2,p.f); p.f-=x; pot+=x; }); pv.pot=pot; pv.step='jack'; pv.jn={}; pv.dl=NOW()+T.jack; return; }
  }
  if(pv.step==='pick1'){
    if(id==='ass'){ const poor = poorest(S); const cand = others(S,S.cro).filter(k=>k!==poor && P[k].f>0); const tg = pv.tg!=null ? pv.tg : (cand.length?pick(cand):-1);
      if(tg<0) return ev(['Não havia ninguém para assaltar.']); const x=Math.min(3,P[tg].f); P[tg].f-=x; P[S.cro].f+=x; return ev([`${nm(S,S.cro)} assaltou ${nm(S,tg)}: ${x} fichas!`]); }
    if(id==='trib'){ if(pv.proc==null) pv.proc = pick(others(S,pv.alvo)); openBet(S, [{id:'L:cul',l:'Culpado'},{id:'L:ino',l:'Inocente'}]); return; }
  }
  if(pv.step==='betrev' && id==='trib'){ pv.step='speech'; pv.sp=0; pv.spAt=NOW(); pv.dl=NOW()+T.speech1; return; }
  if(pv.step==='speech'){ if(pv.sp===0){ pv.sp=1; pv.spAt=NOW(); pv.dl=NOW()+T.speech2; return; } pv.step='vote'; pv.votes={}; pv.dl=NOW()+T.vote; return; }
  if(pv.step==='vote' && id==='trib'){
    const c = tally(pv.votes); const cul=c.cul||0, ino=c.ino||0; pv.verd = cul>ino ? 'cul' : 'ino';
    pv.revAt=NOW(); pv.step='reveal'; pv.dl=NOW()+T.voteEach*Object.keys(pv.votes).length+4000; return;
  }
  if(pv.step==='reveal' && id==='trib'){ finish(S, [pv.verd==='ino'?pv.alvo:pv.proc], [pv.verd==='ino'?'L:ino':'L:cul']); return; }
  if(pv.step==='swap' || pv.step==='shop'){ return ev([id==='amn'?'Amnistia encerrada.':'O Mercado Negro fechou.']); }
  if(pv.step==='law'){ const t = (pv.lawT||'').trim() || 'Ninguém pode dizer "sim" nem "não".'; S.flags.ml = { t, until:S.rnd+1, by:nm(S,S.cro) }; return ev(['Nova Lei Marcial:', `“${t}”`]); }
  if(pv.step==='blind'){ const e=Object.entries(pv.bl).filter(([k,v])=>v>0); if(!e.length) return ev(['Ninguém licitou. A carta volta para o Banco.']);
    const mx=Math.max(...e.map(x=>x[1])); const w=+pick(e.filter(x=>x[1]===mx))[0]; const x=Math.min(mx,P[w].f); P[w].f-=x; P[w].so=true; pv.blRev=true;
    return ev([`${nm(S,w)} pagou ${x} fichas e fica com a Segunda Oportunidade.`]); }
  if(pv.step==='jack'){
    pv.target = 1+(Math.random()*20|0);
    const e = Object.entries(pv.jn); pv.revAt=NOW();
    if(!e.length){ pv.msg=['Ninguém jogou. O pote fica no Banco.']; pv.step='jrev'; pv.dl=NOW()+6000; return; }
    const best = Math.min(...e.map(x=>Math.abs(x[1]-pv.target)));
    const W = e.filter(x=>Math.abs(x[1]-pv.target)===best).map(x=>+x[0]);
    const each = Math.floor(pv.pot/W.length); W.forEach(k=>P[k].f+=each);
    pv.W=W; pv.msg=[`Saiu o ${pv.target}! ${W.map(k=>nm(S,k)).join(' e ')} ${W.length>1?'levam':'leva'} ${each} fichas.`];
    pv.step='jrev'; pv.dl=NOW()+T.event+2000; return;
  }
  if(pv.step==='jrev'){ pv.step='event'; endRound(S); return; }
}

// ---------- final ----------
function startFinal(S){
  S.ph = 'final';
  const n = NP(S);
  const alvos = []; const base = sh(range(n));
  for(let i=0;i<5;i++) alvos.push(base[i%n]);
  const qs = alvos.map(()=>draw(S,'qcq',D.qcq.length));
  S.pv = { type:'final', step:'intro', alvos, qs, qi:0, alvo:alvos[0], q:qs[0], num:!!D.qcq[qs[0]][1], pts:{}, hist:[], dl:NOW()+T.intro+6000 };
  log(S, 'A Grande Final: O Último Golpe');
}
function endGame(S){
  let guard=0; while(S.chk && guard++<20) resolveChk(S);
  S.accOpt = {}; S.accFx = null;
  S.ph = 'end'; S.endAt = NOW();
  const tot = k => S.players[k].f - S.players[k].debt;
  const rank = range(NP(S)).sort((a,b)=> tot(b)-tot(a) || S.players[b].st.kc - S.players[a].st.kc || S.players[b].st.wins - S.players[a].st.wins);
  S.rank = rank;
  S.pv = { type:'end', step:'end' };
  toast(S, `${nm(S,rank[0])} é o novo Padrinho!`, 'good');
}
E.total = (S,k) => S.players[k].f - S.players[k].debt;

// ---------- comandos ----------
E.cmd = (S, k, c) => {
  if(!c || typeof c.a!=='string') return;
  const pv = S.pv, P = S.players, host = k===-1;
  const me = P[k];
  if(!host && !me) return;
  const a = c.a;
  // —— ações a qualquer momento ——
  if(a==='give' && me && S.ph!=='lobby' && S.ph!=='end'){ const t=c.t|0, x=Math.max(0,Math.min(c.n|0, me.f)); if(t!==k && P[t] && x>0){ me.f-=x; P[t].f+=x; toast(S, `${me.name} deu ${x} ficha${x>1?'s':''} a ${P[t].name}.`, 'info'); } return; }
  if(a==='cumpri' && me && (S.ph==='play'||S.ph==='final')){
    const ci=c.ci|0; const kc=me.k[ci]; if(!kc) return;
    if((S.chk && S.chk.k===k) || S.chkQ.some(q=>q.k===k)) return;
    const q = { k, d:kc.d, p:kc.p, votes:{} };
    if(S.chk) S.chkQ.push(q); else { q.dl=NOW()+T.chk; S.chk=q; }
    return;
  }
  if(a==='conf' && me && S.chk && S.chk.k!==k){ S.chk.votes[k] = c.y?1:0; if(Object.keys(S.chk.votes).length >= NP(S)-1) resolveChk(S); return; }
  if(a==='chkset' && host && S.chk){ resolveChk(S, !!c.y); return; }
  if(a==='accStart' && me && S.ph!=='lobby' && S.ph!=='end'){
    const t=c.t|0; if(t===k || !P[t] || me.accR===S.rnd || !P[t].k.length) return;
    const real = P[t].k.map(x=>({d:x.d,p:x.p}));
    const ex = real.map(x=>x.d); const opts = real.slice();
    while(opts.length<8){ const dc=decoy(S,t,ex); ex.push(dc.d); opts.push(dc); }
    S.accOpt[k] = { t, o: sh(opts) }; return;
  }
  if(a==='accCancel' && me){ delete S.accOpt[k]; return; }
  if(a==='acc' && me && S.accOpt[k]){
    const ao = S.accOpt[k]; delete S.accOpt[k];
    if(me.accR===S.rnd) return;
    const o = ao.o[c.i|0]; if(!o) return; const t = ao.t; const tp = P[t];
    me.accR = S.rnd;
    const hit = tp.k.findIndex(x=>x.d===o.d && x.p===o.p);
    const info = E.kInfo(S, o);
    if(hit>=0){ me.f += info.v; me.st.accH++; tp.st.hitBy++; tp.k[hit] = newK(S,t,[o.d]);
      S.accFx = { n:S.tn+1, k, t, txt:info.t, ok:1, v:info.v, at:NOW() }; toast(S, `${me.name} apanhou ${tp.name}! +${info.v} fichas.`, 'good'); }
    else { const x=Math.min(3,me.f); me.f-=x; tp.f+=x;
      S.accFx = { n:S.tn+1, k, t, txt:info.t, ok:0, v:x, at:NOW() }; toast(S, `${me.name} acusou ${tp.name} sem razão e pagou ${x} fichas.`, 'bad'); }
    return;
  }
  if(a==='fine' && me && k===S.padIdx && S.finesUsed<5 && S.ph!=='end'){ const t=c.t|0; if(t!==k && P[t] && P[t].f>0){ P[t].f--; me.f++; S.finesUsed++; toast(S, `O Padrinho multou ${P[t].name} por quebrar a lei (1 ficha).`, 'warn'); } return; }
  if(a==='sfine' && me && k===S.cro && S.flags.sil===S.rnd){ const t=c.t|0; if(t!==k && P[t] && P[t].f>0){ P[t].f--; toast(S, `🤫 ${P[t].name} falou durante o silêncio. Multa de 1 ficha.`, 'warn'); } return; }
  if(a==='law' && me && S.ph==='end' && S.rank && S.rank[0]===k){ S.newLaw = String(c.t||'').slice(0,140); return; }
  if(a==='start' && host && S.ph==='lobby' && NP(S)>=3){ E.start(S, c.opts||{}); return; }
  if(a==='endNow' && host && S.ph==='play'){ S.nR = Math.max(1, S.rnd); toast(S, 'Esta é a última ronda antes da Grande Final.', 'warn'); return; }
  if(!pv) return;
  // —— avançar ——
  if(a==='go'){
    if(!(host || k===S.cro || (pv.step==='words' && pv.order && pv.order[pv.wi % pv.order.length]===k) || (pv.step==='tell' && k===pv.alvo) || (pv.step==='speech' && ((pv.sp===0&&k===pv.proc)||(pv.sp===1&&k===pv.alvo))) || (pv.step==='def' && pv.el && pv.el.includes(k)))) return;
    if(pv.step==='spin' && !pv.res){ spin(S); return; }
    if(pv.step==='spin' || pv.step==='betrev' || pv.step==='reveal' || pv.step==='jrev') { if(!host) return; }
    advance(S); return;
  }
  if(a==='spin' && (host || k===S.cro) && pv.step==='spin'){ spin(S); return; }
  if(host) { if(a==='qfok' && pv.type==='qf' && pv.step==='play'){ pv.success=true; finish(S,[pv.alvo],['L:sim'],{mult:2}); } if(a==='guessOk' && pv.step==='guess'){ pv.guessOk=true; impEnd(S); } return; }
  // —— apostas ——
  if(a==='bet' && pv.step==='bet'){
    const ok = allowedOpts(S,k); if(!ok.includes(c.o)) return;
    const r = betRange(S,k); const amt = Math.max(r.min, Math.min(r.max, c.n|0));
    pv.bets[k] = { o:c.o, a:amt };
    if(Object.keys(pv.bets).length >= NP(S)) closeBet(S);
    return;
  }
  // —— respostas QCQ ——
  if(a==='ans' && pv.step==='ans'){ const v=String(c.v==null?'':c.v).trim().slice(0,32); if(!v) return; pv.ans[k]=v; if(Object.keys(pv.ans).length>=NP(S)) advance(S); return; }
  if(a==='judge' && pv.step==='judge' && k===pv.alvo){ const ok=(Array.isArray(c.ok)?c.ok:[]).map(Number).filter(x=>pv.order.includes(x)); pv.ok=ok; advance(S); return; }
  // —— mentiroso ——
  if(a==='lie' && pv.step==='lie' && k===pv.alvo){ const i=c.i|0; if(i>=1&&i<=3){ pv.lie=i; advance(S); } return; }
  if(a==='vote' && pv.step==='vote'){
    if(pv.type==='ment' && pv.sub==='2v'){ if(k===pv.alvo) return; const i=c.v|0; if(i<1||i>3) return; pv.votes[k]=i; if(Object.keys(pv.votes).length>=NP(S)-1) advance(S); return; }
    if(pv.type==='ment' && pv.sub==='imp'){ const t=c.v|0; if(t===k||!P[t]) return; pv.votes[k]=t; if(Object.keys(pv.votes).length>=NP(S)) advance(S); return; }
    if(pv.type==='duelo' || pv.cid==='dupla'){ if(pv.duo.includes(k)) return; const t=c.v|0; if(!pv.duo.includes(t)) return; pv.votes[k]=t; if(Object.keys(pv.votes).length>=NP(S)-2) advance(S); return; }
    if(pv.type==='voto'){ const t=c.v|0; if(t===k||!P[t]) return; pv.votes[k]=t; if(Object.keys(pv.votes).length>=NP(S)) advance(S); return; }
    if(pv.cid==='trib'){ if(k===pv.alvo||k===pv.proc) return; if(c.v!=='cul'&&c.v!=='ino') return; pv.votes[k]=c.v; if(Object.keys(pv.votes).length>=NP(S)-2) advance(S); return; }
    return;
  }
  if(a==='guess' && pv.step==='guess' && k===pv.imp){ const g=norm(c.v), w=norm(pv.word); pv.guessV=String(c.v||'').slice(0,30); pv.guessOk = !!g && (g===w || (g.length>3 && (w.includes(g)||g.includes(w)))); impEnd(S); return; }
  if(a==='guessOk' && pv.step==='guess' && k===S.cro && k!==pv.imp){ pv.guessOk=true; impEnd(S); return; }
  // —— duelo: escolha ——
  if(a==='pick' && pv.step==='pick' && k===pv.picker){
    const ids = (Array.isArray(c.ids)?c.ids:[]).map(Number).filter(x=>P[x]);
    if(pv.type==='duelo'){ if(ids.length!==2 || ids[0]===ids[1]) return; pv.duo=ids; }
    else { if(ids.length!==1 || ids[0]===k) return; pv.duo=[k, ids[0]]; }
    advance(S); return;
  }
  if(a==='pick1' && pv.step==='pick1' && k===pv.picker){
    const t=c.t|0; if(!P[t]) return;
    if(pv.cid==='ass'){ if(t===k) return; pv.tg=t; advance(S); return; }
    if(pv.cid==='trib'){ if(t===pv.alvo) return; pv.proc=t; advance(S); return; }
  }
  // —— leilão ——
  if(a==='bid' && pv.step==='auc' && E.aucCur(S)===k){ const v=c.v|0; if(v>pv.hi && v>=3 && v<=40) aucBid(S,k,v); return; }
  if(a==='pass' && pv.step==='auc' && E.aucCur(S)===k){ aucPass(S,k); return; }
  if(a==='cnt' && pv.step==='play' && pv.type==='leilao' && NOW()>=pv.playAt-500 && (k===pv.riv || (k===S.cro && S.cro!==pv.hk && S.cro!==pv.riv))){ pv.cnt=Math.max(0,(pv.cnt|0)+((c.d|0)>0?1:-1)); return; }
  // —— quente e frio ——
  if(a==='custom' && pv.type==='qf' && pv.step==='secret' && k===pv.judge){ const t=String(c.t||'').trim().slice(0,90); if(t.length>3){ pv.act=t; pv.custom=1; } return; }
  if(a==='hot' && pv.type==='qf' && pv.step==='play' && k!==pv.alvo && NOW()>=pv.playAt-500){ pv.temp.push({k, v:c.v?1:0, t:NOW()}); if(pv.temp.length>14) pv.temp.shift(); return; }
  if(a==='qfok' && pv.type==='qf' && pv.step==='play' && k===pv.judge){ pv.success=true; finish(S,[pv.alvo],['L:sim'],{mult:2}); return; }
  // —— caos ——
  if(a==='swapk' && pv.step==='swap'){ const i=c.i|0; const old=me.k[i]; if(!old || (pv.sw&&pv.sw[k+':'+i])) return; me.k[i]=newK(S,k,[old.d]); pv.sw=pv.sw||{}; pv.sw[k+':'+i]=1; return; }
  if(a==='buyk' && pv.step==='shop'){ if(me.f>=5 && me.k.length<3){ me.f-=5; me.k.push(newK(S,k)); toast(S, `${me.name} comprou um contrato no Mercado Negro.`, 'info'); } return; }
  if(a==='lawT' && pv.step==='law' && k===S.cro){ pv.lawT=String(c.t||'').slice(0,120); advance(S); return; }
  if(a==='blind' && pv.step==='blind'){ pv.bl[k]=Math.max(0,Math.min(me.f, c.v|0)); if(Object.keys(pv.bl).length>=NP(S)) advance(S); return; }
  if(a==='jack' && pv.step==='jack'){ const v=c.v|0; if(v<1||v>20) return; pv.jn[k]=v; if(Object.keys(pv.jn).length>=NP(S)) advance(S); return; }
};

function resolveChk(S, force){
  const q = S.chk; if(!q) return;
  const v = Object.values(q.votes); const yes=v.filter(x=>x).length, no=v.length-yes;
  const ok = force!=null ? force : yes>=no;
  const p = S.players[q.k];
  const i = p.k.findIndex(x=>x.d===q.d && x.p===q.p);
  const info = E.kInfo(S, q);
  if(ok && i>=0){ p.f += info.v; p.st.kc++; p.k[i] = newK(S, q.k, [q.d]); toast(S, `✅ ${p.name} cumpriu um contrato: +${info.v} fichas.`, 'good'); q.res=1; }
  else { toast(S, `❌ A mesa não confirmou o contrato de ${p.name}.`, 'bad'); q.res=0; }
  S.chkLast = { n:S.tn, k:q.k, d:q.d, p:q.p, res:q.res, at:NOW() };
  S.chk = null;
  if(S.chkQ.length){ S.chk = S.chkQ.shift(); S.chk.dl = NOW()+T.chk; }
}

// ---------- relógio ----------
E.tick = S => {
  if(S.chk && S.chk.dl && NOW()>=S.chk.dl) resolveChk(S);
  if(S.accFx && NOW()-S.accFx.at > T.accFx) S.accFx = null;
  const pv = S.pv;
  if(!pv || !pv.dl || S.ph==='lobby' || S.ph==='end') return false;
  if(NOW() >= pv.dl){ advance(S); return true; }
  return false;
};

// ---------- o que cada jogador tem de fazer agora ----------
E.need = (S, k) => {
  const pv = S.pv, P = S.players; if(!pv || !P[k]) return null;
  const s = pv.step, t = pv.type;
  if(S.ph==='end') return S.rank && S.rank[0]===k && !S.newLaw ? { kind:'law' } : null;
  if(s==='spin') return k===S.cro && !pv.res ? { kind:'spin' } : null;
  if(s==='bet') return pv.bets[k] ? null : { kind:'bet', only: allowedOpts(S,k), ...betRange(S,k) };
  if(s==='ans') return pv.ans[k]!=null ? null : { kind:'ans', num:pv.num, alvo:k===pv.alvo };
  if(s==='judge') return k===pv.alvo ? { kind:'judge' } : null;
  if(s==='lie') return k===pv.alvo ? { kind:'lie' } : null;
  if(s==='tell') return (k===pv.alvo || k===S.cro) ? { kind:'go', l: k===pv.alvo ? 'Já contei as 3 histórias' : 'Passar à votação' } : null;

      card: 'Leiam as regras na TV', play: pv.type==='leilao' ? `${name(pv.hk)} tem 30 segundos!` : pv.type==='qf' ? (pv.alvo===me?'Ouve a mesa!':'Guiem o Alvo!') : 'Valendo!',
      auc: E && pv.cur>=0 ? `${name(pv.cur)} está a licitar…` : '', def: 'Defesa do Eleito', secret: 'A mesa está a ler a missão…', event: 'Vejam a TV', speech: pv.sp===0 ? `O Procurador ${name(pv.proc)} acusa…` : `${name(pv.alvo)} defende-se…`,
      law: `${name(pub.cro)} está a escrever a Lei Marcial…`, jrev: 'A sortear o número…', blind: 'À espera dos lances…', jack: 'À espera dos números…', vote: 'A votação está a decorrer…', ans:'À espera das respostas…',
    };
    const ic = { spin:'🎡', result:'🏆', reveal:'👀', betrev:'🪙', judge:'⚖️', play:'⏱️', words:'🗣️', tell:'🎭' }[s] || '🎩';
    const tn = pv.type && pv.type!=='intro' ? (pv.type==='final' ? '🏁 Grande Final' : pv.type==='caos' ? '🌀 '+D.chaos[pv.card][1] : pv.type==='ment' ? (pv.sub==='2v'?'🎭 Duas Verdades e Uma Mentira':'🕵️ O Impostor') : D.TYPES[pv.type].ic+' '+D.TYPES[pv.type].n) : '';
    const status = pub.ph==='play' && pub.rnd ? `<div class="muted mini" style="text-align:center;letter-spacing:.15em;text-transform:uppercase">Ronda ${pub.rnd} de ${pub.nR}${tn?' · '+esc(tn):''}</div>` : (pub.ph==='final' ? `<div class="muted mini" style="text-align:center;letter-spacing:.15em;text-transform:uppercase">Grande Final${pv.type==='final'&&pv.step!=='intro'&&pv.step!=='bet'&&pv.step!=='betrev'?' · pergunta '+(pv.qi+1)+' de 5':''}</div>` : '');
    const ctx = contextLine(pub, me, pl);
    const kn = pr.k.length;
    return status + waitBox(ic, map[s] || 'Olhem para a TV', '') + (ctx ? `<div class="pcard" style="text-align:center">${ctx}</div>` : '') + `<div class="muted mini" style="text-align:center">📜 Tens ${kn} contrato${kn>1?'s':''} por cumprir. Aproveita enquanto esperas!</div>`;
  }
  function endPad(pub, pr, me, pl, n){
    const rank = pub.rank || []; const pos = rank.indexOf(me);
    let h = `<div class="pcard" style="text-align:center"><h3>${pos===0?'👑 És o novo Padrinho!':pos===rank.length-1?'🎩 Último lugar… chapéu da vergonha!':`Ficaste em ${pos+1}.º lugar`}</h3><div class="q">${E.players(pub)[me].f - E.players(pub)[me].d} fichas</div></div>`;
    if(n && n.kind==='law') h += `<div class="pcard"><h3>Escreve a Lei do Campeão</h3><div class="muted mini">Vale durante toda a próxima sessão. Quem a quebrar paga-te 1 ficha (máx. 5).</div>
      <div class="nickchips">${['Ninguém pode dizer “sim” nem “não”.','Proibido tratar alguém pelo nome, só pela alcunha.','Antes de apostar, fazem uma vénia ao Padrinho.','Quem disser “pânico” paga 1 ficha.','Os números dizem-se em inglês.'].map(x=>`<button data-act="lawsug" data-t="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      <input class="inp" data-keep="law" id="lawI" maxlength="140" placeholder="A tua lei…" autocomplete="off"><button class="btn big" data-act="law">Decretar</button></div>`;
    else if(pub.nl) h += `<div class="pcard"><div class="lawbox">Lei do Campeão para a próxima sessão:<br>“${esc(pub.nl)}”</div></div>`;
    return h;
  }
  function kTab(pub, pr, me, pl){
    let h = `<div class="muted mini">Cumpre-os durante a noite, a qualquer momento. Quando conseguires, carrega em “Cumpri!” e a mesa confirma.</div>`;
    const pending = pub.chk && pub.chk[0]===me;
    h += pr.k.map((c,i)=>{ const info = E.kInfoPub(pub,c); return `<div class="kc"><div class="kt">${esc(info.t)}</div><div class="kv"><span>🪙 ${info.v} fichas</span><button class="btn" data-act="cumpri" data-i="${i}" ${pending?'disabled':''}>${pending?'À espera…':'Cumpri!'}</button></div></div>`; }).join('');
    h += `<div class="sep"></div><div class="pcard"><h3>🔎 Acusar alguém</h3>`;
    const used = E.players(pub)[me].acc;
    if(used) h += `<div class="muted">Já acusaste nesta ronda. Na próxima podes voltar a tentar.</div>`;
    else if(pr.acc){
      const t = pr.acc.t;
      h += `<div class="muted mini">O que achas que ${esc(pl[t].n)} anda a tentar fazer? Acertas: ganhas o valor do contrato. Erras: pagas 3 fichas.</div>`;
      h += pr.acc.o.map((c,i)=>{ const info=E.kInfoPub(pub,c); return `<button class="pbtn" style="justify-content:flex-start;text-align:left" data-act="acc" data-i="${i}">${esc(info.t)}</button>`; }).join('');
      h += `<button class="btn ghost" data-act="accCancel">Cancelar</button>`;
    } else {
      h += `<div class="muted mini">Desconfias que alguém está a cumprir um contrato? Escolhe a pessoa (1 acusação por ronda).</div><div class="pgrid">${pl.map((p,k)=>k===me?'':`<button class="pbtn" data-act="accStart" data-k="${k}"><span class="av">${p.av}</span>${esc(p.n)}</button>`).join('')}</div>`;
    }
    h += `</div>`;
    return h;
  }
  function mesaTab(pub, pr, me, pl){
    const order = pl.map((p,k)=>k).sort((a,b)=>(pl[b].f-pl[b].d)-(pl[a].f-pl[a].d));
    let h = '';
    if(pub.law) h += `<div class="pcard"><div class="lawbox">👑 Lei do Campeão${pub.lawBy?' ('+esc(pub.lawBy)+')':''}:<br>“${esc(pub.law)}”</div></div>`;
    if(pub.fl && pub.fl.ml) h += `<div class="pcard alert"><div class="lawbox">⚖️ Lei Marcial: “${esc(pub.fl.ml.t)}”</div></div>`;
    h += `<div class="pcard"><h3>Classificação</h3>${order.map((k,i)=>`<div class="pl-row"><span class="muted">${i+1}.</span><span class="av">${pl[k].av}</span><div class="n">${esc(pl[k].n)}${k===me?' (tu)':''}<small>${esc(pl[k].nk||'')}</small></div><span class="f">${pl[k].f}${pl[k].d?`<small class="muted mini"> −${pl[k].d}</small>`:''}</span></div>`).join('')}</div>`;
    h += `<div class="pcard"><h3>🤝 Dar fichas</h3><div class="muted mini">Subornos, alianças, pagamentos de promessas… Nenhuma promessa obriga ninguém.</div>
      <div class="pgrid">${pl.map((p,k)=>k===me?'':`<button class="pbtn ${giveT===k?'on':''}" data-act="givet" data-k="${k}"><span class="av">${p.av}</span>${esc(p.n)}</button>`).join('')}</div>
      <div class="stepper"><button data-act="gived" data-d="-1">−</button><span class="val">${giveN}</span><button data-act="gived" data-d="1">+</button></div>
      <button class="btn big" data-act="give" ${giveT!=null&&giveN<=pl[me].f?'':'disabled'}>Dar ${giveN} ficha${giveN>1?'s':''}${giveT!=null?' a '+esc(pl[giveT].n):''}</button></div>`;
    if(pub.pad===me && pub.law) h += `<div class="pcard"><h3>👑 Multar quem quebrou a tua lei</h3><div class="muted mini">1 ficha por multa (${5-(pub.fu||0)} restantes nesta sessão).</div><div class="pgrid">${pl.map((p,k)=>k===me?'':`<button class="pbtn" data-act="fine" data-k="${k}" ${(pub.fu||0)>=5?'disabled':''}><span class="av">${p.av}</span>${esc(p.n)}</button>`).join('')}</div></div>`;
    if(pub.cro===me && pub.fl && pub.fl.sil===pub.rnd) h += `<div class="pcard alert"><h3>🤫 Multar quem falou</h3><div class="pgrid">${pl.map((p,k)=>k===me?'':`<button class="pbtn" data-act="sfine" data-k="${k}"><span class="av">${p.av}</span>${esc(p.n)}</button>`).join('')}</div></div>`;
    h += `<div class="pcard"><h3>Regras rápidas</h3><details class="rules"><summary>Como funciona uma ronda</summary><p>O Croupier gira a roleta. Todos apostam em segredo, joga-se a prova e paga-se: aposta certa dobra; se fores o único a acertar, triplica. O vencedor da prova ganha ainda o prémio da fase (3 fichas no Aquecimento, 5 na Escalada).</p></details>
      ${Object.entries(D.TYPES).map(([k,t])=>`<details class="rules"><summary>${t.ic} ${t.n}</summary><p>${esc(t.d)}</p></details>`).join('')}
      <details class="rules"><summary>📜 Contratos e acusações</summary><p>Cumpre um contrato, carrega em “Cumpri!” e a mesa confirma. Uma vez por ronda podes acusar alguém: escolhes o que achas que ele está a tentar fazer entre 8 hipóteses. Acertas: ganhas o valor do contrato dele. Erras: pagas-lhe 3.</p></details>
      <details class="rules"><summary>🏁 A Grande Final</summary><p>Apostas pelo menos metade das tuas fichas em quem vai ganhar O Interrogatório: 5 perguntas sobre o grupo. Quem acertar mais leva 10 fichas. Mais fichas no fim (menos dívidas) = Padrinho.</p></details></div>`;
    return h;
  }
  // ações
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
    const a = b.dataset.act, pub = api.pub(), pr = api.priv(), me = api.me();
    const send = c => { api.send(c); };
    Sound.unlock();
    switch(a){
      case 'spin': send({a:'spin'}); break;
      case 'betsel': betSel = b.dataset.id; render(); break;
      case 'amt': { const n = pr.need; betAmt = Math.max(n.min, Math.min(n.max, betAmt + (+b.dataset.d))); render(); break; }
      case 'amtset': betAmt = +b.dataset.v; render(); break;
      case 'bet': if(betSel){ send({a:'bet', o:betSel, n:betAmt}); betSel=null; betAmt=null; } break;
      case 'ans': { const v = ($('#ansI',root)||{}).value; if(v && v.trim()){ send({a:'ans', v:v.trim()}); $('#ansI',root).value=''; } break; }
      case 'jsel': { const k=+b.dataset.k; judgeSel = judgeSel.includes(k) ? judgeSel.filter(x=>x!==k) : judgeSel.concat([k]); render(); break; }
      case 'judge': send({a:'judge', ok:judgeSel||[]}); judgeSel=null; break;
      case 'lie': send({a:'lie', i:+b.dataset.i}); break;
      case 'go': send({a:'go'}); break;
      case 'vote': send({a:'vote', v: isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v}); break;
      case 'guess': { const v = ($('#guessI',root)||{}).value; if(v && v.trim()) send({a:'guess', v:v.trim()}); break; }
      case 'psel': { const k=+b.dataset.k, n=+b.dataset.n; if(pickSel.includes(k)) pickSel=pickSel.filter(x=>x!==k); else { pickSel.push(k); if(pickSel.length>n) pickSel.shift(); } render(); break; }
      case 'pick': send({a:'pick', ids:pickSel}); pickSel=[]; break;
      case 'pick1': send({a:'pick1', t:+b.dataset.k}); break;
      case 'bidd': bidV = Math.max(Math.max(3,(pr.need&&pr.need.hi||0)+1), Math.min(40, bidV + (+b.dataset.d))); render(); break;
      case 'bid': send({a:'bid', v:bidV}); bidV=null; break;
      case 'pass': send({a:'pass'}); break;
      case 'cnt': send({a:'cnt', d:+b.dataset.d}); break;
      case 'hot': send({a:'hot', v:+b.dataset.v}); (+b.dataset.v ? Sound.hot : Sound.cold)(); break;
      case 'qfok': send({a:'qfok'}); break;
      case 'custom': { const v = ($('#custI',root)||{}).value; if(v && v.trim().length>3){ send({a:'custom', t:v.trim()}); showToast('Missão alterada. Contem aos outros (sem o Alvo ouvir)!','good'); } break; }
      case 'swapk': send({a:'swapk', i:+b.dataset.i}); break;
      case 'buyk': send({a:'buyk'}); break;
      case 'mlaw': { const v = ($('#mlI',root)||{}).value; send({a:'lawT', t:(v||'').trim()}); break; }
      case 'bld': blindV = Math.max(0, Math.min(E.players(pub)[me].f, blindV + (+b.dataset.d))); render(); break;
      case 'blind': send({a:'blind', v:blindV}); break;
      case 'jack': send({a:'jack', v:+b.dataset.v}); break;
      case 'lawsug': { const i=$('#lawI',root); if(i) i.value = b.dataset.t; break; }
      case 'law': { const v = ($('#lawI',root)||{}).value; if(v && v.trim()) send({a:'law', t:v.trim()}); break; }
      case 'conf': send({a:'conf', y:+b.dataset.y}); ovl.innerHTML=''; lastHash.o='x'; break;
      case 'cumpri': send({a:'cumpri', ci:+b.dataset.i}); showToast('A mesa vai confirmar na TV e nos telemóveis…'); break;
      case 'accStart': accT = +b.dataset.k; send({a:'accStart', t:accT}); break;
      case 'accCancel': accT=null; send({a:'accCancel'}); break;
      case 'acc': { const i=+b.dataset.i; const info = E.kInfoPub(pub, pr.acc.o[i]);
        ovl.innerHTML = `<div class="modal"><div class="card deco-c"><div class="kicker gold" style="letter-spacing:.3em;font-size:.8em">ACUSAR?</div><div>${esc(pub.P[pr.acc.t][0])} anda a tentar…</div><div class="ktext" style="font-size:1.25em">“${esc(info.t)}”</div><div class="muted mini">Certo: ganhas ${info.v} fichas. Errado: pagas 3.</div><div class="pgrid"><button class="btn red" data-act="accYes" data-i="${i}">Acuso!</button><button class="btn ghost" data-act="accNo">Afinal não</button></div></div></div>`; lastHash.o='acc'; break; }
      case 'accYes': send({a:'acc', i:+b.dataset.i}); accT=null; ovl.innerHTML=''; lastHash.o='x'; break;
      case 'accNo': ovl.innerHTML=''; lastHash.o='x'; break;
      case 'givet': giveT = +b.dataset.k; render(); break;
      case 'gived': giveN = Math.max(1, Math.min(Math.max(1,E.players(pub)[me].f), giveN + (+b.dataset.d))); render(); break;
      case 'give': if(giveT!=null){ send({a:'give', t:giveT, n:giveN}); showToast(`Deste ${giveN} ficha(s) a ${pub.P[giveT][0]}.`,'good'); giveT=null; giveN=1; } break;
      case 'fine': send({a:'fine', t:+b.dataset.k}); break;
      case 'sfine': send({a:'sfine', t:+b.dataset.k}); break;
    }
  });
  return { render, reset(){ lastHash={}; } };
}

// relógios (TV e comando): elementos com data-dl, em hora da TV
function tickTimers(root, off){
  const now = Date.now() + (off||0);
  $$('[data-dl]', root).forEach(el=>{
    const dl = +el.dataset.dl; const rem = Math.max(0, Math.ceil((dl-now)/1000));
    const tv = el.querySelector('.tv'); const txt = fmtT(rem); if(tv && tv.textContent!==txt) tv.textContent = txt;
    if(!el.dataset.tot) el.dataset.tot = Math.max(1, dl - now);
    const rg = el.querySelector('.rg'); if(rg) rg.style.strokeDashoffset = String(94.2 * (1 - Math.max(0, Math.min(1, (dl-now)/(+el.dataset.tot)))));
    el.classList.toggle('low', rem<=10 && rem>0);
  });
}

// =====================================================================
const TV = (()=>{
  let S, lastN = {}, acks = {}, peerCids = new Set(), seenAt = {}, dirty = true, lastSend = 0, liga = {}, ligaBase = null, db = null, saved = false, nonce = 0;
  let stageKeyPrev = '', ovKeyPrev = '', prevF = {}, localSel = -1, localCover = true, localMin = false, lt0 = '', localPad = null, lastBetsN = 0, lastTickSec = -1, pendingClaims = {}, endSaveT = null;
  const T = () => Date.now();

  async function start(){
    S = E.newState();
    S.code = String(1000 + Math.floor(Math.random()*9000));
    S.nRopt = 6;
    $('#tv').classList.add('show');
    $('#tv').innerHTML = `<div class="top"><div class="logo">O Clube</div><div class="rnd" id="rnd"></div><div id="chips" class="row" style="gap:.5em;flex-wrap:nowrap"></div><div class="law" id="law"></div><div class="hostc" id="hostc"></div></div>
      <div class="stage" id="stage"></div><div class="side" id="side"><div class="rank"><h3>Fichas</h3><div id="rk" style="position:relative"></div></div></div><div class="ticker" id="ticker"></div><div id="ov"></div><div id="lpw"></div>`;
    $('#tv').classList.add('deco');
    hostControls();
    loadLiga();
    const ok = await Net.connect(S.code);
    S.netOk = ok;
    if(ok){ Net.A.onPeers(ch => onPeers(ch.peers)); }
    setInterval(loop, 200);
    setInterval(()=>sendState(true), 2500);
    document.addEventListener('visibilitychange', ()=>sendState(true));
    loop();
  }
  async function loadLiga(){
    const local = LS.get('clube-liga'); if(local){ try{ liga = JSON.parse(local)||{}; }catch(e){} }
    try{
      db = await window.claude.use('db');
      if(db){
        const t = setTimeout(()=>{}, 10000);
        const snap = await db.doc('liga/atual').get(); clearTimeout(t);
        if(snap.exists){ liga = JSON.parse(JSON.stringify(snap.data()||{})); LS.set('clube-liga', JSON.stringify(liga)); }
      }
    }catch(e){ db = null; }
    dirty = true; stageKeyPrev='';
  }
  async function saveLiga(){
    LS.set('clube-liga', JSON.stringify(liga));
    if(db){ try{ await db.doc('liga/atual').set(liga); }catch(e){ try{ await new Promise(r=>setTimeout(r,1500)); await db.doc('liga/atual').set(liga); }catch(e2){} } }
  }
  function hostControls(){
    $('#hostc').innerHTML = `<button id="hGo" title="Avançar">⏭</button><button id="hPause" title="Pausa">⏸</button><button id="hSnd" title="Som">${Sound.on?'🔊':'🔇'}</button><button id="hMus" title="Música">${Sound.music?'🎵':'🎶'}</button><button id="hEnd" title="Ir para a Grande Final">🏁</button><button id="hFs" title="Ecrã inteiro">⛶</button>`;
    $('#hGo').onclick = () => { Sound.unlock(); if(S.pz) return; E.cmd(S,-1,{a:'go'}); dirty=true; };
    $('#hPause').onclick = () => togglePause();
    $('#hSnd').onclick = e => { e.target.textContent = Sound.toggle()?'🔊':'🔇'; };
    $('#hMus').onclick = e => { Sound.unlock(); e.target.textContent = Sound.toggleMusic()?'🎵':'🎶'; };
    $('#hEnd').onclick = () => { if(S.ph==='play') modal('Terminar depois desta ronda e passar à <b>Grande Final</b>?', 'Ir para a Grande Final', ()=>{ E.cmd(S,-1,{a:'endNow'}); dirty=true; }); };
    $('#hFs').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){} };
  }
  function togglePause(){
    if(S.ph==='lobby'||S.ph==='end') return;
    if(!S.pz){ S.pz = T(); }
    else { const d = T() - S.pz; S.pz = 0; const pv=S.pv;
      if(pv){ ['dl','revAt','spinAt','playAt','wAt','spAt'].forEach(f=>{ if(pv[f]) pv[f]+=d; }); if(pv.temp) pv.temp.forEach(x=>x.t+=d); }
      if(S.chk && S.chk.dl) S.chk.dl += d; if(S.accFx) S.accFx.at += d; nonce++; }
    dirty = true;
  }

  // ---------- rede ----------
  function onPeers(peers){
    const now = T(); const cur = new Set();
    peers.forEach(peer=>{
      const pr = peer.presence || {};
      if(pr.role!=='pad' || pr.code!==S.code || typeof pr.cid!=='string') return;
      const cid = pr.cid.slice(0,20); cur.add(cid); seenAt[cid] = now;
      let pi = S.players.findIndex(p=>p.cid===cid);
      if(S.ph==='lobby' && pr.join && typeof pr.join.nm==='string'){
        const j = pr.join; const nm = j.nm.trim().slice(0,14) || 'Jogador';
        if(pi<0){
          if(S.players.length<10){ E.addPlayer(S, { name:uniqName(nm), nick:String(j.nk||'').slice(0,24), av:j.av, cid, cust:j.cu }); Sound.bell(); dirty=true; }
        } else { const p=S.players[pi];
          if(p.name!==nm || p.nick!==j.nk || p.av!==j.av){ if(p.name!==nm) p.name=uniqName(nm, pi); p.nick=String(j.nk||'').slice(0,24); if(j.av && !S.players.some((q,k)=>k!==pi&&q.av===j.av)) p.av=j.av; dirty=true; }
          setCust(pi, j.cu);
        }
        pi = S.players.findIndex(p=>p.cid===cid);
      }
      // retomar lugar
      if(pi<0 && S.ph!=='lobby' && typeof pr.claim==='number'){
        const k = pr.claim; const q = S.players[k];
        if(q){ const free = q.local || !peerCids.has(q.cid) || (now - (seenAt[q.cid]||0) > 8000);
          if(free){ grantSeat(k, cid); pi = k; }
          else if(!pendingClaims[cid+':'+k]){ pendingClaims[cid+':'+k] = 1; askClaim(k, cid); } }
      }
      const c = pr.cmd;
      if(pi>=0 && c && typeof c.n==='number' && c.n > (lastN[cid]||0)){
        lastN[cid] = c.n; acks[cid] = c.n;
        if(!S.pz || c.a==='conf'){ handlePadCmd(pi, c); }
        dirty = true;
      }
    });
    peerCids = cur;
    dirty = true;
    // a rede acorda a TV mesmo se o separador estiver em segundo plano
    if(!S.pz && S.ph!=='lobby' && S.ph!=='end') E.tick(S);
    sendState(false);
  }
  function setCust(pi, cu){ const t = String(cu||'').trim(); const i = S.cust.findIndex(c=>c.by===pi); if(t.length>5){ if(i>=0) S.cust[i].t=t.slice(0,90); else S.cust.push({t:t.slice(0,90), v:5, by:pi}); } else if(i>=0 && S.ph==='lobby'){ S.cust.splice(i,1); } }
  function uniqName(nm, self){ let n=nm, i=2; while(S.players.some((p,k)=>k!==self && p.name.toLowerCase()===n.toLowerCase())) n = nm.slice(0,12)+' '+(i++); return n; }
  function grantSeat(k, cid){ const q=S.players[k]; q.cid=cid; q.local=false; lastN[cid]=0; E.toast(S, `📱 ${q.name} voltou a ligar o comando.`, 'good'); Sound.bell(); dirty=true; if(localSel===k) localSel=-1; }
