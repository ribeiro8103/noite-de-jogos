    if(t==='qcq' || t==='final' || pv.cid==='ouro'){
      const qh = t==='final' ? `<div class="kicker">Pergunta ${pv.qi+1} de 5 · sobre ${who(pv.alvo)}</div>` : '';
      const pts = t==='final' ? `<div class="row mini">${S.players.map((p,k)=>`<span class="chip">${p.av} ${esc(p.name)} <b class="gold">${pv.pts[k]||0}</b></span>`).join('')}</div>` : '';
      if(s==='ans') return `<div class="sg enter">${t==='final'?'':head(pv)}${qh}${ctxQ(pv)}<h2>Escrevam a resposta no telemóvel</h2><div class="muted">${who(pv.alvo)} escreve a verdade · os outros adivinham</div><div class="row"><span class="chip">✍️ <span id="cntn"></span></span>${timerH(pv.dl)}</div>${pts}</div>`;
      if(s==='reveal' || s==='judge'){
        const ord = pv.order || []; const truthAt = pv.revAt + E.T.revEach*(ord.length+1);
        const shownAll = s==='judge';
        return `<div class="sg">${qh}${ctxQ(pv)}<div class="ans-grid flip">${ord.map((k,i)=>`<div class="acard ${shownAll?'shown on':''} ${s==='judge'&&(pv.ok||[]).includes(k)?'ok':''}" ${shownAll?'':`data-at="${pv.revAt+(i+1)*E.T.revEach}" data-snd="flip"`}><div class="f"></div><div class="b"><small>${S.players[k].av} ${esc(S.players[k].name)}</small><div class="txt">${esc(pv.ans[k])}</div></div></div>`).join('')}
          <div class="acard truth ${shownAll?'shown on':''}" ${shownAll?'':`data-at="${truthAt}" data-snd="stamp"`}><div class="f"></div><div class="b"><small>A VERDADE · ${esc(S.players[pv.alvo].name)}</small><div class="txt">${esc(pv.ans[pv.alvo]==null?'(não respondeu)':pv.ans[pv.alvo])}</div></div></div></div>
          ${s==='judge'?`<h2>${who(pv.alvo)} está a marcar quem acertou…</h2>${timerH(pv.dl)}`:''}${pts}</div>`;
      }
    }
    // —— Mentiroso: 2 verdades ——
    if(t==='ment' && pv.sub==='2v'){
      if(s==='lie') return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<h2>${who(pv.alvo)} está a escolher qual das 3 histórias vai ser mentira</h2><p class="lead muted">Os outros: preparem as perguntas. Depois das apostas, ${nm(pv.alvo)} conta as 3 histórias e podem fazer até 3 perguntas no total.</p>${timerH(pv.dl)}</div>`;
      if(s==='tell') return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<div class="row" style="font-size:3em;gap:1.2em"><span class="gold serif">1</span><span class="gold serif">2</span><span class="gold serif">3</span></div><h2>${who(pv.alvo)} conta as 3 histórias</h2><p class="lead muted">2 verdadeiras, 1 inventada. A mesa pode fazer até 3 perguntas.</p>${timerH(pv.dl)}${go}</div>`;
      if(s==='vote') return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<h2>Qual é a mentira? Votem no telemóvel</h2><div class="row"><span class="chip">🗳️ <span id="cntn"></span></span>${timerH(pv.dl)}</div></div>`;
      if(s==='reveal'){ const ks=Object.keys(pv.votes); const endAt = pv.revAt + E.T.voteEach*ks.length + 1600;
        return `<div class="sg">${ctxQ(pv)}<div class="opts">${[1,2,3].map(i=>`<div class="opt ${''}" style="min-width:12em"><span class="l serif" style="font-size:3em">${i}</span><div class="voters">${ks.map((k,j)=>+pv.votes[k]===i?`<span class="vt" data-at="${pv.revAt+600+j*E.T.voteEach}" data-snd="clink">${S.players[k].av}</span>`:'').join('')}</div><div class="stamp no" data-at="${endAt}" style="${i===pv.lie?'':'display:none'};font-size:1.6em;opacity:0" >MENTIRA</div></div>`).join('')}</div></div>`; }
    }
    // —— Impostor ——
    if(t==='ment'){
      if(s==='deal') return `<div class="sg enter">${head(pv)}<h2>Vejam o vosso papel no telemóvel</h2><p class="lead">Todos recebem a mesma palavra secreta… menos um: <b class="gold">o Impostor</b>.</p><p class="muted">Cada um vai dizer UMA palavra relacionada, 2 voltas. Depois votam em quem acham que é o Impostor.</p>${timerH(pv.dl)}${go}</div>`;
      if(s==='words'){ const cur = pv.order[pv.wi % pv.order.length]; const volta = pv.wi < pv.order.length ? 1 : 2;
        return `<div class="sg enter">${head(pv, '· volta '+volta+' de 2')}<div class="row" style="gap:.6em">${pv.order.map((k,i)=>`<span class="who" style="${k===cur?'background:var(--gold);color:#1a1206;transform:scale(1.25)':(i < (pv.wi % pv.order.length) || volta===2 && false)?'opacity:.5':''}"><span class="av">${S.players[k].av}</span>${esc(S.players[k].name)}</span>`).join('')}</div>
          <h1>${who(cur)}</h1><h2>diz uma palavra</h2>${timerH(pv.dl)}<div class="muted mini">Quem está a falar (ou o Croupier) passa ao seguinte no telemóvel.</div></div>`; }
      if(s==='vote') return `<div class="sg enter">${head(pv)}<h2>Quem é o Impostor? Votem no telemóvel</h2><div class="row"><span class="chip">🗳️ <span id="cntn"></span></span>${timerH(pv.dl)}</div></div>`;
      if(s==='reveal'){ const ks=Object.keys(pv.votes); const endAt = pv.revAt + E.T.voteEach*ks.length + 2200;
        return `<div class="sg"><h2>Os votos</h2><div class="opts">${S.players.map((p,k)=>`<div class="opt"><span class="l">${p.av} ${esc(p.name)}</span><div class="voters">${ks.map((v,j)=>+pv.votes[v]===k?`<span class="vt" data-at="${pv.revAt+600+j*E.T.voteEach}" data-snd="clink">${S.players[v].av}</span>`:'').join('')}</div></div>`).join('')}</div>
          <div class="vt" data-at="${endAt}" data-snd="stamp" style="font-size:1em"><div class="stamp no">IMPOSTOR: ${esc(S.players[pv.imp].name)}</div></div></div>`; }
      if(s==='guess') return `<div class="sg enter"><div class="stamp no">APANHADO</div><h1>${who(pv.imp)}</h1><h2>era o Impostor!</h2><p class="lead">Última hipótese: se adivinhar a palavra secreta, ganha na mesma.</p>${timerH(pv.dl)}</div>`;
    }
    // —— Duelo / Dupla ou Nada ——
    if(t==='duelo' || pv.cid==='dupla'){
      const duo = pv.duo ? `<div class="duo"><div class="fighter"><span class="av">${S.players[pv.duo[0]].av}</span><b>${nm(pv.duo[0])}</b></div><span class="vs">VS</span><div class="fighter"><span class="av">${S.players[pv.duo[1]].av}</span><b>${nm(pv.duo[1])}</b></div></div>` : '';
      const card = pv.dc!=null ? `<h1>${esc(D.duels[pv.dc][0])}</h1><p class="lead">${esc(D.duels[pv.dc][1])}</p>` : '';
      if(s==='pick') return `<div class="sg enter">${head(pv)}<h2>${who(pv.picker)} ${t==='duelo'?'escolhe os dois duelistas':'escolhe o adversário'}</h2><p class="muted">${t==='duelo'?'Quem tem menos fichas escolhe quem vai duelar (pode escolher-se a si próprio).':'Dupla ou Nada: ganha e recebe 10 fichas do adversário; perde e paga-lhe 3.'}</p>${timerH(pv.dl)}</div>`;
      if(s==='card') return `<div class="sg card deco-c enter">${head(pv)}${duo}${card}${timerH(pv.dl)}${go}</div>`;
      if(s==='play') return `<div class="sg enter">${duo}${card}${timerH(pv.playAt + D.duels[pv.dc][2]*1000, 'huge')}<div class="muted">O Croupier marca o fim do duelo no telemóvel.</div></div>`;
      if(s==='vote') return `<div class="sg enter">${duo}<h2>Quem ganhou? A mesa vota no telemóvel</h2><div class="row"><span class="chip">🗳️ <span id="cntn"></span></span>${timerH(pv.dl)}</div></div>`;
    }
    // —— Leilão ——
    if(t==='leilao'){
      if(s==='auc') return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<div class="row"><div class="counter">${pv.hi||'—'}<small><br>${pv.hk>=0?'lance de '+nm(pv.hk):'sem lances'}</small></div></div>
        <h2 id="auccur" data-k="${pv.cur}">Vez de ${who(pv.cur)}: sobe o lance ou passa</h2>${timerH(pv.dl)}
        <div class="row mini">${pv.hist.map(h=>`<span class="chip">${S.players[h[0]].av} ${h[1]?h[1]:'passou'}</span>`).join('')}</div></div>`;
      if(s==='play') return `<div class="sg">${ctxQ(pv)}<h2>${who(pv.hk)} tem de dizer <b class="gold">${pv.hi}</b> em 30 segundos</h2><div class="counter" id="cnt" data-v="${pv.cnt}">${pv.cnt}<small> / ${pv.hi}</small></div><h2 id="prep" class="gold"></h2>${timerH(pv.dl)}<div class="muted">${who(pv.riv)} conta as respostas certas no telemóvel.</div></div>`;
    }
    // —— Voto Secreto ——
    if(t==='voto'){
      if(s==='vote') return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<h2>Votem em segredo no telemóvel</h2><div class="row"><span class="chip">🗳️ <span id="cntn"></span></span>${timerH(pv.dl)}</div></div>`;
      if(s==='reveal'){ const ord = pv.order||[];
        return `<div class="sg">${ctxQ(pv)}<div class="opts">${S.players.map((p,k)=>`<div class="opt"><span class="l">${p.av} ${esc(p.name)}</span><div class="voters">${ord.map((v,j)=>+pv.votes[v]===k?`<span class="vt" data-at="${pv.revAt+600+j*E.T.voteEach}" data-snd="clink">${S.players[v].av}</span>`:'').join('')}</div></div>`).join('')}</div></div>`; }
      if(s==='def') return `<div class="sg enter">${ctxQ(pv)}<div class="kicker">${pv.el.length>1?'Os Eleitos':'O Eleito'}</div><div class="row" style="font-size:2em">${pv.el.map(k=>who(k)).join(' ')}</div><h2>30 segundos para se defender (ou assumir)</h2>${timerH(pv.dl,'huge')}</div>`;
    }
    // —— Quente e Frio ——
    if(t==='qf'){
      if(s==='secret') return `<div class="sg enter">${head(pv)}<h1>${who(pv.alvo)}</h1><h2>vira-te de costas para os ecrãs!</h2><p class="lead">A mesa está a ler a missão secreta no telemóvel. ${pv.custom?'<b class="gold">O juiz escreveu uma missão nova.</b>':''}</p><div class="muted">Juiz: ${who(pv.judge)}</div>${timerH(pv.dl)}</div>`;
      if(s==='play') return `<div class="sg"><div class="kicker">Quente e Frio · só se pode dizer “quente” ou “frio”</div><h2>${who(pv.alvo)} tenta descobrir a missão</h2><div class="hc" id="hc">🌡️</div><div class="thermo"><div class="needle" id="needle" style="left:calc(50% - .25em)"></div></div><div class="row muted"><span>❄️ frio</span><span style="flex:1"></span><span>quente 🔥</span></div><h2 id="prep" class="gold"></h2>${timerH(pv.dl,'huge')}<div class="muted">O juiz ${who(pv.judge)} carrega em “Conseguiu!” no telemóvel.</div></div>`;
    }
    // —— Caos ——
    if(t==='caos'){
      if(s==='pick1') return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<h2>${who(pv.picker)} ${pv.cid==='ass'?'escolhe quem vai assaltar…':'escolhe o Procurador…'}</h2>${timerH(pv.dl)}</div>`;
      if(s==='swap') return `<div class="sg enter">${head(pv)}<h2>Troquem contratos no telemóvel</h2>${timerH(pv.dl)}${go}</div>`;
      if(s==='shop') return `<div class="sg enter">${head(pv)}<h2>O Mercado Negro está aberto</h2><p class="lead">Contratos extra a 5 fichas. Aproveitem para negociar fichas entre vocês (separador Mesa).</p>${timerH(pv.dl,'huge')}${go}</div>`;
      if(s==='law') return `<div class="sg enter">${head(pv)}<h2>${who(S.cro)} está a escrever a Lei Marcial…</h2>${timerH(pv.dl)}</div>`;
      if(s==='blind') return `<div class="sg enter">${head(pv)}<h2>Lances secretos pela Segunda Oportunidade</h2><div class="row"><span class="chip">🤫 <span id="cntn"></span></span>${timerH(pv.dl)}</div></div>`;
      if(s==='speech'){ const sp = pv.sp===0 ? pv.proc : pv.alvo; return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<div class="kicker">${pv.sp===0?'Acusação':'Defesa'}</div><h1>${who(sp)}</h1><h2>${pv.sp===0?'o Procurador acusa':'o réu defende-se'}</h2>${timerH(pv.dl,'huge')}</div>`; }
      if(s==='vote') return `<div class="sg enter">${head(pv)}${ctxQ(pv)}<h2>Culpado ou inocente? A mesa vota</h2><div class="row"><span class="chip">⚖️ <span id="cntn"></span></span>${timerH(pv.dl)}</div></div>`;
      if(s==='reveal'){ const ks=Object.keys(pv.votes); return `<div class="sg">${ctxQ(pv)}<div class="opts">${[['cul','CULPADO'],['ino','INOCENTE']].map(o=>`<div class="opt" style="min-width:16em"><span class="l serif" style="font-size:1.8em">${o[1]}</span><div class="voters">${ks.map((k,j)=>pv.votes[k]===o[0]?`<span class="vt" data-at="${pv.revAt+600+j*E.T.voteEach}" data-snd="clink">${S.players[k].av}</span>`:'').join('')}</div></div>`).join('')}</div></div>`; }
      if(s==='jack') return `<div class="sg enter">${head(pv)}<div class="counter">${pv.pot}<small> fichas no pote</small></div><h2>Escolham um número de 1 a 20</h2><div class="row"><span class="chip">🎰 <span id="cntn"></span></span>${timerH(pv.dl)}</div></div>`;
      if(s==='jrev'){ const ks=Object.keys(pv.jn); return `<div class="sg">${head(pv)}<div class="row">${ks.map((k,j)=>`<span class="chip vt" data-at="${pv.revAt+400+j*600}" data-snd="clink">${S.players[k].av} <b class="gold">${pv.jn[k]}</b></span>`).join('')}</div>
        <div class="vt" data-at="${pv.revAt+600+ks.length*600}" data-snd="stamp"><div class="counter">${pv.target}</div>${(pv.msg||[]).map(m=>`<h2>${esc(m)}</h2>`).join('')}</div></div>`; }
    }
    return `<div class="sg"><h2>…</h2></div>`;
  }
  function betIntro(pv){
    if(pv.type==='duelo') return `<div class="duo"><div class="fighter"><span class="av">${S.players[pv.duo[0]].av}</span><b>${nm(pv.duo[0])}</b></div><span class="vs">VS</span><div class="fighter"><span class="av">${S.players[pv.duo[1]].av}</span><b>${nm(pv.duo[1])}</b></div></div><div class="lead">${esc(D.duels[pv.dc][0])}: ${esc(D.duels[pv.dc][1])}</div>`;
    if(pv.type==='leilao') return `<div class="lead">${who(pv.hk)} diz que consegue <b class="gold">${pv.hi}</b> respostas em 30 segundos.</div>`;
    if(pv.type==='qf') return `<div class="lead">Será que ${who(pv.alvo)} consegue cumprir a missão secreta em 2 minutos e meio, só com “quente” e “frio”?</div>`;
    if(pv.type==='ment' && pv.sub==='imp') return `<div class="lead">Quem é o Impostor? (O Impostor não pode apostar em si próprio.)</div>`;
    if(pv.type==='final') return `<div class="lead">Apostem <b class="gold">pelo menos metade das vossas fichas</b> em quem vai ganhar O Interrogatório.</div>`;
    return '';
  }
  function introCard(pv){
    const t = pv.type; let body = '';
    const go = `<div class="row">${timerH(pv.dl)}</div><div class="muted mini">O Croupier ${who(S.cro)} pode avançar no telemóvel.</div>`;
    if(t==='qcq') body = `<div class="row">Alvo: ${who(pv.alvo)}</div>${ctxQ(pv)}<p class="lead muted">Primeiro apostem em quem vai acertar. Depois todos escrevem; ${nm(pv.alvo)} escreve a verdade. Se ninguém acertar, vence o Alvo.</p>`;
    if(t==='ment' && pv.sub==='2v') body = `${ctxQ(pv)}<p class="lead muted">${nm(pv.alvo)} vai contar 3 histórias: 2 verdadeiras e 1 inventada. Vencem os que descobrirem a mentira. Se a maioria errar, vence ${nm(pv.alvo)}.</p>`;
    if(t==='ment' && pv.sub==='imp') body = `<p class="lead">Todos vão receber a mesma palavra secreta, menos um: o Impostor. Cada um diz uma palavra relacionada. Descubram quem está a fazer bluff!</p>`;
    if(t==='duelo') body = `<p class="lead">Um contra um. ${who(pv.picker)} (o mais pobre) escolhe quem vai duelar.</p>`;
    if(t==='leilao') body = `${ctxQ(pv)}<p class="lead muted">Cada um diz quantas respostas consegue dar em 30 segundos. Quem der o lance mais alto tem de o provar. Se falhar, ganha o rival.</p>`;
    if(t==='voto') body = `${ctxQ(pv)}<p class="lead muted">Primeiro apostem em quem vai ser o mais votado. Depois votem em segredo. Combinações são permitidas… e traições também.</p>`;
    if(t==='qf') body = `<h1>${who(pv.alvo)}</h1><h2>vai ser o Alvo</h2><p class="lead">Todos vão ler uma missão secreta no telemóvel, menos o Alvo. Depois só podem dizer <b class="gold">“quente”</b> ou <b class="gold">“frio”</b> até ele a cumprir. Conseguir vale o dobro do prémio!</p><p class="lead gold">${nm(pv.alvo)}: prepara-te para virar de costas.</p>`;
    if(t==='caos'){ const c = D.chaos[pv.card]; body = `<div class="typeic">🌀</div><h1>${esc(c[1])}</h1><p class="lead">${esc(c[2])}</p>${pv.cid==='ouro'?`<div class="row">Alvo: ${who(pv.alvo)}</div>${ctxQ(pv)}`:''}${pv.cid==='trib'?`<div class="row">Réu: ${who(pv.alvo)}</div>`:''}${pv.cid==='dupla'?`<div class="row">Desafiante: ${who(pv.picker)}</div>`:''}`; }
    if(t==='final') body = `<h1>O Último Golpe</h1><p class="lead">Cada um aposta <b class="gold">pelo menos metade das suas fichas</b> em quem vai ganhar <b>O Interrogatório</b>: 5 perguntas seguidas sobre o grupo. Cada acerto vale 1 ponto. Quem tiver mais pontos leva 10 fichas.</p><p class="lead muted">Contratos por cumprir no fim não valem nada. Dívidas ao Banco descontam no total. Mais fichas = Padrinho.</p>`;
    if(t==='final') return `<div class="sg card deco-c slow-in"><div class="kicker">Grande Final</div><div class="typeic">🏁</div>${body}${go}</div>`;
    return `<div class="sg card deco-c slow-in">${t==='caos'?`<div class="kicker">Ronda ${S.rnd} · Caos</div>`:head(pv)}${t!=='caos'?`<p class="muted">${esc(D.TYPES[t].d)}</p>`:''}${body}${go}</div>`;
  }
  function resultCard(pv){
    const t = pv.type; let why = '';
    if(t==='qcq' || t==='final') why = t==='final' ? `<div class="row">${S.players.map((p,k)=>`<span class="chip">${p.av} ${esc(p.name)} <b class="gold">${pv.pts[k]||0}</b></span>`).join('')}</div>` : `<div class="lead">A verdade: <b class="gold">“${esc(pv.ans[pv.alvo]==null?'—':pv.ans[pv.alvo])}”</b>${(pv.ok||[]).length?'':' · ninguém acertou, vence o Alvo'}</div>`;
    if(t==='ment' && pv.sub==='2v') why = `<div class="lead">A mentira era a história <b class="gold">${pv.lie}</b>. ${pv.alvoW ? 'A maioria caiu no bluff!' : 'A mesa apanhou-a.'}</div>`;
    if(t==='ment' && pv.sub==='imp') why = `<div class="lead">O Impostor era ${who(pv.imp)}. Palavra secreta: <b class="gold">${esc(pv.word)}</b>.${pv.caught ? (pv.guessOk?` Foi apanhado mas adivinhou${pv.guessV?` (“${esc(pv.guessV)}”)`:''}!`:` Apanhado${pv.guessV?` (tentou “${esc(pv.guessV)}”)`:''}.`) : ' Escapou!'}</div>`;
    if(t==='duelo') why = `<div class="lead">${esc(D.duels[pv.dc][0])}</div>`;
    if(t==='leilao') why = `<div class="lead">${who(pv.hk)} precisava de ${pv.hi} e disse <b class="gold">${pv.cnt}</b>. ${pv.success?'Conseguiu!':'Falhou!'}</div>`;
    if(t==='voto') why = `<div class="lead">Quem é mais provável de ${esc(D.votes[pv.q])}?</div>`;
    if(t==='qf') why = `<div class="lead">A missão era: <b class="gold">“${esc(pv.act)}”</b>. ${pv.success?'Conseguiu! Prémio a dobrar.':'O tempo acabou.'}</div>`;
    if(pv.cid==='trib') why = `<div class="lead">Veredicto: <b class="gold">${pv.verd==='cul'?'CULPADO':'INOCENTE'}</b></div>`;
    const res = pv.betRes || {};
    const ks = Object.keys(pv.bets||{});
    const list = ks.map(k=>{ const v = res[k]; const b = pv.bets[k]; return `<span class="chip" style="${v>0?'box-shadow:inset 0 0 0 1.5px var(--green)':v<0?'opacity:.6':''}">${S.players[k].av} ${v>0?`<b style="color:var(--green)">+${v}</b>`:v<0?`<b style="color:#ff8a86">${v}</b>`:'0'}${res.az===+k?' 🎯':''}${res.so===+k?' 🛟':''}</span>`; }).join('');
    return `<div class="sg card deco-c enter"><div class="kicker">Resultado</div>${why}
      ${pv.W && pv.W.length ? `<div class="row" style="font-size:1.8em">${pv.W.map(k=>`<span class="who crown">${S.players[k].av} ${esc(S.players[k].name)}</span>`).join(' ')}</div>${pv.prize?`<h2 class="gold">+${pv.prize} fichas de prémio</h2>`:''}` : `<h2 class="muted">Ninguém venceu a prova</h2>`}
      ${res.az!=null ? `<h2>🎯 Golpe do Azarão: ${who(res.az)} foi o único a acertar!</h2>` : ''}
      ${ks.length?`<div class="kicker" style="margin-top:.4em">Apostas</div><div class="row">${list}</div>`:''}
      <div class="muted mini">Próxima ronda em breve · o Croupier pode avançar</div></div>`;
  }
  // ---------- lobby ----------
  function lobby(){

        <div class="vt" data-at="${a.at+2600}" data-snd="stamp" style="font-size:1em">${a.ok?`<div class="stamp ok">CERTO!</div><h2>${nm(a.k)} ganha ${a.v} fichas. Contrato queimado!</h2>`:`<div class="stamp no">ERRADO</div><h2>${nm(a.k)} paga ${a.v} fichas a ${nm(a.t)}.</h2>`}</div></div></div>`; }

        <div class="row"><span class="chip">Confirmem no telemóvel · ${Object.keys(c.votes).length}/${S.players.length-1}</span>${timerH(c.dl)}</div><div class="row mini"><button class="btn green" id="chkY">✔ Confirmar</button><button class="btn red" id="chkN">✘ Recusar</button></div></div></div>`; }
    else if(S.chkLast && now - S.chkLast.at < 3800){ const c = S.chkLast; const info = E.kInfo(S, c); key = 'chkl'+c.at;
      html = `<div class="spot"><div class="card deco-c"><h1>${who(c.k)}</h1><div class="ktext">“${esc(info.t)}”</div><div class="stamp ${c.res?'ok':'no'}">${c.res?'CUMPRIDO':'RECUSADO'}</div>${c.res?`<h2 class="gold">+${info.v} fichas</h2>`:''}</div></div>`; }
    if(S.pz){ key += 'pz'; html += `<div class="pause-ov">⏸ Pausa<button class="btn" id="unp" style="font-size:.4em">Continuar</button></div>`; }
    if(key!==ovKeyPrev){
      const was = ovKeyPrev; ovKeyPrev = key; $('#ov').innerHTML = html;
      if(key.startsWith('acc') && !was.startsWith('acc')) Sound.horn();
      if(key.startsWith('chk') && !key.startsWith('chkl') && !was.startsWith('chk')){ Sound.drum(1); Sound.duck(true); }
      if(key.startsWith('chkl')){ Sound.duck(false); (S.chkLast.res?Sound.chips:Sound.fail)(); }
      $('#chkY') && ($('#chkY').onclick = () => { E.cmd(S,-1,{a:'chkset', y:1}); dirty=true; });
      $('#chkN') && ($('#chkN').onclick = () => { E.cmd(S,-1,{a:'chkset', y:0}); dirty=true; });
      $('#unp') && ($('#unp').onclick = () => togglePause());
    }
    $$('[data-at]', $('#ov')).forEach(el=>{ if(!el.classList.contains('on') && now >= +el.dataset.at){ el.classList.add('on'); const s=el.dataset.snd; if(s&&Sound[s]) Sound[s](); } });
  }

  // ---------- comandos no ecrã (jogadores sem telemóvel) ----------
  function renderLocal(){
    const locals = S.players.map((p,k)=>k).filter(k=>S.players[k].local);
    const w = $('#lpw');
    if(!locals.length || S.ph==='lobby'){ if(w.innerHTML) w.innerHTML=''; localPad=null; return; }
    // muda automaticamente para quem tem algo para fazer
    const needy = locals.filter(k=>E.need(S,k));
    if(!locals.includes(localSel)) { localSel = needy[0]!=null ? needy[0] : locals[0]; localCover = true; }
    if(needy.length && !needy.includes(localSel) && localCover){ localSel = needy[0]; if(localPad) localPad.reset(); }
    if(needy.length && localMin){ localMin=false; const lb=$('.lp-body', w); if(lb) lb.style.display='block'; }
    if(!w.firstChild){
      w.innerHTML = `<div class="localpads"><div class="lp-tabs"></div><div class="lp-body" style="display:${localMin?'none':'block'}"><div class="lpp" style="position:absolute;inset:0"></div><div class="cover"></div></div></div>`;

      $('.lp-tabs', w).onclick = e => { if(e.target.closest('[data-min]')){ localMin=!localMin; $('.lp-body',w).style.display = localMin?'none':'block'; lt0=''; return; } const b=e.target.closest('[data-lp]'); if(b){ localSel=+b.dataset.lp; localCover=true; localMin=false; $('.lp-body',w).style.display='block'; localPad.reset(); } };
      $('.cover', w).onclick = () => { localCover=false; };

    const tabsH = `<button data-min title="Esconder/mostrar">${localMin?'▴':'▾'}</button><span class="muted mini" style="padding:.3em">🖥️ Comando no ecrã:</span>` + locals.map(k=>`<button data-lp="${k}" class="${k===localSel?'on':''}">${S.players[k].av} ${esc(S.players[k].name)}${E.need(S,k)?' •':''}</button>`).join('');
    const lt = $('.lp-tabs', w); if(lt.innerHTML!==tabsH) lt.innerHTML = tabsH;
    const cv = $('.cover', w);
    cv.style.display = localCover ? 'flex' : 'none';
    const ch = `<div style="font-size:2.5em">${S.players[localSel].av}</div><b>${esc(S.players[localSel].name)}</b><div class="muted mini">Os outros desviam o olhar 🙈</div><button class="btn">Mostrar o meu comando</button>`;
    if(localCover && cv.innerHTML!==ch) cv.innerHTML = ch;

    if(localPad) localPad.render();
  }

  return { start };
})();

const Phone = (()=>{
  let cid, code = '', pub = null, priv = null, me = -1, pad = null, join = null, claim = null, queue = [], seq = 0, off = 0, lastTvAt = 0, lastRejoin = 0, lastAck = 0, joined = false, editing = false;
  function start(){
    $('#padroot').classList.add('show');
    try{ cid = sessionStorage.getItem('clube-cid'); }catch(e){}
    if(!cid) cid = LS.get('clube-cid');
    if(!cid) cid = 'p' + Math.random().toString(36).slice(2,10);
    try{ sessionStorage.setItem('clube-cid', cid); }catch(e){} LS.set('clube-cid', cid);
    seq = Date.now();
    codeScreen();
  }
  function codeScreen(msg){
    $('#padroot').innerHTML = `<div class="join deco"><div class="logo">O Clube</div><label>Código da sala (está na TV)<input class="inp" id="jcode" inputmode="numeric" maxlength="4" value="${esc(LS.get('clube-code')||'')}" placeholder="0000" style="font-size:2em;text-align:center;letter-spacing:.3em"></label>
      <button class="btn big" id="jconn">Entrar no Clube</button><div id="jmsg" class="muted" style="text-align:center">${msg||''}</div></div>`;
    $('#jconn').onclick = connect;
    $('#jcode').onkeydown = e => { if(e.key==='Enter') connect(); };
  }
  async function connect(){
    code = $('#jcode').value.trim();
    if(!/^\d{4}$/.test(code)){ $('#jmsg').textContent = 'O código tem 4 números.'; return; }
    LS.set('clube-code', code);
    $('#jmsg').textContent = 'A ligar…';
    const ok = await Net.connect(code);
    if(!ok){ $('#jmsg').textContent = 'Não foi possível ligar daqui. Abre o link do jogo dentro do claude.ai com a tua conta (ou pede para jogares no ecrã da TV).'; return; }
    listen(); presence();
    setInterval(watchdog, 3000);
    setInterval(()=>{ if(pad) pad.render(); }, 500);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ presence(); watchdog(); } });
    setTimeout(()=>{ if(!pub && $('#jmsg')) $('#jmsg').textContent = `Ligado. Não encontro a TV com o código ${code}. Confirma o código no ecrã.`; }, 9000);
  }
  function listen(){
    Net.A.onPeers(ch => {
      const tv = ch.peers.find(p=>p.presence && p.presence.role==='tv' && p.presence.code===code && p.presence.st);
      if(!tv) return;
      lastTvAt = Date.now(); connBar(false);
      onPub(tv.presence.st);
    });
    Net.B.onPeers(ch => {
      const tv = ch.peers.find(p=>p.presence && p.presence.role==='tv' && p.presence.code===code && p.presence.pr);
      if(!tv) return;
      lastTvAt = Date.now();
      const B = tv.presence;
      priv = B.pr[cid] || null;
      const a = B.ack && B.ack[cid];
      if(a){ lastAck = a; const before = queue.length; queue = queue.filter(c=>c.n>a); if(queue.length!==before) presence(); }
      if(B.now) off = B.now - Date.now();
      refresh();
    });
  }
  async function watchdog(){
    if(document.hidden) return;
    const stale = lastTvAt && Date.now() - lastTvAt > 9000;
    connBar(stale);
    if(stale && Date.now() - lastRejoin > 10000){ lastRejoin = Date.now(); const ok = await Net.rejoin(); if(ok){ listen(); presence(); } }
  }
  function connBar(on){ let b = $('#connbar'); if(!b){ b = document.createElement('div'); b.id='connbar'; b.innerHTML = '📡 Sem sinal da TV — a religar… <button id="rl">Recarregar</button>'; document.body.appendChild(b); $('#rl').onclick=()=>location.reload(); } b.classList.toggle('show', !!on); }
  function presence(){ if(!Net.ok) return; const o = { role:'pad', code, cid, join: join||null, cmd: queue[0]||null, claim: claim===null?null:claim }; Net.A.presence(o).catch(()=>{}); }
  function send(c){ seq = Math.max(Date.now(), seq+1); queue.push(Object.assign({ n:seq }, c)); if(queue.length>8) queue = queue.slice(-8); if(queue.length===1) presence(); }
  function onPub(st){
    pub = st;
    if(st.now) off = st.now - Date.now();
    refresh();
  }
  let shown = '';
  function refresh(){
    if(!pub) return;
    if(pub.ph==='lobby'){
      pad = null;
      if(priv && !editing){ joined = true; const k = 'sum'+JSON.stringify(pub.P)+priv.me; if(shown!==k){ shown=k; joinScreen(); } return; }
      if(shown!=='form' || !$('#jname')){ if(joined && !priv && !editing){ if(shown!=='wait'){ shown='wait'; $('#padroot').innerHTML = `<div class="join deco"><div class="waitbox"><div class="ic">🎩</div><div class="t">A entrar…</div></div></div>`; } return; } shown='form'; joinScreen(); }
      return;
    }
    if(!priv){ const k='rc'+JSON.stringify(pub.P.map(p=>p[0]))+claim; if(shown!==k){ shown=k; reclaimScreen(); } return; }
    me = priv.me;
    if(claim!==null){ claim = null; presence(); }
    if(!pad || shown!=='pad'){ shown='pad'; $('#padroot').onclick = null; $('#padroot').innerHTML = '<div id="padwrap" style="position:absolute;inset:0"></div>'; pad = makePad($('#padwrap'), { pub:()=>pub, priv:()=>priv, me:()=>me, send, off:()=>off, local:false }); }
    pad.render();
  }
  function joinScreen(){
    pad = null;
    const takenAv = pub.P.map(p=>p[2]);
    const myI = priv && typeof priv.me==='number' ? priv.me : -1;
    const cur = join || { nm: LS.get('clube-name')||'', nk: LS.get('clube-nick')||pick(D.nicks), av: LS.get('clube-av')||D.avatars.find(a=>!takenAv.includes(a)), cu: LS.get('clube-cu')||'' };
    if(priv && myI>=0 && !editing){
      $('#padroot').innerHTML = `<div class="join deco"><div class="logo">O Clube</div><div class="pcard" style="text-align:center"><div style="font-size:3em">${esc(pub.P[myI][2])}</div><h3>${esc(pub.P[myI][0])}</h3><div class="muted serif" style="font-style:italic">${esc(pub.P[myI][1])}</div><div class="muted mini">Estás dentro. O jogo começa na TV.</div></div>
        <div class="pcard"><h3>Na sala (${pub.P.length})</h3>${pub.P.map(p=>`<div class="pl-row"><span class="av">${p[2]}</span><div class="n">${esc(p[0])}<small>${esc(p[1])}</small></div></div>`).join('')}</div>
        <button class="btn ghost" id="jedit">Mudar nome, alcunha ou avatar</button></div>`;
      $('#jedit').onclick = () => { editing = true; shown='form'; joinScreen(); };
      return;
    }
    $('#padroot').innerHTML = `<div class="join deco"><div class="logo">O Clube</div><div class="muted" style="text-align:center">Sala ${esc(code)} · ${pub.P.length}/10 membros</div>
      <label>O teu nome<input class="inp" id="jname" maxlength="14" value="${esc(cur.nm)}" placeholder="Nome" autocomplete="off"></label>
      <label>A tua alcunha no Clube<input class="inp" id="jnick" maxlength="24" value="${esc(cur.nk)}" placeholder="Ex.: O Contabilista" autocomplete="off"></label>
      <div class="nickchips">${D.nicks.map(n=>`<button data-nk="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <label>Avatar</label><div class="avgrid">${D.avatars.map(a=>`<button data-av="${a}" class="${cur.av===a?'on':''}" ${takenAv.includes(a)&&(myI<0||pub.P[myI][2]!==a)?'disabled':''}>${a}</button>`).join('')}</div>
      <label>Um contrato secreto para o baralho (opcional)<input class="inp" id="jcu" maxlength="90" value="${esc(cur.cu)}" placeholder='Ex.: Faz alguém dizer "barrote"' autocomplete="off"></label>
      <div class="muted mini">O teu contrato entra no baralho desta noite (nunca te calha a ti). Ideal para piadas do grupo.</div>
      <button class="btn big" id="jgo">${joined?'Guardar':'Entrar'}</button></div>`;
    let av = cur.av;
    $('#padroot').onclick = e => {
      const n = e.target.closest('[data-nk]'); if(n){ $('#jnick').value = n.dataset.nk; }
      const a = e.target.closest('[data-av]'); if(a && !a.disabled){ av = a.dataset.av; $$('[data-av]').forEach(b=>b.classList.toggle('on', b===a)); }
    };
    $('#jgo').onclick = () => {
      const nm = $('#jname').value.trim(); if(!nm){ $('#jname').focus(); return; }
      join = { nm, nk: $('#jnick').value.trim(), av, cu: $('#jcu').value.trim() };
      LS.set('clube-name', nm); LS.set('clube-nick', join.nk); LS.set('clube-av', av); LS.set('clube-cu', join.cu);
      joined = true; editing = false; $('#padroot').onclick = null; presence(); shown='';
      if(!priv){ shown='wait'; $('#padroot').innerHTML = `<div class="join deco"><div class="waitbox"><div class="ic">🎩</div><div class="t">A entrar…</div></div></div>`; } else refresh();
    };
  }
  function reclaimScreen(){
    pad = null;
    $('#padroot').onclick = null;
    $('#padroot').innerHTML = `<div class="join deco"><div class="logo">O Clube</div><h3 style="text-align:center" class="serif">A sessão já começou</h3><p class="muted" style="text-align:center">Se saíste a meio, escolhe quem és para retomar o teu lugar:</p>
      ${pub.P.map((p,k)=>`<button class="pbtn reclaim" data-k="${k}" style="justify-content:flex-start"><span class="av">${p[2]}</span>${esc(p[0])} <small class="muted">${esc(p[1])}</small></button>`).join('')}
      <p class="muted mini" style="text-align:center">${claim!==null?'A pedir à TV… (se o comando antigo ainda estiver ligado, a TV pergunta)':'Só podes retomar o lugar de alguém cujo comando esteja desligado.'}</p></div>`;
    $('#padroot').onclick = e => { const b = e.target.closest('.reclaim'); if(!b) return; claim = +b.dataset.k; presence(); shown=''; refresh(); };
  }
  return { start };
})();

window.addEventListener('DOMContentLoaded', startScreen);
})();

</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
