<!DOCTYPE html>
<html lang="pt">
<head>
<script src="../../rede.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ilha Nova — colonos, estradas e um corsário</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--ink:#2a1e12;--paper:#f7eedb;--paper2:#efe2c4;--sea:#1f6f9f;--deep:#0d2a3d;--gold:#f2c14e;--red:#c8372d;--green:#2e8b4e;--muted:#8a7a62;--card:#fffaf0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}input{font:inherit}
.screen{display:none;position:fixed;inset:0}.screen.show{display:block}
.muted{color:var(--muted)}.center{text-align:center}
.logo{font-family:Cinzel,Georgia,serif;font-weight:800;letter-spacing:1px;color:#fff;line-height:1}
.btn{border:0;border-radius:14px;padding:12px 16px;background:#7a4b22;color:#fff;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.good{background:var(--green)}.btn.bad{background:var(--red)}.btn.gold{background:var(--gold);color:var(--ink)}.btn.sea{background:var(--sea)}
.btn.ghost{background:transparent;color:#7a4b22;box-shadow:inset 0 0 0 2px #7a4b22}
.btn.big{padding:16px;font-size:18px;width:100%}.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns .btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,250,235,.92);border-radius:999px;padding:5px 11px;font-size:13px;margin:2px;color:var(--ink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
/* início */
#start{background:radial-gradient(ellipse at 50% 0%,#3d8bbf 0%,#164a6e 45%,#081a28 100%);overflow:auto}
.st-box{max-width:460px;margin:0 auto;padding:44px 22px;display:flex;flex-direction:column;gap:14px;color:#fff}
.st-box .logo{font-size:58px;text-align:center}.st-box .tag{text-align:center;color:#d9ecf7;margin:0 0 12px}
.st-box .btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.st-box .muted{color:#a9c6d8;font-size:14px}
.st-island{font-size:64px;text-align:center;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
/* TV */
#tv{overflow:hidden;background:#0d2a3d}#three{position:absolute;inset:0}#three canvas{display:block}
#three.flat{display:grid;place-items:center;background:radial-gradient(#2a84b8,#0d2a3d)}#three.flat svg{width:min(92vw,140vh);height:92vh}
#hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:7px;width:265px;z-index:3}
.hp{display:flex;gap:9px;align-items:center;background:rgba(255,248,232,.94);border-radius:14px;padding:7px 10px 7px 7px;border-left:7px solid var(--c);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .4s,box-shadow .4s;cursor:pointer;position:relative}
.hp.turn{transform:translateX(8px) scale(1.04);box-shadow:0 0 0 3px var(--gold),0 6px 22px rgba(0,0,0,.5)}
.hp .av{font-size:24px;width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.hp .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hp .tt{font-size:11px;color:var(--muted)}
.hp .st{font-size:12px;display:flex;gap:7px;margin-top:2px;flex-wrap:wrap}.hp .vp{margin-left:auto;font:800 26px Cinzel,serif;color:#7a4b22;text-align:center;line-height:1}.hp .vp small{display:block;font:600 9px Inter;color:var(--muted)}
.hp .badge{position:absolute;right:-8px;top:-8px;font-size:18px}
.hp .off{opacity:.45}
#tvtop{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px;z-index:3}
.btnc{border:0;cursor:pointer}
#tvlog{position:absolute;left:12px;bottom:12px;width:min(560px,45vw);color:#fff8e8;font-size:14px;z-index:3;background:linear-gradient(90deg,rgba(10,20,30,.62),rgba(10,20,30,0));padding:10px 14px;border-radius:12px}
#tvlog div{padding:2px 0;text-shadow:0 1px 3px #000}#tvlog div:last-child{font-weight:700}
#prompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(255,248,232,.95);border-radius:999px;padding:10px 22px;font:700 18px Inter;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:3;display:flex;gap:10px;align-items:center;max-width:46vw;text-align:center}
#prompt .dot{width:16px;height:16px}
#dicechip{position:absolute;right:12px;bottom:14px;z-index:3;background:rgba(255,248,232,.95);border-radius:16px;padding:8px 14px;font:800 30px Cinzel,serif;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
#dicechip.show{display:block}#dicechip small{font:600 12px Inter;color:var(--muted);display:block}
#trpanel{position:absolute;right:12px;top:70px;z-index:3;width:300px;background:rgba(255,248,232,.96);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
#trpanel.show{display:block}#trpanel h4{margin:0 0 6px;font-family:Cinzel,serif}
.trrow{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin:4px 0}
.banner{position:absolute;left:50%;top:18%;transform:translate(-50%,-30px) scale(.9);opacity:0;pointer-events:none;transition:all .55s cubic-bezier(.2,1.4,.4,1);text-align:center;padding:16px 40px;border-radius:20px;background:rgba(255,248,232,.97);box-shadow:0 18px 50px rgba(0,0,0,.5);border-bottom:6px solid #7a4b22;min-width:360px;z-index:5}
.banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
.banner .bt{font:800 48px Cinzel,serif;color:#7a4b22;line-height:1.05}.banner .bs{font:600 21px Inter;margin-top:8px}
.banner.bad{border-color:var(--red)}.banner.bad .bt{color:var(--red)}.banner.good{border-color:var(--green)}.banner.good .bt{color:var(--green)}
.banner.night{background:rgba(18,30,58,.95);color:#e8eeff;border-color:#8fb0ff}.banner.night .bt{color:#ffe7a3}
.fly{position:absolute;z-index:6;width:46px;height:62px;border-radius:8px;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.45);border:3px solid #fff;pointer-events:none;transition:transform 1.1s cubic-bezier(.45,0,.2,1),opacity .4s;left:0;top:0}
.ov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .4s;z-index:8}.ov.show{opacity:1;pointer-events:auto}
#lobby{background:radial-gradient(ellipse at 50% 30%,rgba(13,42,61,.55),rgba(5,15,25,.92))}
.lobbox{width:min(1100px,94vw);display:grid;grid-template-columns:1fr 1.1fr;gap:28px;color:#fff;align-items:start}
.lobbox .logo{font-size:72px}.lobbox .tag{color:#cfe3f0;font-size:18px;margin:8px 0 20px}
.code{font:800 84px Cinzel,serif;letter-spacing:12px;color:var(--gold);line-height:1}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;margin-top:12px}.qr img,.qr canvas{display:block;width:150px;height:150px}
.lbcard{background:rgba(255,248,232,.97);color:var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lbcard h3{margin:0 0 10px;font-family:Cinzel,serif}
.lbp{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #e8dcc0}.lbp .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.lbp .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;font-size:15px}.seg{display:flex;gap:4px}.seg button{border:0;border-radius:9px;padding:6px 10px;background:#e8dcc0;font-weight:700}.seg button.on{background:#7a4b22;color:#fff}
#winov{background:radial-gradient(rgba(40,25,5,.4),rgba(5,10,20,.85))}
.winbox{text-align:center;color:#fff}.winbox .crown{font-size:110px;animation:bob 1.6s ease-in-out infinite}.winbox h1{font:800 70px Cinzel,serif;margin:6px 0;color:var(--gold)}.winbox p{font-size:22px}
.ranks{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}.ranks div{background:rgba(255,248,232,.95);color:var(--ink);border-radius:14px;padding:10px 16px;border-top:6px solid var(--c);min-width:130px}
@keyframes bob{50%{transform:translateY(-10px)}}
#confirm{background:rgba(0,0,0,.5);z-index:9}.cbox{background:var(--paper);border-radius:18px;padding:20px;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.5)}.cbox .opts{display:flex;flex-direction:column;gap:8px}
#notice{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff3cd;border:2px solid #e0b100;border-radius:12px;padding:8px 14px;z-index:6;display:none;max-width:560px;font-size:15px}#notice.show{display:block}
#localpad{position:absolute;right:0;top:0;bottom:0;width:380px;background:var(--paper);z-index:7;box-shadow:-10px 0 30px rgba(0,0,0,.4);display:none;flex-direction:column}
#localpad.show{display:flex}#localpad .lp-tabs{display:flex;gap:4px;padding:8px;background:#e8dcc0;flex-wrap:wrap;align-items:center;font-size:13px}
#localpad .lp-tabs button{border:0;border-radius:10px;padding:6px 10px;background:#fff;border-left:5px solid var(--c);font-weight:700}#localpad .lp-tabs button.on{background:#7a4b22;color:#fff}
#localpad .lp-body{flex:1;overflow:hidden;position:relative}
#localpad .lp-hide{margin-left:auto}
#lpopen{position:absolute;right:12px;bottom:80px;z-index:6;display:none}
/* COMANDO */
#padroot{background:var(--paper);overflow:hidden}
.join{max-width:460px;margin:0 auto;padding:26px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto;height:100%}
.join .logo{color:#7a4b22;font-size:36px;text-align:center}
.join label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.join input{border:2px solid #d8c7a4;border-radius:12px;padding:12px;font-size:20px;background:#fff}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.picks.c4{grid-template-columns:repeat(4,1fr)}
.pick{border:2px solid #d8c7a4;border-radius:12px;background:#fff;padding:9px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.pick span{font-size:24px}.pick.on{border-color:#7a4b22;box-shadow:0 0 0 3px rgba(122,75,34,.25);background:#fff7e6}.pick:disabled{opacity:.3}
.pick .sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(80,50,10,.12)}
.pad{position:absolute;inset:0;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff8ea;border-bottom:3px solid var(--c);padding-top:max(10px,env(safe-area-inset-top))}
.phead .av{width:42px;height:42px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:24px;flex:none}
.phead .who b{display:block;font-size:16px}.phead .who small{color:var(--muted);font-size:12px}
.phead .vp{margin-left:auto;text-align:center;font:800 28px Cinzel,serif;color:#7a4b22;line-height:1}.phead .vp small{display:block;font:600 10px Inter;color:var(--muted)}
.pbody{flex:1;overflow:auto;padding:12px;padding-bottom:20px}
.pnav{display:flex;background:#fff8ea;border-top:1px solid #e3d3b0;padding-bottom:env(safe-area-inset-bottom)}
.pnav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.pnav button span{font-size:21px}.pnav button.on{color:#7a4b22}.pnav button.on::after{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:3px;background:#7a4b22}
.pnav .nb{position:absolute;top:4px;right:18%;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px}
.status{border-radius:16px;padding:14px;margin-bottom:12px;background:#fff;border-left:6px solid var(--c);box-shadow:0 2px 8px rgba(80,50,10,.12)}
.status.mine{background:linear-gradient(135deg,#fff8e1,#ffefc2);border-left-color:var(--gold)}
.status h3{margin:0 0 4px;font-family:Cinzel,serif;font-size:19px}.status p{margin:4px 0;font-size:14px}
.sec{font:800 13px Inter;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 2px 8px}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.rc{border-radius:12px;aspect-ratio:.72;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2);position:relative;border:3px solid rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.45)}
.rc .e{font-size:28px}.rc .n{font-size:11px;font-weight:700}.rc .c{position:absolute;top:-8px;right:-8px;background:#2a1e12;color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;border:2px solid #fff;text-shadow:none}
.rc.zero{opacity:.35;filter:grayscale(.6)}
.builds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bb{border:0;border-radius:14px;background:#fff;padding:10px;text-align:left;box-shadow:0 2px 6px rgba(80,50,10,.15);display:flex;flex-direction:column;gap:3px}
.bb b{font-size:15px}.bb .rec{font-size:15px;letter-spacing:1px}.bb small{color:var(--muted);font-size:11px}.bb:disabled{opacity:.45}.bb.ok{box-shadow:0 0 0 2px var(--green),0 2px 6px rgba(80,50,10,.15)}
.devl{display:flex;flex-direction:column;gap:8px}
.dc{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 6px rgba(80,50,10,.12)}
.dc .de{font-size:30px;width:46px;height:58px;border-radius:9px;background:linear-gradient(160deg,#3b2a6b,#6b4bb0);display:grid;place-items:center;flex:none;border:2px solid #f2c14e}
.dc .dd{flex:1}.dc .dd b{font-size:15px}.dc .dd p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.mapwrap{background:radial-gradient(#3b97c8,#165a85);border-radius:16px;overflow:auto;position:relative;touch-action:pan-x pan-y;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}
.mapwrap svg{display:block;width:100%;height:auto}.mapwrap.zoom svg{width:175%}
.maptools{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;align-items:center}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
svg .hl{animation:pulse 1.1s ease-in-out infinite}svg .sel{animation:none}
@keyframes pulse{50%{opacity:.35}}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;animation:up .25s ease-out}
.lp-body .sheet{position:absolute}
@keyframes up{from{transform:translateY(100%)}}
.modal{position:fixed;inset:0;background:rgba(30,20,8,.55);display:grid;place-items:center;z-index:30;padding:16px}.lp-body .modal{position:absolute}
.modal .card{width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font-family:Cinzel,serif}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stp{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:12px;padding:6px 2px;box-shadow:0 1px 4px rgba(80,50,10,.15)}
.stp .e{font-size:22px}.stp .v{font:800 18px Inter}.stp .pm{display:flex;gap:4px}.stp .pm button{border:0;width:28px;height:28px;border-radius:8px;background:#e8dcc0;font-weight:800;font-size:16px}
.stp.on{box-shadow:0 0 0 2px #7a4b22}
.rsel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rsel button{border:2px solid transparent;border-radius:12px;padding:8px 2px;background:#fff;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(80,50,10,.15)}
.rsel button span{font-size:22px}.rsel button.on{border-color:#7a4b22;background:#fff3d8}.rsel button:disabled{opacity:.3}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px;border-left:6px solid var(--c);box-shadow:0 2px 6px rgba(80,50,10,.12)}
.pl .av{width:38px;height:38px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:20px;flex:none}
.pl .inf{flex:1;font-size:12px;color:var(--muted)}.pl .inf b{color:var(--ink);font-size:15px}.pl .vp{font:800 24px Cinzel,serif;color:#7a4b22}
.diary{display:flex;flex-direction:column;gap:8px}
.de{font-size:14px;line-height:1.4}
.dy{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 4px rgba(80,50,10,.1);font-size:14px;line-height:1.45}.dy small{color:var(--muted);display:block;font-size:11px;margin-bottom:2px}
.dy.day{background:linear-gradient(135deg,#243b6b,#3d5a96);color:#fff}.dy.day small{color:#c6d4f2}
.char{display:flex;gap:12px;align-items:center}.char .big{width:64px;height:64px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:36px;flex:none}
.char h3{margin:0;font-family:Cinzel,serif}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.stats div{background:#fff8ea;border-radius:10px;padding:6px;text-align:center;font-size:11px;color:var(--muted)}.stats b{display:block;font-size:18px;color:var(--ink)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2a1e12;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90%;text-align:center;animation:fade 3.2s forwards}.lp-body .toast{position:absolute}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-10px)}8%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#connbar{position:fixed;left:0;right:0;top:0;background:#c8372d;color:#fff;padding:8px;text-align:center;z-index:50;display:none;font-size:14px}#connbar.show{display:block}#connbar button{margin-left:8px;border:0;border-radius:8px;padding:4px 10px}
.costs{display:flex;flex-direction:column;gap:6px}.cost{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 1px 4px rgba(80,50,10,.12)}.cost b{flex:1;font-size:14px}.cost .rec{font-size:16px}.cost small{color:var(--muted);font-size:11px}
.rates{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.rates span{background:#fff;border-radius:8px;padding:4px 8px;font-size:13px;box-shadow:0 1px 3px rgba(80,50,10,.12)}
.offer{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 6px rgba(80,50,10,.12)}
.offer .big2{font-size:22px;letter-spacing:2px}
.winpad{text-align:center;padding:30px 10px}.winpad .crown{font-size:80px}

.why{display:block;font-style:normal;font-size:11px;color:#b03a22;line-height:1.25;margin-top:2px}
.bb:disabled{opacity:1;background:#f6efe0}.bb:disabled b,.bb:disabled .rec{opacity:.5}
.linkbtn{border:0;background:none;color:#7a4b22;font-weight:700;font-size:13px;padding:6px 2px;text-decoration:underline;cursor:pointer}
.minihand{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff8ea;border-radius:10px;padding:6px 8px;margin:6px 0;font-size:14px}.minihand span{color:var(--muted);font-size:12px}.minihand b.z{opacity:.35}
.stp .of{font-size:10px;color:var(--muted)}
.income{display:flex;flex-direction:column;gap:6px}.inr{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 1px 4px rgba(80,50,10,.12)}
.inr .tok{width:42px;height:42px;border-radius:50%;background:#f6ebcd;border:2px solid #a8884f;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 17px Inter;flex:none;line-height:1}.inr .tok i{font-style:normal;font-size:9px;letter-spacing:-1px}.inr .tok.red{color:#c0281f}

<script>// ===== ILHA NOVA — motor de regras (partilhado pela TV e pelos comandos) =====
(function (G) {
  'use strict';
  const RN = ['Madeira', 'Barro', 'Lã', 'Trigo', 'Pedra'];
  const RE = ['🌲', '🧱', '🐑', '🌾', '🪨'];
  const RC = ['#2f7d3c', '#c2562b', '#9ccf5a', '#e9c440', '#8d939a'];
  const TN = ['Floresta', 'Barreiro', 'Pastagem', 'Seara', 'Serra', 'Caldeira'];
  const COST = { road: [1, 1, 0, 0, 0], set: [1, 1, 1, 1, 0], city: [0, 0, 0, 2, 3], dev: [0, 0, 1, 1, 1] };
  const DEVN = ['Cavaleiro', 'Monumento', 'Construção de Estradas', 'Ano de Fartura', 'Monopólio'];
  const DEVE = ['🛡️', '🏛️', '🛤️', '🌟', '💰'];
  const DEVD = [
    'Move o Corsário e rouba 1 carta a um vizinho. Conta para a Ordem dos Cavaleiros.',
    'Vale 1 ponto de vitória, em segredo.',
    'Constrói 2 estradas de graça.',
    'Tira 2 cartas de recurso à tua escolha do banco.',
    'Escolhe um recurso: todos te dão todas as cartas desse recurso.'
  ];
  const MONU = ['Capela da Ponta', 'Farol Velho', 'Mercado Coberto', 'Escola Régia', 'Biblioteca'];
  const PCOL = ['#d8342c', '#2f6fd6', '#f08a1c', '#f4f1e8', '#2e9e4f', '#8a4f2a'];
  const PCOLN = ['Vermelho', 'Azul', 'Laranja', 'Branco', 'Verde', 'Castanho'];
  const OFI = [
    { e: '🪓', n: 'Lenhador(a)' }, { e: '🏺', n: 'Oleiro(a)' }, { e: '🐑', n: 'Pastor(a)' }, { e: '🌾', n: 'Lavrador(a)' },
    { e: '⛏️', n: 'Mineiro(a)' }, { e: '⚖️', n: 'Mercador(a)' }, { e: '⚓', n: 'Capitão/Capitã' }, { e: '🔨', n: 'Ferreiro(a)' }
  ];
  const TITLES = [[0, 'Recém-chegado'], [3, 'Colono'], [5, 'Proprietário'], [7, 'Senhor da Terra'], [9, 'Governador']];
  const PIPS = n => (n ? 6 - Math.abs(7 - n) : 0);
  const MAXP = 6;

  function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, r) { r = r || Math.random; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  // ---------- Tabuleiro (determinado pela semente) ----------
  const _bc = {};
  const NAMES = {
    0: ['Mata do Pico', 'Pinhal da Ribeira', 'Bosque dos Corvos', 'Mata Velha', 'Souto das Fontes', 'Pinhal do Farol', 'Mata da Lagoa', 'Bosque do Vale'],
    1: ['Barreiro do Sul', 'Olaria da Ponta', 'Telheiro Velho', 'Barreiro da Lagoa', 'Olaria do Vale', 'Telheiro dos Corvos'],
    2: ['Prado das Fontes', 'Lameiro do Norte', 'Pastagem da Ponta', 'Prado do Farol', 'Lameiro Velho', 'Pastagem do Pico', 'Prado da Ribeira', 'Lameiro do Vale'],
    3: ['Seara do Moinho', 'Campo da Ribeira', 'Seara Velha', 'Campo das Fontes', 'Seara do Sul', 'Campo do Farol', 'Seara da Lagoa', 'Campo dos Corvos'],
    4: ['Serra do Pico', 'Pedreira Funda', 'Mina dos Corvos', 'Serra Negra', 'Pedreira do Norte', 'Mina Velha'],
    5: ['Caldeira Grande', 'Caldeira Pequena']
  };
  function board(seed, big) {
    const key = seed + '|' + (big ? 1 : 0);
    if (_bc[key]) return _bc[key];
    const r = rng(seed);
    const rows = big ? [3, 4, 5, 6, 5, 4, 3] : [3, 4, 5, 4, 3];
    const S3 = Math.sqrt(3);
    const hex = [];
    rows.forEach((n, ri) => { for (let i = 0; i < n; i++) hex.push({ x: (i - (n - 1) / 2) * S3, y: (ri - (rows.length - 1) / 2) * 1.5, row: ri }); });
    const V = [], E = [], vk = {}, ek = {};
    const vid = (x, y) => { const k = Math.round(x * 100) + ',' + Math.round(y * 100); if (vk[k] === undefined) { vk[k] = V.length; V.push({ x, y, h: [], e: [], n: [], port: -1 }); } return vk[k]; };
    hex.forEach((h, hi) => {
      h.v = [];
      for (let k = 0; k < 6; k++) { const a = (60 * k - 90) * Math.PI / 180; const v = vid(h.x + Math.cos(a), h.y + Math.sin(a)); h.v.push(v); V[v].h.push(hi); }
      for (let k = 0; k < 6; k++) {
        const a = h.v[k], b = h.v[(k + 1) % 6], kk = Math.min(a, b) + '-' + Math.max(a, b);
        if (ek[kk] === undefined) { ek[kk] = E.length; E.push({ a: Math.min(a, b), b: Math.max(a, b), h: [] }); V[a].e.push(ek[kk]); V[b].e.push(ek[kk]); V[a].n.push(b); V[b].n.push(a); }
        E[ek[kk]].h.push(hi);
      }
    });
    E.forEach(e => { const A = V[e.a], B = V[e.b]; e.x = (A.x + B.x) / 2; e.y = (A.y + B.y) / 2; e.ang = Math.atan2(B.y - A.y, B.x - A.x); });
    hex.forEach((h, hi) => { h.nb = []; hex.forEach((g, gi) => { if (gi !== hi && Math.hypot(g.x - h.x, g.y - h.y) < 1.8) h.nb.push(gi); }); });
    // terrenos e números
    const terr = big ? [6, 5, 6, 6, 5, 2] : [4, 3, 4, 4, 3, 1];
    const nums = big ? [2, 2, 3, 3, 3, 4, 4, 4, 5, 5, 5, 6, 6, 6, 8, 8, 8, 9, 9, 9, 10, 10, 10, 11, 11, 11, 12, 12] : [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
    let ok = false, tries = 0;
    while (!ok && tries++ < 2000) {
      const ts = []; terr.forEach((c, t) => { for (let i = 0; i < c; i++) ts.push(t); }); shuffle(ts, r);
      const ns = shuffle(nums.slice(), r); let ni = 0;
      hex.forEach((h, hi) => { h.t = ts[hi]; h.n = h.t === 5 ? 0 : ns[ni++]; });
      ok = hex.every(h => !(h.n === 6 || h.n === 8) || h.nb.every(g => !(hex[g].n === 6 || hex[g].n === 8)));
      if (ok) ok = hex.every(h => !h.n || h.nb.every(g => hex[g].n !== h.n)) || tries > 400;
    }
    const used = {};
    hex.forEach(h => { const L = NAMES[h.t]; let i = Math.floor(r() * L.length); let c = 0; while (used[L[i]] && c++ < 20) i = (i + 1) % L.length; used[L[i]] = 1; h.name = used[L[i]] && c > 20 ? L[i] + ' II' : L[i]; });
    // portos
    const coast = E.map((e, i) => i).filter(i => E[i].h.length === 1);
    coast.sort((a, b) => Math.atan2(E[a].y, E[a].x) - Math.atan2(E[b].y, E[b].x));
    const pt = big ? [5, 5, 5, 5, 5, 0, 1, 2, 3, 4, 2] : [5, 5, 5, 5, 0, 1, 2, 3, 4];
    shuffle(pt, r);
    const off = r();
    const ports = [];
    for (let k = 0; k < pt.length; k++) {
      let idx = Math.floor((k + off) * coast.length / pt.length) % coast.length;
      const e = E[coast[idx]]; const h = hex[e.h[0]];
      let nx = e.x - h.x, ny = e.y - h.y; const L = Math.hypot(nx, ny); nx /= L; ny /= L;
      ports.push({ e: coast[idx], r: pt[k], x: e.x, y: e.y, nx, ny });
      V[e.a].port = k; V[e.b].port = k;
    }
    let maxx = 0, maxy = 0; V.forEach(v => { maxx = Math.max(maxx, Math.abs(v.x)); maxy = Math.max(maxy, Math.abs(v.y)); });
    const B = { hex, V, E, ports, big: !!big, w: maxx, h: maxy };
    _bc[key] = B; return B;
  }

  // ---------- utilitários de estado ----------
  const vOwner = (S, v) => { const c = S.vb[v]; if (c === '.') return null; const city = c >= 'A' && c <= 'Z'; return { p: c.toLowerCase().charCodeAt(0) - 97, city }; };
  const eOwner = (S, e) => { const c = S.eb[e]; return c === '.' ? -1 : c.charCodeAt(0) - 97; };
  const setCh = (s, i, ch) => s.slice(0, i) + ch + s.slice(i + 1);
  const sum = a => a.reduce((x, y) => x + y, 0);
  const has = (h, c) => c.every((n, i) => h[i] >= n);
  const pay = (S, P, c) => { c.forEach((n, i) => { P.h[i] -= n; S.bank[i] += n; }); };
  function counts(S, pi) { let set = 0, city = 0, road = 0; for (const c of S.vb) { if (c === '.') continue; const p = c.toLowerCase().charCodeAt(0) - 97; if (p === pi) { if (c >= 'A' && c <= 'Z') city++; else set++; } } for (const c of S.eb) if (c !== '.' && c.charCodeAt(0) - 97 === pi) road++; return { set, city, road }; }
  function vpPublic(S, pi) { const c = counts(S, pi); return c.set + 2 * c.city + (S.LR === pi ? 2 : 0) + (S.LA === pi ? 2 : 0); }
  function vpTotal(S, pi) { const P = S.P[pi]; return vpPublic(S, pi) + P.d[1] + P.dn[1]; }
  function title(vp) { let t = TITLES[0][1]; TITLES.forEach(([n, s]) => { if (vp >= n) t = s; }); return t; }
  function rates(S, pi) {
    const B = board(S.seed, S.big); const base = (S.o && S.o.bank) || 4; const r = [base, base, base, base, base];
    B.V.forEach((v, vi) => { if (v.port < 0) return; const o = vOwner(S, vi); if (!o || o.p !== pi) return; const pr = B.ports[v.port].r; if (pr === 5) { for (let i = 0; i < 5; i++) r[i] = Math.min(r[i], 3); } else r[pr] = Math.min(r[pr], 2); });
    return r;
  }
  function canSettleSpot(S, v) { const B = board(S.seed, S.big); if (S.vb[v] !== '.') return false; return B.V[v].n.every(w => S.vb[w] === '.'); }
  function validSet(S, pi, setup) {
    const B = board(S.seed, S.big); const out = [];
    B.V.forEach((v, vi) => { if (!canSettleSpot(S, vi)) return; if (!setup && !v.e.some(e => eOwner(S, e) === pi)) return; out.push(vi); });
    return out;
  }
  function validRoad(S, pi, fromV) {
    const B = board(S.seed, S.big); const out = [];
    B.E.forEach((e, ei) => {
      if (S.eb[ei] !== '.') return;
      if (fromV !== undefined && fromV !== null) { if (e.a === fromV || e.b === fromV) out.push(ei); return; }
      const ok = [e.a, e.b].some(v => { const o = vOwner(S, v); if (o) return o.p === pi; return B.V[v].e.some(x => x !== ei && eOwner(S, x) === pi); });
      if (ok) out.push(ei);
    });
    return out;
  }
  function validCity(S, pi) { const out = []; for (let i = 0; i < S.vb.length; i++) { const o = vOwner(S, i); if (o && o.p === pi && !o.city) out.push(i); } return out; }
  function longest(S, pi) {
    const B = board(S.seed, S.big); let best = 0; const used = new Set();
    function dfs(v, depth) {
      let m = depth; const o = vOwner(S, v);
      if (depth > 0 && o && o.p !== pi) return depth;
      for (const e of B.V[v].e) { if (used.has(e) || eOwner(S, e) !== pi) continue; used.add(e); const E = B.E[e]; m = Math.max(m, dfs(E.a === v ? E.b : E.a, depth + 1)); used.delete(e); }
      return m;
    }
    const starts = new Set(); B.E.forEach((e, ei) => { if (eOwner(S, ei) === pi) { starts.add(e.a); starts.add(e.b); } });
    starts.forEach(v => { best = Math.max(best, dfs(v, 0)); });
    return best;
  }


  // porque é que não posso construir? ('' = podes)
  function whyNot(S, pi, k) {
    const P = S.P[pi]; const c = counts(S, pi);
    const okStep = (S.step === 'main' && S.turn === pi) || (S.step === 'sb' && (S.sbq || []).includes(pi));
    if (!okStep) return S.turn === pi && S.step === 'roll' ? 'Lança primeiro os dados.' : 'Só na tua vez, depois de lançar os dados.';
    const cost = COST[k]; const miss = cost.map((n, i) => Math.max(0, n - P.h[i]));
    if (k === 'road' && c.road >= 15) return 'Já usaste as 15 estradas.';
    if (k === 'set' && c.set >= 5) return 'Já tens 5 aldeias: transforma uma em cidade para libertar uma.';
    if (k === 'city' && c.city >= 4) return 'Já tens as 4 cidades.';
    if (k === 'dev' && !(S.dk !== undefined ? S.dk : (S.deck || []).length)) return 'Já não há cartas no baralho.';
    if (sum(miss)) return 'Falta: ' + fmtRes(miss);
    if (k === 'road' && !validRoad(S, pi).length) return 'Não há troço livre ligado a algo teu.';
    if (k === 'city' && !validCity(S, pi).length) return 'Não tens nenhuma aldeia para transformar.';
    if (k === 'set' && !validSet(S, pi).length) return 'Nenhum cruzamento serve: tem de tocar numa estrada tua e ficar a 2+ troços de qualquer aldeia. Constrói estradas primeiro.';
    return '';
  }
  // o que cada número te dá
  function income(S, pi) {
    const B = board(S.seed, S.big); const out = {};
    B.hex.forEach((h, hi) => {
      if (h.t === 5) return; let amt = 0;
      h.v.forEach(v => { const o = vOwner(S, v); if (o && o.p === pi) amt += o.city ? 2 : 1; });
      if (!amt) return; (out[h.n] = out[h.n] || []).push({ hx: hi, t: h.t, amt, blocked: hi === S.rob, name: h.name });
    });
    return out;
  }

  function ev(S, arr) { S.eid = (S.eid || 0) + 1; arr.splice(1, 0, S.eid); S.E.push(arr); if (S.E.length > 10) S.E.shift(); }
  function log(S, s) { S.L.push(s); if (S.L.length > 5) S.L.shift(); }
  const nm = (S, pi) => S.P[pi] ? S.P[pi].n : '?';

  function updateLR(S) {
    const lens = S.P.map((_, i) => longest(S, i)); S.P.forEach((P, i) => { P.lr = lens[i]; });
    const max = Math.max(...lens); const prev = S.LR;
    if (prev >= 0 && lens[prev] >= 5 && lens[prev] === max) return;
    if (max < 5) { S.LR = -1; } else { const top = lens.map((l, i) => l === max ? i : -1).filter(i => i >= 0); S.LR = top.length === 1 ? top[0] : (top.includes(prev) ? prev : -1); }
    if (S.LR !== prev) { if (S.LR >= 0) { ev(S, ['lr', S.LR]); log(S, `🛤️ ${nm(S, S.LR)} tem agora a Estrada Real (${max} troços).`); } else if (prev >= 0) { ev(S, ['lr', -1]); log(S, `🛤️ A Estrada Real ficou sem dono.`); } }
  }
  function checkWin(S) {
    const pi = S.turn; if (S.ph !== 'play') return;
    if (vpTotal(S, pi) >= S.o.vp) { S.ph = 'end'; S.win = pi; S.step = 'end'; ev(S, ['w', pi]); log(S, `👑 ${nm(S, pi)} é a Lenda da Ilha com ${vpTotal(S, pi)} pontos!`); }
  }

  // ---------- novo jogo ----------
  function newGame(players, opts) {
    const n = players.length;
    const big = n > 4 || !!opts.big;
    const seed = Math.floor(Math.random() * 2e9);
    const B = board(seed, big);
    const first = Math.floor(Math.random() * n);
    const order = []; for (let k = 0; k < n; k++) order.push((first + k) % n);
    const deck = [];
    const dc = big ? [20, 5, 3, 3, 3] : [14, 5, 2, 2, 2];
    dc.forEach((c, t) => { for (let i = 0; i < c; i++) deck.push(t); }); shuffle(deck);
    const S = {
      v: 1, ph: 'play', seed, big, o: Object.assign({ vp: 10, sb: true, pace: 1 }, opts),
      vb: '.'.repeat(B.V.length), eb: '.'.repeat(B.E.length), rob: B.hex.findIndex(h => h.t === 5),
      bank: Array(5).fill(big ? 24 : 19), deck,
      P: players.map(p => ({ n: p.n, c: p.c, o: p.o, id: p.id, bot: p.bot || 0, loc: p.loc || 0, h: [0, 0, 0, 0, 0], d: [0, 0, 0, 0, 0], dn: [0, 0, 0, 0, 0], k: 0, lr: 0 })),
      first, sq: order.concat(order.slice().reverse()), si: 0, turn: order[0], step: 'setS', lastV: -1,
      dice: [0, 0], dp: 0, dq: {}, vic: [], free: 0, sbq: [], tr: null, LR: -1, LA: -1, rd: 0, E: [], L: [], eid: 0, win: -1, ret: 'main', rl: 0
    };
    log(S, `🏝️ Os colonos chegam à Ilha Nova. ${nm(S, S.turn)} escolhe primeiro onde se instalar.`);
    ev(S, ['start']);
    return S;
  }

  function nextTurn(S) {
    S.tr = null; S.dp = 0; S.sbq = []; S.tn = (S.tn || 0) + 1;
    S.turn = (S.turn + 1) % S.P.length; S.step = 'roll'; S.dice = [0, 0];
    if (S.turn === S.first) { S.rd++; ev(S, ['day', S.rd + 1]); }
    log(S, `▶️ Vez de ${nm(S, S.turn)}.`);
    checkWin(S);
  }
  function endTurn(S) {
    const P = S.P[S.turn];
    for (let i = 0; i < 5; i++) { P.d[i] += P.dn[i]; P.dn[i] = 0; }
    S.tr = null;
    if (S.o.sb && S.P.length > 4) {
      S.step = 'sb'; S.sbq = S.P.map((_, i) => i).filter(i => i !== S.turn);
      log(S, `🔨 Fase de construção: os outros podem construir antes da vez de ${nm(S, (S.turn + 1) % S.P.length)}.`);
      ev(S, ['sb']);
    } else nextTurn(S);
  }

  function produce(S, roll) {
    const B = board(S.seed, S.big); const want = [];
    B.hex.forEach((h, hi) => { if (h.n !== roll || hi === S.rob || h.t === 5) return; h.v.forEach(v => { const o = vOwner(S, v); if (o) want.push([o.p, h.t, o.city ? 2 : 1, hi]); }); });
    const got = [], short = [];
    for (let r = 0; r < 5; r++) {
      const w = want.filter(x => x[1] === r); if (!w.length) continue;
      const tot = sum(w.map(x => x[2])); const ps = new Set(w.map(x => x[0]));
      if (tot <= S.bank[r]) w.forEach(x => got.push(x));
      else if (ps.size === 1) { let left = S.bank[r]; w.forEach(x => { const g = Math.min(left, x[2]); left -= g; if (g) got.push([x[0], r, g, x[3]]); }); short.push(r); }
      else short.push(r);
    }
    got.forEach(([p, r, n]) => { S.P[p].h[r] += n; S.bank[r] -= n; });
    if (got.length) ev(S, ['p', got]);
    if (short.length) log(S, `🏦 O banco não tinha ${short.map(r => RN[r]).join(', ')} que chegasse.`);

  // ---- câmara ----
  let viewShift = 0, curShift = -1;

  }
  function dust(p) {

  function sync(S, animate) {
    if (!B) return;
    const proms = [];
    for (let v = 0; v < S.vb.length; v++) {

      if (cur && cur.ch === ch) continue;

      const pl = S.P[p]; const o = house(E.PCOL[pl.c], city); o.scale.setScalar(city ? 1.45 : 1.6); const pos = vPos(v);
      const h = B.V[v].h.map(i => B.hex[i]); let ax = 0, az = 0; h.forEach(x => { ax += x.x; az += x.y; }); o.rotation.y = Math.atan2(pos.x - ax / h.length, pos.z - az / h.length) + Math.PI;
      G.pieces.add(o); pieceMap.v[v] = { ch, o };
      if (animate) { proms.push(dropIn(o, pos)); focus(pos.x, pos.z, 2.4, 0.5); } else o.position.copy(pos);
    }
    for (let e = 0; e < S.eb.length; e++) {
      const ch = S.eb[e], cur = pieceMap.e[e];
      if (ch === '.') { if (cur) { G.pieces.remove(cur.o); delete pieceMap.e[e]; } continue; }
      if (cur) continue;

      const o = mesh(new THREE.BoxGeometry(0.62, 0.1, 0.13), M(E.PCOL[S.P[p].c], { roughness: 0.6 }));
      o.position.set(ed.x, TOP + 0.04, ed.y); o.rotation.y = -ed.ang; G.pieces.add(o); pieceMap.e[e] = { o };
      if (animate) { o.scale.set(0.01, 1, 1); proms.push(tween(800 / pace, k => { o.scale.x = Math.max(0.01, k); })); focus(ed.x, ed.y, 2, 0.6); }
    }
    // corsário

      else { const from = robber.position.clone(); focus(h.x, h.y, 2.6, 0.5); proms.push(tween(1700 / pace, k => { robber.position.lerpVectors(from, to, k); robber.position.y = TOP + Math.sin(k * Math.PI) * 2.2; robber.rotation.y = k * Math.PI * 4; }).then(() => dust(to))); }
      tokens.forEach((t, i) => { if (t) t.material[1].color.set(i === S.rob ? '#7a7066' : '#ffffff'); });

      for (let i = have; i < pl.k; i++) { const kn = knightM(E.PCOL[pl.c]); kn.userData.p = p; G.knights.add(kn); const to = campSpot(S, p, i); if (animate) proms.push(marchKnight(kn, to)); else kn.position.copy(to); }

  }
  function campSpot(S, p, i) {

    B.hex.forEach((h, i) => { if (h.n === n && tokens[i]) { const t = tokens[i]; const m = t.material[1]; tween(2600 / pace, k => { const s = Math.sin(k * Math.PI); t.position.y = TOP + 0.03 + s * 0.35; m.emissiveIntensity = s * (i === robHex ? 0.1 : 0.9); t.rotation.y = s * 0.3; }); const tile = hexTops[i]; const m2 = tile.material[1]; const base = m2.emissive.clone(); m2.emissive = new THREE.Color(i === robHex ? '#000' : '#ffe9a8'); tween(2600 / pace, k => { m2.emissiveIntensity = Math.sin(k * Math.PI) * 0.35; }).then(() => { m2.emissiveIntensity = 0; }); } });

    sun.position.set(Math.cos(a) * 14, 4 + Math.max(0, Math.sin((t - 0.25) * Math.PI * 2 + Math.PI / 2)) * 12 + 2, 7);

    const sky = SKY_NIGHT.clone().lerp(SKY_DAY, day).lerp(SKY_DUSK, dusk * 0.55);

    smokes.forEach(s => { const u = s.userData; u.t = (u.t + dt * 0.25) % 1; s.position.set(u.x + Math.sin(u.t * 5) * 0.05, u.y + u.t * 0.7, u.z); s.scale.setScalar(0.6 + u.t * 2.2); s.material.opacity = 0.55 * (1 - u.t); });
    mills.forEach(m => { m.rotation.z += dt * 1.2; });
    // câmara
    if (tday !== tdayTarget && !tweens.some(w => w.night)) tday += (tdayTarget - tday) * Math.min(1, dt * 0.8);
    applyDay();

  };
}

<script>// ===== ILHA NOVA — TV, comando e rede =====
const UI = (() => {
  const E = window.ENG;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clean = s => String(s || '').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, '').trim();

  const APP_URL = window.__SALA_URL || 'https://claude.ai/artifact/Km7Nb8wztZzFiCQbYB6RoC';
  let mode = null;

  // ---------- som ----------
  const Sound = (() => {
    let ctx = null, on = true;
    const ac = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } return ctx; };
    function tone(f, d, type = 'sine', v = 0.12, delay = 0) { const c = ac(); if (!c || !on) return; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, c.currentTime + delay); g.gain.linearRampToValueAtTime(v, c.currentTime + delay + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + d); o.connect(g).connect(c.destination); o.start(c.currentTime + delay); o.stop(c.currentTime + delay + d + 0.05); }
    function noise(d, v = 0.15, delay = 0) { const c = ac(); if (!c || !on) return; const b = c.createBuffer(1, c.sampleRate * d, c.sampleRate); const a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length); const s = c.createBufferSource(); s.buffer = b; const g = c.createGain(); g.gain.value = v; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime + delay); }
    return {
      dice() { for (let i = 0; i < 7; i++) noise(0.05, 0.25, i * 0.12 + Math.random() * 0.05); },
      build() { tone(110, 0.25, 'triangle', 0.25); noise(0.15, 0.12, 0.02); },
      coin() { tone(988, 0.12, 'square', 0.05); tone(1318, 0.25, 'square', 0.05, 0.08); },
      card() { noise(0.08, 0.1); },
      pirate() { tone(98, 0.9, 'sawtooth', 0.09); tone(92, 0.9, 'sawtooth', 0.06, 0.05); },
      horn() { [392, 523, 659].forEach((f, i) => tone(f, 0.5, 'triangle', 0.1, i * 0.12)); },
      fanfare() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.35, 'triangle', 0.12, i * 0.16)); },
      night() { [330, 262, 196].forEach((f, i) => tone(f, 0.8, 'sine', 0.06, i * 0.3)); },
      toggle() { on = !on; return on; }, unlock() { ac(); if (ctx && ctx.state === 'suspended') ctx.resume(); }
    };
  })();

  // ---------- rede ----------
  const Net = {
    ok: false, lobby: null, r: null,
    async connect(code) {
      try { if (!window.claude || !window.claude.use) return false; const room = await window.claude.use('room'); if (!room) return false; this.lobby = room; this.r = await room.join('ilha-' + code); this.ok = true; return true; } catch (e) { console.warn('room', e); return false; }
    },
    async rejoin(code) { try { await this.r.leave(); } catch (e) { } try { this.r = await this.lobby.join('ilha-' + code); this.ok = true; } catch (e) { } }
  };

  // ---------- início ----------
  function start() {
    const saved = LS.get('ilha-save');
    $('#start').innerHTML = `<div class="st-box"><div class="st-island">🏝️</div><div class="logo">Ilha Nova</div><p class="tag">Colonos, estradas, cidades e um corsário à espreita.<br>3 a 6 jogadores · TV + telemóveis</p>
      <button class="btn big gold" id="goTv">📺 Este ecrã é a TV</button>
      ${saved ? '<button class="btn big sea" id="goResume">↩️ Retomar a partida guardada</button>' : ''}

      <p class="muted">Abre esta página na TV (ou no portátil ligado à TV) e escolhe <b>TV</b>. Cada jogador abre a mesma página no telemóvel, escolhe <b>comando</b> e escreve o código que aparece na TV.</p></div>`;
    $('#start').classList.add('show');
    $('#goTv').onclick = () => { Sound.unlock(); startTV(null); };
    $('#goPad').onclick = () => startPad();
    const r = $('#goResume'); if (r) r.onclick = () => { Sound.unlock(); try { startTV(JSON.parse(saved)); } catch (e) { startTV(null); } };
  }

  // ======================================================================
  // TV
  // ======================================================================
  let S = null, code = '', V3 = null, sv = 0, acks = {}, errs = {}, padSeen = {}, discAt = {};
  let localSel = -1, localPad = null, lpHidden = false;
  async function startTV(saved) {
    mode = 'tv'; $('#start').classList.remove('show'); $('#tv').classList.add('show');
    if (saved && saved.S) { S = saved.S; code = saved.code; acks = saved.acks || {}; }
    else { code = String(1000 + Math.floor(Math.random() * 9000)); S = { ph: 'lobby', P: [], o: { vp: 10, sb: true, pace: 'normal', bank: 4 } }; }
    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
      V3 = make3D(THREE, $('#three')); V3.setShift(140);
    } catch (e) { console.warn('3D indisponível', e); V3 = null; $('#three').classList.add('flat'); }
    if (V3) V3.setPace(PACE[S.o.pace] || 1);
    if (S.ph !== 'lobby') { if (V3) { V3.buildBoard(S.seed, S.big); V3.sync(S, false); } }
    else if (V3) { V3.buildBoard(123456, false); }
    renderTV();
    const ok = await Net.connect(code);
    if (ok) { Net.r.onPeers(onPeersTV); }
    else note('Sem ligação aos telemóveis nesta janela: podes jogar com bots e com jogadores neste ecrã.');
    push();
    setInterval(botTick, 350);
    setInterval(() => { checkDisconnected(); if (Net.ok) Net.r.presence({ role: 'tv', code, st: snap(), hb: Date.now() % 100000 }).catch(() => { }); }, 3000);
  }
  function note(t) { const n = $('#notice'); n.innerHTML = t; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 7000); }

  function snap() {
    if (S.ph === 'lobby') return { v: sv, ph: 'lobby', code, P: S.P.map(p => ({ n: p.n, c: p.c, o: p.o, id: p.id, bot: p.bot || 0, loc: p.loc || 0 })), o: S.o, ak: acks };
    const o = {
      v: sv, ph: S.ph, code, seed: S.seed, big: S.big, vb: S.vb, eb: S.eb, rob: S.rob, bank: S.bank, dk: S.deck.length,
      turn: S.turn, step: S.step, dice: S.dice, rl: S.rl, dp: S.dp, dq: S.P.map((_, i) => S.dq[i] || 0), vic: S.vic, free: S.free, sbq: S.sbq,
      tr: S.tr ? { f: S.tr.f, g: S.tr.g, w: S.tr.w, r: S.P.map((_, i) => S.tr.r[i] === undefined ? null : S.tr.r[i]), id: S.tr.id } : null, LR: S.LR, LA: S.LA, rd: S.rd, E: S.E.slice(-8), L: S.L.slice(-3),
      ak: acks, er: errs, win: S.win, o: S.o, lastV: S.lastV, si: S.si, first: S.first,
      P: S.P.map(p => ({ n: p.n, c: p.c, o: p.o, id: p.id, bot: p.bot || 0, loc: p.loc || 0, h: p.h, d: p.d, dn: p.dn, k: p.k, lr: p.lr }))
    };
    let j = JSON.stringify(o);
    while (j.length > 3700 && o.L.length) { o.L.shift(); j = JSON.stringify(o); }
    while (j.length > 3700 && o.E.length > 2) { o.E.shift(); j = JSON.stringify(o); }
    return o;
  }
  function push() {
    sv++;
    if (Net.ok) Net.r.presence({ role: 'tv', code, st: snap() }).catch(e => console.warn('presence', e));
    if (S.ph !== 'lobby') LS.set('ilha-save', JSON.stringify({ S, code, acks }));
    renderTV();
  }

  // ---- receção dos comandos ----
  function onPeersTV(ch) {
    const peers = ch.peers || [];
    const now = Date.now();
    peers.forEach(pr => {
      const p = pr.presence; if (!p || p.role !== 'pad' || p.code !== code || !p.cid) return;
      const cid = String(p.cid).slice(0, 16);
      padSeen[cid] = now;
      if (S.ph === 'lobby' && p.join) {
        const j = p.join; const n = clean(j.n).slice(0, 14) || 'Colono'; const c = Math.max(0, Math.min(5, j.c | 0)); const o = Math.max(0, Math.min(7, j.o | 0));
        let pl = S.P.find(x => x.id === cid);
        const taken = S.P.some(x => x.id !== cid && x.c === c);
        if (!pl && S.P.length < E.MAXP && !taken) { S.P.push({ n, c, o, id: cid }); push(); }
        else if (pl && (pl.n !== n || pl.c !== c || pl.o !== o) && !taken) { pl.n = n; pl.c = c; pl.o = o; push(); }
      }
      if (S.ph !== 'lobby' && p.claim !== undefined && p.claim !== null) {
        const k = p.claim | 0; const q = S.P[k];
        if (q && !q.id.startsWith('bot') && (q.loc || q.bot || !padSeen[q.id] || now - padSeen[q.id] > 6000) && !S.P.some(x => x.id === cid)) { q.id = cid; q.loc = 0; q.bot = 0; S.E && S.L.push(`📱 ${q.n} voltou ao seu comando.`); push(); }
      }
      const c = p.cmd;
      if (c && c.n && c.n > (acks[cid] || 0)) {
        acks[cid] = c.n;
        if (S.ph === 'lobby') { push(); return; }
        const pi = S.P.findIndex(x => x.id === cid); if (pi < 0) return;
        const cmd = Object.assign({}, c); delete cmd.n;
        enqueue(pi, cmd, { cid, n: c.n });
      }
    });
    // remover do lobby quem saiu
    if (S.ph === 'lobby') {
      const here = new Set(peers.filter(pr => pr.presence && pr.presence.role === 'pad').map(pr => String(pr.presence.cid)));
      const before = S.P.length; S.P = S.P.filter(p => p.bot || p.loc || here.has(p.id)); if (S.P.length !== before) push();
    }
  }
  const queue = []; let busy = false;
  function enqueue(pi, cmd, src) { queue.push({ pi, cmd, src }); pump(); }
  async function pump() {
    if (busy) return; busy = true;
    while (queue.length) { const q = queue.shift(); try { await handle(q.pi, q.cmd, q.src); } catch (e) { console.error(e); } }
    busy = false;
  }
  function setErr(src, m) { if (!src) return; if (src.local) { toastLocal(m); return; } errs = {}; errs[src.cid] = { m, n: src.n }; }
  let pace = 1;
  async function handle(pi, cmd, src) {
    if (S.ph !== 'play') return;
    pace = typeof S.o.pace === 'number' ? S.o.pace : (PACE[S.o.pace] || 1);
    if (cmd.a === 'roll') {

    }
    const before = S.eid;
    const err = E.act(S, pi, cmd);
    if (err) { S.rl = 0; setErr(src, err); push(); return; }
    if (src && !src.local) delete errs[src.cid];
    const evs = S.E.filter(e => e[1] > before);
    push();
    await animate(evs);
    await sleep(350 / pace);
  }

  // ---- animações de eventos ----
  async function animate(evs) {
    let synced = false;
    const doSync = async () => { if (synced) return; synced = true; if (V3) await V3.sync(S, true); };
    for (const e of evs) {

  // ---- comando local (no ecrã da TV) ----

    const act = locals.find(k => S.turn === k) ?? locals.find(need);

  function toastLocal(m) { const b = $('#localpad .lp-body'); if (!b) return; const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; b.appendChild(t); setTimeout(() => t.remove(), 3300); }

  // ======================================================================
  // MAPA 2D (SVG) — usado no telemóvel e como recurso na TV
  // ======================================================================
  const HC = ['#4c8f45', '#c4703f', '#a3d065', '#ecc84f', '#9aa0a6', '#d8b37a'];
  const TI = ['🌲', '🧱', '🐑', '🌾', '⛰️', '🌋'];
  function mapSVG(V, opt) {
    opt = opt || {};
    const B = E.board(V.seed, V.big); const k = 50;
    const W = (B.w + 1.25) * k, H = (B.h + 1.15) * k;
    const pt = (x, y) => `${(x * k).toFixed(1)},${(y * k).toFixed(1)}`;
    let s = `<svg viewBox="${-W} ${-H} ${2 * W} ${2 * H}" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">`;
    s += `<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity=".45"/></filter></defs>`;
    // praia
    B.hex.forEach(h => { const pts = []; for (let i = 0; i < 6; i++) { const a = (60 * i - 90) * Math.PI / 180; pts.push(pt(h.x + Math.cos(a) * 1.13, h.y + Math.sin(a) * 1.13)); } s += `<polygon points="${pts.join(' ')}" fill="#e9d59c"/>`; });
    // portos
    B.ports.forEach(p => { const e = B.E[p.e]; const cx = p.x + p.nx * 0.62, cy = p.y + p.ny * 0.62; [e.a, e.b].forEach(v => { s += `<line x1="${B.V[v].x * k}" y1="${B.V[v].y * k}" x2="${cx * k}" y2="${cy * k}" stroke="#7a5230" stroke-width="4"/>`; }); s += `<circle cx="${cx * k}" cy="${cy * k}" r="17" fill="#fff8e6" stroke="#7a5230" stroke-width="2.5"/><text x="${cx * k}" y="${cy * k - 2}" text-anchor="middle" font-size="${p.r === 5 ? 12 : 13}" font-weight="800">${p.r === 5 ? '3:1' : E.RE[p.r]}</text><text x="${cx * k}" y="${cy * k + 10}" text-anchor="middle" font-size="8" fill="#7a5230" font-weight="700">${p.r === 5 ? 'qualquer' : '2:1'}</text>`; });
    // hexágonos
    B.hex.forEach((h, hi) => {
      const pts = h.v.map(v => pt(B.V[v].x, B.V[v].y)).join(' ');
      const hl = opt.hexes && opt.hexes.includes(hi);
      s += `<polygon points="${pts}" fill="${HC[h.t]}" stroke="#5a4127" stroke-width="2" ${hl ? `data-hx="${hi}"` : ''}/>`;
      s += `<text x="${h.x * k}" y="${h.y * k - 19}" text-anchor="middle" font-size="17" pointer-events="none">${TI[h.t]}</text>`;
      if (h.n) { const red = h.n === 6 || h.n === 8; s += `<circle cx="${h.x * k}" cy="${h.y * k + 7}" r="14" fill="${hi === V.rob ? '#bdb4a6' : '#f6ebcd'}" stroke="#a8884f" stroke-width="1.5" pointer-events="none"/><text x="${h.x * k}" y="${h.y * k + 12}" text-anchor="middle" font-size="${red ? 16 : 14}" font-weight="800" fill="${red ? '#c0281f' : '#2a1e12'}" pointer-events="none">${h.n}</text>`; for (let i = 0; i < E.PIPS(h.n); i++) s += `<circle cx="${h.x * k + (i - (E.PIPS(h.n) - 1) / 2) * 4}" cy="${h.y * k + 17}" r="1.3" fill="${red ? '#c0281f' : '#2a1e12'}" pointer-events="none"/>`; }
      if (hl) s += `<polygon points="${pts}" fill="rgba(255,230,120,.35)" stroke="#ffe066" stroke-width="5" class="${opt.sel === 'h' + hi ? 'sel' : 'hl'}" data-hx="${hi}"/>`;
    });
    // corsário
    { const h = B.hex[V.rob]; s += `<g pointer-events="none" filter="url(#sh)"><circle cx="${h.x * k + 19}" cy="${h.y * k + 8}" r="12" fill="#1d1b22"/><text x="${h.x * k + 19}" y="${h.y * k + 13}" text-anchor="middle" font-size="13">🏴‍☠️</text></g>`; }
    // estradas
    B.E.forEach((e, ei) => {
      const A = B.V[e.a], C = B.V[e.b]; const o = V.eb[ei];
      const x1 = A.x + (C.x - A.x) * 0.16, y1 = A.y + (C.y - A.y) * 0.16, x2 = A.x + (C.x - A.x) * 0.84, y2 = A.y + (C.y - A.y) * 0.84;
      if (o !== '.') { const p = o.charCodeAt(0) - 97; s += `<line x1="${x1 * k}" y1="${y1 * k}" x2="${x2 * k}" y2="${y2 * k}" stroke="#2a1e12" stroke-width="9" stroke-linecap="round"/><line x1="${x1 * k}" y1="${y1 * k}" x2="${x2 * k}" y2="${y2 * k}" stroke="${E.PCOL[V.P[p].c]}" stroke-width="6" stroke-linecap="round"/>`; }
      if (opt.edges && opt.edges.includes(ei)) { const sel = opt.sel === 'e' + ei; s += `<line x1="${x1 * k}" y1="${y1 * k}" x2="${x2 * k}" y2="${y2 * k}" stroke="${sel ? '#fff' : '#ffe066'}" stroke-width="${sel ? 10 : 8}" stroke-linecap="round" class="${sel ? 'sel' : 'hl'}" stroke-dasharray="${sel ? '' : '4 5'}"/><line x1="${A.x * k}" y1="${A.y * k}" x2="${C.x * k}" y2="${C.y * k}" stroke="transparent" stroke-width="22" data-e="${ei}"/>`; }
    });
    // aldeias e cidades
    B.V.forEach((v, vi) => {
      const o = V.vb[vi]; const x = v.x * k, y = v.y * k;
      if (o !== '.') { const p = o.toLowerCase().charCodeAt(0) - 97, city = o !== o.toLowerCase(); const c = E.PCOL[V.P[p].c];
        s += city ? `<path d="M${x - 13},${y + 9} v-12 l7,-6 l6,5 v-6 h8 v19 z" fill="${c}" stroke="#2a1e12" stroke-width="2" filter="url(#sh)"/>` : `<path d="M${x - 8},${y + 7} v-9 l8,-7 l8,7 v9 z" fill="${c}" stroke="#2a1e12" stroke-width="2" filter="url(#sh)"/>`; }
      if (opt.verts && opt.verts.includes(vi)) { const sel = opt.sel === 'v' + vi; s += `<circle cx="${x}" cy="${y}" r="${sel ? 12 : 9}" fill="${sel ? '#fff' : '#ffe066'}" stroke="#2a1e12" stroke-width="2" class="${sel ? 'sel' : 'hl'}"/><circle cx="${x}" cy="${y}" r="20" fill="transparent" data-v="${vi}"/>`; }
    });
    s += '</svg>';
    return s;
  }

  // ======================================================================
  // COMANDO (renderizador partilhado: telemóvel e painel local na TV)
  // ======================================================================
  function makePad(root, api) {
    const st = { tab: 'jogo', mode: null, sel: null, tg: [0, 0, 0, 0, 0], tw: [0, 0, 0, 0, 0], bg: -1, bw: -1, disc: [0, 0, 0, 0, 0], yp: [], zoom: false, devPick: null, lastErrN: 0, autoKey: '' };
    const diary = { list: [], seen: 0, key: '' };
    function V() { return api.getV(); }
    function loadDiary(v, me) {
      const key = 'ilha-diary-' + v.code + '-' + v.seed + '-' + (v.P[me] ? v.P[me].id : me);
      if (diary.key === key) return;
      diary.key = key; diary.list = []; diary.seen = 0;
      try { const d = JSON.parse(LS.get(key) || 'null'); if (d) { diary.list = d.list || []; diary.seen = d.seen || 0; } } catch (e) { }
    }
    function addDiary(v, me) {
      let changed = false;
      (v.E || []).forEach(e => { if (e[1] <= diary.seen) return; diary.seen = e[1]; const t = narrate(v, e, me); if (t) { diary.list.unshift({ t, d: v.rd + 1, k: e[0] === 'day' ? 'day' : '' }); changed = true; } });
      if (diary.list.length > 120) diary.list.length = 120;
      if (changed) LS.set(diary.key, JSON.stringify({ list: diary.list, seen: diary.seen }));
    }
    function render() {
      const v = V(); const me = api.me();
      if (!v || v.ph === 'lobby' || !v.P[me]) { root.innerHTML = ''; return; }
      loadDiary(v, me); addDiary(v, me);
      const P = v.P[me]; const mine = v.turn === me;
      // erros vindos da TV
      const er = v.er && v.er[P.id]; if (er && er.n !== st.lastErrN) { st.lastErrN = er.n; toast(er.m); }
      // modos automáticos
      const auto = `${v.step}|${v.turn}|${v.si}|${v.free}`;
      if (auto !== st.autoKey) {
        st.autoKey = auto; st.sel = null;
        if (mine && v.step === 'setS') { st.mode = 'set0'; st.tab = 'mapa'; }
        else if (mine && v.step === 'setR') { st.mode = 'road0'; st.tab = 'mapa'; }
        else if (mine && v.step === 'rob') { st.mode = 'rob'; st.tab = 'mapa'; }
        else if (mine && v.step === 'rb') { st.mode = 'roadf'; st.tab = 'mapa'; }
        else if (st.mode && ['set0', 'road0', 'rob', 'roadf'].includes(st.mode)) { st.mode = null; if (st.tab === 'mapa' && mine && v.step === 'main') st.tab = 'jogo'; }
        if (!mine && v.step !== 'sb') st.mode = null;
        if (mine && (v.step === 'roll' || v.step === 'main') && !api.local) { try { navigator.vibrate && navigator.vibrate(60); } catch (e) { } }
      }
      const vp = E.vpTotal(v, me);
      const scroll = root.querySelector('.pbody') ? root.querySelector('.pbody').scrollTop : 0;
      root.innerHTML = `<div class="pad" style="--c:${E.PCOL[P.c]}">
        <div class="phead"><div class="av">${E.OFI[P.o].e}</div><div class="who"><b>${esc(P.n)}</b><small>${E.title(vp)} · ${E.OFI[P.o].n} · Dia ${v.rd + 1}</small></div><div class="vp">${vp}<small>de ${v.o.vp} pts</small></div></div>
        <div class="pbody">${body(v, me)}</div>
        <div class="pnav">${[['jogo', '🏝️', 'Jogo'], ['mapa', '🗺️', 'Mapa'], ['mercado', '⚖️', 'Mercado'], ['diario', '📜', 'Diário'], ['ilha', '👥', 'Ilha'], ['regras', '📖', 'Regras']].map(([k, e, l]) => `<button data-tab="${k}" class="${st.tab === k ? 'on' : ''}"><span>${e}</span>${l}${k === 'mercado' && v.tr && v.tr.f !== me && v.tr.r[me] == null ? '<i class="nb">!</i>' : ''}</button>`).join('')}</div>
        ${modals(v, me)}${sheet(v, me)}</div>`;
      const pb = root.querySelector('.pbody'); if (pb && (st.keepScroll || st.lastTab === st.tab)) pb.scrollTop = scroll; st.keepScroll = false; st.lastTab = st.tab;
      bind(v, me);
    }
    function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; root.appendChild(t); setTimeout(() => t.remove(), 3300); }
    function send(c) { api.send(c); }
    const recipe = c => c.map((n, i) => E.RE[i].repeat(n)).join('');
    function canBuild(v, me, k) {
      const P = v.P[me]; const c = E.counts(v, me);
      const step = v.step === 'main' && v.turn === me || (v.step === 'sb' && v.sbq.includes(me));
      if (!step) return false;
      if (k === 'road') return E.has(P.h, E.COST.road) && c.road < 15 && E.validRoad(v, me).length > 0;
      if (k === 'set') return E.has(P.h, E.COST.set) && c.set < 5 && E.validSet(v, me).length > 0;
      if (k === 'city') return E.has(P.h, E.COST.city) && c.city < 4 && E.validCity(v, me).length > 0;
      if (k === 'dev') return E.has(P.h, E.COST.dev) && v.dk > 0;

    function statusCard(v, me) {

      if (v.ph === 'end') { const w = v.P[v.win]; return `<div class="winpad"><div class="crown">👑</div><h2 style="font-family:Cinzel">${esc(w ? w.n : '')}</h2><p>${v.win === me ? 'És a Lenda da Ilha Nova!' : 'é a Lenda da Ilha Nova.'}</p><p class="muted">Tiveste ${E.vpTotal(v, me)} pontos.</p></div>`; }
      if (v.step === 'disc' && v.dq[me]) { h = '🗑️ O Corsário chegou'; p = `Tens demasiadas cartas: escolhe ${v.dq[me]} para deitar fora.`; }

          case 'setR': h = '🛤️ Traça a estrada'; p = 'Toca numa das estradas que saem da aldeia que acabaste de fundar.'; break;
          case 'roll': h = v.rl ? '🎲 Os dados rolam na TV…' : '🎲 A tua vez!'; p = v.rl ? 'Olha para a TV.' : 'Lança os dados para ver que terras produzem.'; if (!v.rl) btn = `<button class="btn big gold" data-act="roll">🎲 Lançar dados</button>${P.d[0] && !v.dp ? `<button class="btn big ghost" data-play="0" style="margin-top:8px">🛡️ Jogar Cavaleiro antes</button>` : ''}`; break;
          case 'rob': h = '🏴‍☠️ Move o Corsário'; p = 'Toca no terreno onde o queres pôr. Esse terreno deixa de produzir e podes roubar 1 carta a quem lá viver.'; btn = `<button class="linkbtn" data-rule="corsario">📖 Como funciona o Corsário</button>`; break;
          case 'steal': h = '🏴‍☠️ A quem roubas?'; p = 'Escolhe um vizinho do Corsário.'; break;
          case 'rb': h = `🛤️ ${v.free} estrada(s) grátis`; p = 'Toca nas estradas no mapa.'; btn = `<button class="btn ghost" data-act="skiprb">Não quero mais</button>`; break;
          case 'main': h = '⚒️ Constrói e negoceia'; p = `Saiu ${v.dice[0] + v.dice[1]}. Constrói, troca no Mercado ou joga uma carta. Quando acabares, termina o turno.`; btn = `<button class="btn big" data-act="end">⏭️ Terminar turno</button>`; break;
        }

      }
      return `<div class="status ${mine || (v.step === 'sb' && v.sbq.includes(me)) || v.dq[me] ? 'mine' : ''}" style="--c:${E.PCOL[cur.c]}"><h3>${h}</h3><p>${p}</p>${btn}</div>`;
    }
    function miniHand(P, label) { return `<div class="minihand"><span>${label || 'Tens'}:</span>${P.h.map((n, i) => `<b class="${n ? '' : 'z'}">${E.RE[i]}${n}</b>`).join('')}</div>`; }
    function handHTML(P) { return `<div class="hand">${P.h.map((n, i) => `<div class="rc ${n ? '' : 'zero'}" style="background:${E.RC[i]}"><div class="e">${E.RE[i]}</div><div class="n">${E.RN[i]}</div><div class="c">${n}</div></div>`).join('')}</div>`; }

      return `<div class="builds">${b.map(([k, n, cost, s]) => { const why = E.whyNot(v, me, k); const ok = !why; return `<button class="bb ${ok ? 'ok' : ''}" data-build="${k}" ${ok ? '' : 'disabled'}><b>${n}</b><span class="rec">${recipe(cost)}</span><small>${s}</small>${why ? `<i class="why">${esc(why)}</i>` : ''}</button>`; }).join('')}</div><button class="linkbtn" data-rule="construir">📖 Porque é que não posso construir?</button>`;
    }
    function incomeHTML(v, me) {

    function diaryHTML(v, me) {

    function sheet(v, me) {

      const k = st.sel[0], id = +st.sel.slice(1); const B = E.board(v.seed, v.big);

      if (k === 'v') { const names = B.V[id].h.map(h => `${E.RE[B.hex[h].t] || '🌋'} ${B.hex[h].name}${B.hex[h].n ? ' (' + B.hex[h].n + ')' : ''}`).join(', '); const city = st.mode === 'city'; t = `${city ? '🏰 Fazer cidade aqui?' : '🏠 Fundar aldeia aqui?'}<br><small class="muted">${names}${B.V[id].port >= 0 ? ' · ⚓ porto ' + (B.ports[B.V[id].port].r === 5 ? '3:1' : '2:1 ' + E.RE[B.ports[B.V[id].port].r]) : ''}</small>`; a = { a: 'build', k: city ? 'city' : 'set', at: id }; }

    root.addEventListener('toggle', e => { const d = e.target; if (!d.id || !d.id.startsWith('r-') || !root.contains(d)) return; const id = d.id.slice(2); st.openRules = (st.openRules || []).filter(x => x !== id); if (d.open) st.openRules.push(id); }, true);

  // ---------- narrativa do diário ----------
  const MORNING = [
    ['O machado já está afiado. Hoje o pinhal vai ouvir-me.', 'Cheira a resina logo de manhã. Bom sinal.'],
    ['O forno ainda está morno de ontem. Vou ao barreiro.', 'As mãos sujas de barro são as mãos de quem constrói.'],

    ['Desci à mina antes do sol. Lá em baixo é sempre noite.', 'A picareta pesa menos quando há pedra boa.'],
    ['Abri a banca cedo: quem compra primeiro paga melhor.', 'Hoje alguém vai precisar do que eu tenho.'],
    ['Do cais vejo velas no horizonte. Talvez tragam negócio.', 'O mar está calmo. Bom dia para ir ao porto.'],

  function narrate(v, e, me) {
    const t = e[0], P = v.P, nm = i => P[i] ? P[i].n : '?';
    const B = E.board(v.seed, v.big);
    switch (t) {
      case 'start': return 'Desembarquei na Ilha Nova com pouco mais do que a roupa do corpo. Tenho de escolher bem onde assentar.';
      case 'day': { const L = MORNING[P[me].o] || MORNING[0]; return L[e[2] % L.length]; }
      case 'b': {
        const [, , p, k, at] = e;
        if (p === me) { if (k === 'set') { const h = B.V[at].h.map(i => B.hex[i].name).join(', '); return `Fundei uma aldeia junto a ${h}.`; } if (k === 'city') return 'A minha aldeia cresceu: agora é uma cidade, com torre e bandeira.'; if (k === 'road') return 'Abri mais um troço de estrada. A ilha fica mais pequena.'; }
        if (k === 'city') return `${nm(p)} transformou uma aldeia em cidade. Começa a mandar nesta ilha.`;
        if (k === 'set' && B.V[at].n.some(w => v.vb[w] !== '.' && v.vb[w].toLowerCase().charCodeAt(0) - 97 === me)) return `${nm(p)} veio instalar-se mesmo ao meu lado.`;
        return null;
      }
      case 'p': { const mine = e[2].filter(x => x[0] === me); if (!mine.length) return null; return 'Colheita: ' + mine.map(([, r, n, hx]) => `${n} ${E.RN[r].toLowerCase()} de ${B.hex[hx].name}`).join(', ') + '.'; }
      case 'd': if (e[3] + e[4] === 7) return e[2] === me ? 'Lancei os dados e saiu 7. O Corsário desembarcou por minha conta.' : `${nm(e[2])} lançou um 7. O Corsário anda à solta.`; return null;
      case 'r': { const h = B.hex[e[3]]; const mineHere = h.v.some(w => v.vb[w] !== '.' && v.vb[w].toLowerCase().charCodeAt(0) - 97 === me); if (e[2] === me) return `Mandei o Corsário para ${h.name}.`; if (mineHere) return `O Corsário instalou-se em ${h.name}, mesmo à minha porta. Essa terra não me dá nada enquanto ele lá estiver.`; return null; }
      case 's': if (e[2] === me) return `Roubei 1 ${E.RN[e[4]].toLowerCase()} a ${nm(e[3])}.`; if (e[3] === me) return `${nm(e[2])} assaltou o meu armazém e levou 1 ${E.RN[e[4]].toLowerCase()}.`; return null;
      case 'x': return e[2] === me ? `Tive de deitar fora ${e[3]} cartas antes que o Corsário as levasse.` : null;
      case 'buy': return e[2] === me ? 'Comprei uma carta de progresso. Vamos ver o que o futuro traz.' : null;
      case 'k': return e[2] === me ? 'Chamei um cavaleiro. Montou guarda junto às minhas terras.' : `${nm(e[2])} chamou um cavaleiro.`;
      case 'yp': return e[2] === me ? `Ano de fartura! Recebi ${E.RN[e[3]].toLowerCase()} e ${E.RN[e[4]].toLowerCase()}.` : null;
      case 'mo': return e[2] === me ? `Monopólio: fiquei com toda a ${E.RN[e[3]].toLowerCase()} da ilha (${e[4]} cartas).` : `${nm(e[2])} decretou monopólio da ${E.RN[e[3]].toLowerCase()}. ${v.P[me] ? 'Fiquei sem a minha.' : ''}`;
      case 't': if (e[2] === me || e[3] === me) { const o = e[2] === me ? e[3] : e[2]; const give = e[2] === me ? e[4] : e[5], get = e[2] === me ? e[5] : e[4]; return `Fiz negócio com ${nm(o)}: dei ${E.fmtRes(give)} e recebi ${E.fmtRes(get)}.`; } return null;
      case 'bk': return e[2] === me ? `Troquei ${e[4]} ${E.RN[e[3]].toLowerCase()} por 1 ${E.RN[e[5]].toLowerCase()} no porto.` : null;
      case 'lr': return e[2] === me ? 'A minha estrada é a mais longa da ilha. Chamam-lhe Estrada Real.' : e[2] >= 0 ? `${nm(e[2])} tem agora a Estrada Real.` : null;
      case 'la': return e[2] === me ? 'Lidero a Ordem dos Cavaleiros. Ninguém se mete comigo.' : `${nm(e[2])} lidera agora a Ordem dos Cavaleiros.`;
      case 'w': return e[2] === me ? 'Consegui. Já me chamam a Lenda da Ilha Nova.' : `${nm(e[2])} tornou-se a Lenda da Ilha Nova.`;
    }
    return null;
  }

  // ======================================================================
  // TELEMÓVEL
  // ======================================================================
  let padV = null, pad = null, cid = null, me = -1, padCode = '', join = null, tvSeen = -1, lastTvAt = 0, lastRejoin = 0, seq = 0, lastCmd = null, claim = null;
  function startPad() {
    mode = 'pad'; $('#start').classList.remove('show'); $('#padroot').classList.add('show');
    try { cid = sessionStorage.getItem('ilha-cid'); } catch (e) { } if (!cid) { cid = 'p' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('ilha-cid', cid); } catch (e) { } } { const prev = LS.get('ilha-cid-last'); if (prev && prev !== cid) LS.set('ilha-cid-last-prev', prev); } LS.set('ilha-cid-last', cid);
    const lastCode = LS.get('ilha-code') || '';
    $('#padroot').innerHTML = `<div class="join"><div class="logo">Ilha Nova</div><p class="center muted">O teu comando de colono</p>
      <label>Código da sala (está na TV)<input id="jcode" inputmode="numeric" maxlength="4" value="${esc(lastCode)}" placeholder="0000"></label>
      <button class="btn big gold" id="jconn">Ligar à TV</button><div id="jmsg" class="muted center"></div></div>`;
    $('#jconn').onclick = connectPad;
  }
  async function connectPad() {
    padCode = $('#jcode').value.trim(); if (!/^\d{4}$/.test(padCode)) { $('#jmsg').textContent = 'O código tem 4 números.'; return; }
    LS.set('ilha-code', padCode); $('#jmsg').textContent = 'A ligar…'; $('#jconn').disabled = true;
    const ok = await Net.connect(padCode);
    if (!ok) { $('#jmsg').textContent = 'Não foi possível ligar daqui. Abre o jogo dentro do claude.ai com a tua conta, ou joga no ecrã da TV.'; $('#jconn').disabled = false; return; }
    listen(); presence();
    setInterval(watchdog, 3000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { presence(); watchdog(); } });
    setTimeout(() => { if (!padV && $('#jmsg')) $('#jmsg').textContent = 'Não encontro a TV com o código ' + padCode + '. Confirma o código no ecrã.'; }, 9000);
  }
  function listen() {
    Net.r.onPeers(ch => {
      const tv = (ch.peers || []).find(p => p.presence && p.presence.role === 'tv' && p.presence.code === padCode && p.presence.st);
      if (!tv) { if (!padV && $('#jmsg')) $('#jmsg').textContent = 'Ligado. À espera da TV com o código ' + padCode + '…'; return; }
      lastTvAt = Date.now(); connBar(false);
      const stt = tv.presence.st; if (stt.v === tvSeen && padV) return; tvSeen = stt.v;
      onState(stt);
    });
  }
  async function watchdog() {
    if (!padV || document.hidden) return;
    const stale = Date.now() - lastTvAt > 10000; connBar(stale);
    if (stale && Date.now() - lastRejoin > 12000) { lastRejoin = Date.now(); await Net.rejoin(padCode); listen(); presence(); }
  }
  function connBar(on) { let b = $('#connbar'); if (!b) { b = document.createElement('div'); b.id = 'connbar'; b.innerHTML = '📡 Sem sinal da TV — a religar… <button id="rl">Recarregar</button>'; document.body.appendChild(b); $('#rl').onclick = () => location.reload(); } b.classList.toggle('show', !!on && mode === 'pad'); }
  function presence() { if (!Net.ok) return; const o = { role: 'pad', code: padCode, cid, join: join || null, cmd: lastCmd || null, claim: claim === null ? null : claim }; Net.r.presence(o).catch(() => { }); }
  function padSend(c) { seq = Math.max(Date.now() % 1e10, seq + 1); lastCmd = Object.assign({ n: seq }, c); presence(); }
  function onState(stt) {
    padV = stt;
    if (stt.ph === 'lobby') { me = -1; renderJoin(stt); return; }
    me = stt.P.findIndex(p => p.id === cid);
    if (me < 0) { renderReclaim(stt); return; }
    if (claim !== null) { claim = null; presence(); }
    if (!pad) { $('#padroot').innerHTML = '<div id="padwrap" style="position:absolute;inset:0"></div>'; pad = makePad($('#padwrap'), { getV: () => padV, me: () => me, send: padSend, local: false }); }
    pad.render();
  }
  function renderReclaim(V) {
    pad = null;
    $('#padroot').innerHTML = `<div class="join"><div class="logo">Ilha Nova</div><h2>A partida já começou</h2><p>Se saíste a meio, escolhe quem és para retomar o teu lugar:</p>
      ${V.P.map((p, k) => `<button class="btn big ghost reclaim" data-k="${k}" ${String(p.id).startsWith('bot') ? 'disabled' : ''}><span class="dot" style="background:${E.PCOL[p.c]}"></span> ${E.OFI[p.o].e} ${esc(p.n)}${p.id === LS.get('ilha-cid-last-prev') ? ' — és tu?' : ''}</button>`).join('')}
      <p class="muted">${claim !== null ? 'A pedir à TV…' : 'Só podes retomar o lugar de alguém cujo comando esteja desligado.'}</p></div>`;
    $('#padroot').onclick = e => { const b = e.target.closest('.reclaim'); if (!b || b.disabled) return; claim = +b.dataset.k; presence(); renderReclaim(V); };
  }
  function renderJoin(V) {
    pad = null; $('#padroot').onclick = null;
    const meP = V.P.find(p => p.id === cid);
    const taken = V.P.filter(p => p.id !== cid).map(p => p.c);
    const cur = join || (meP ? { n: meP.n, c: meP.c, o: meP.o } : { n: LS.get('ilha-name') || '', c: [0, 1, 2, 3, 4, 5].find(c => !taken.includes(c)) ?? 0, o: +(LS.get('ilha-ofi') || 0) });
    const nameNow = $('#jname') ? $('#jname').value : cur.n;
    $('#padroot').innerHTML = `<div class="join"><div class="logo">Ilha Nova</div><div class="muted center">Sala ${esc(padCode)} · ${V.P.length}/${E.MAXP} colonos</div>
      <label>O teu nome<input id="jname" maxlength="14" value="${esc(nameNow)}" placeholder="Nome"></label>
      <div><b>A tua cor</b><div class="picks" id="jc" style="margin-top:6px">${E.PCOL.map((c, k) => `<button class="pick ${k === cur.c ? 'on' : ''}" data-c="${k}" ${taken.includes(k) ? 'disabled' : ''}><i class="sw" style="background:${c}"></i>${E.PCOLN[k]}</button>`).join('')}</div></div>
      <div><b>O teu ofício na ilha</b><div class="picks c4" id="jo" style="margin-top:6px">${E.OFI.map((f, k) => `<button class="pick ${k === cur.o ? 'on' : ''}" data-o="${k}"><span>${f.e}</span>${f.n}</button>`).join('')}</div></div>
      <button class="btn big good" id="jgo">${meP ? 'Atualizar' : 'Entrar na ilha'}</button><details class="card"><summary><b>📖 Regras do jogo</b></summary>${RULES.html()}</details>
      ${meP ? `<div class="card center"><div style="font-size:40px">${E.OFI[meP.o].e}</div><b>Estás dentro, ${esc(meP.n)}!</b><p class="muted">Espera que a TV dê ordem de zarpar.</p></div>` : (join ? '<p class="muted center">A entrar… (se não entrares, escolhe outra cor)</p>' : '')}
      <div>${V.P.map(p => `<span class="chip"><span class="dot" style="background:${E.PCOL[p.c]}"></span>${E.OFI[p.o].e} ${esc(p.n)}</span>`).join('')}</div></div>`;
    $('#jc').onclick = e => { const b = e.target.closest('[data-c]'); if (!b || b.disabled) return; $('#jc .on') && $('#jc .on').classList.remove('on'); b.classList.add('on'); };
    $('#jo').onclick = e => { const b = e.target.closest('[data-o]'); if (!b) return; $('#jo .on') && $('#jo .on').classList.remove('on'); b.classList.add('on'); };
    $('#jgo').onclick = () => { const n = clean($('#jname').value).slice(0, 14) || 'Colono'; const c = +(($('#jc .on') || { dataset: { c: 0 } }).dataset.c); const o = +(($('#jo .on') || { dataset: { o: 0 } }).dataset.o); LS.set('ilha-name', n); LS.set('ilha-ofi', o); join = { n, c, o }; presence(); renderJoin(V); };
  }

  return { start, _test: { get S() { return S; }, enqueue, snap, mapSVG } };
})();
addEventListener('DOMContentLoaded', () => UI.start());
</script>
