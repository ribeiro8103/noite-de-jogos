<!DOCTYPE html>
<html lang="pt-PT">
<head>
<script src="../../rede.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>O Cofre de São Segredo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5efe2;--ink2:#c9c0ad;--mute:#8d8676;--bg:#13161c;--bg2:#1c2028;--bg3:#262b35;--line:#353b47;--gold:#e7b04a;--gold2:#f6d58c;--red:#e5484d;--green:#3fb07f;--blue:#4f8fe0;--r:14px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:.2px}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg3);border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;min-height:48px;transition:transform .08s,background .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:linear-gradient(180deg,#f0bd5a,#d99a2b);color:#1c1406;border-color:#f6d58c}
.btn.ghost{background:transparent}.btn.danger{background:#5b1f22;border-color:#8a2c31}.btn.green{background:#1d5a43;border-color:#2c8a63}
.btn.big{width:100%;min-height:64px;font-size:18px;flex-direction:column;gap:2px}.btn.big small{font-weight:600;font-size:13px;opacity:.75}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
input,textarea,select{width:100%;background:#0f1217;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font:inherit;font-size:16px}
textarea{resize:vertical}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.muted{color:var(--ink2)}.small{font-size:13px}.center{text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--bg3);color:var(--ink2)}
.tag.gold{background:#4a3814;color:var(--gold2)}
/* ecrãs de menu */
#screen{position:fixed;inset:0;overflow:auto;z-index:30;background:radial-gradient(1200px 600px at 50% -10%,#2a3242 0%,var(--bg) 60%)}
.wrap{max-width:760px;margin:0 auto;padding:calc(20px + var(--safe-t)) 18px calc(110px + var(--safe-b))}
.logo{text-align:center;margin:28px 0 22px}.logo .vault{font-size:64px}.logo h1{font-size:44px;line-height:1.02;margin:8px 0}.logo p{color:var(--ink2);max-width:520px;margin:10px auto}
.logo .ed{font-family:'Fraunces',serif;color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-size:13px}
.stack{display:grid;gap:12px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}.head h2{margin:0;font-size:26px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:10px;cursor:pointer;font-weight:700}.seg button.on{border-color:var(--gold);background:#3a2e14;color:var(--gold2)}.seg small{display:block;font-weight:600;opacity:.7}
.pform{display:grid;grid-template-columns:14px 1fr;gap:10px;margin:10px 0;align-items:start}.pform .dot{width:14px;height:14px;border-radius:50%;margin-top:14px}
.pform input{margin-bottom:6px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + var(--safe-b));background:linear-gradient(0deg,var(--bg) 70%,transparent);z-index:31}
.sticky .btn{max-width:724px;margin:0 auto;display:flex}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.role{background:var(--bg2);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:14px}
.role .top{display:flex;gap:12px;align-items:center}.role .emo{font-size:40px}.role .rn{font-family:'Fraunces',serif;font-size:20px;font-weight:700}.role .rt{color:var(--ink2);font-size:14px}
.role .bio{margin:10px 0;font-size:14px;color:var(--ink2)}.role .pw{background:#2b2414;border-radius:10px;padding:10px;font-size:14px;margin-top:8px}
.role .motto{font-style:italic;color:var(--gold2);font-size:14px;margin-top:4px}
.spin{display:inline-block;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.game-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid var(--line);background:var(--bg3);border-radius:10px;margin:6px 0;cursor:pointer;text-align:left}
.join-row{display:flex;gap:8px;margin-top:10px}.join-row input{text-transform:uppercase;letter-spacing:4px;font-weight:800}
/* ---------------------------------------------------------- TV */
#tv{position:fixed;inset:0}#tv canvas{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-size:clamp(12px,1.05vw,20px)}
#hud .tl{position:absolute;left:1.4vw;top:1.4vw;display:flex;gap:1vw;align-items:center}
.chip{background:rgba(16,19,25,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:.5em 1em;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.chip.code{letter-spacing:.25em;color:var(--gold2)}
#hud .players{position:absolute;left:1.4vw;top:5.2vw;width:21vw;display:grid;gap:.6vw}
.pc{background:rgba(16,19,25,.84);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-left:.4em solid var(--c);border-radius:.8em;padding:.6em .8em;display:grid;grid-template-columns:2.2em 1fr auto;gap:.6em;align-items:center;transition:all .5s}
.pc.cur{transform:translateX(.8vw);box-shadow:0 0 0 2px var(--c),0 10px 30px rgba(0,0,0,.4)}.pc.out{opacity:.4;filter:grayscale(1)}
.pc .e{font-size:1.8em;text-align:center}.pc .n{font-weight:800}.pc .s{font-size:.82em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .m{font-weight:800;color:var(--gold2);text-align:right}.pc .m small{display:block;color:var(--ink2);font-weight:600;font-size:.75em}
#hud .logbox{position:absolute;right:1.4vw;top:1.4vw;width:23vw;max-height:46vh;overflow:hidden;background:rgba(16,19,25,.8);backdrop-filter:blur(6px);border-radius:.9em;border:1px solid rgba(255,255,255,.08);padding:.8em 1em}
.logbox h4{margin:0 0 .4em;font-family:'Fraunces',serif;font-size:1.05em;color:var(--gold2)}
.logbox .l{font-size:.86em;padding:.32em 0;border-top:1px solid rgba(255,255,255,.06);color:var(--ink2)}.logbox .l:first-of-type{border-top:0}
.logbox .l.jornal{color:#cfe3ff}.logbox .l.win{color:var(--gold2)}.logbox .l.block{color:#ffb1b1}
#hud .turn{position:absolute;left:50%;bottom:2vw;transform:translateX(-50%);text-align:center;background:rgba(16,19,25,.88);border-radius:1.2em;padding:.7em 1.8em;border:1px solid rgba(255,255,255,.1);min-width:28vw}
#hud .turn .who{font-family:'Fraunces',serif;font-size:1.7em;font-weight:800}#hud .turn .what{color:var(--ink2);font-size:.95em}
#hud .ctrl{position:absolute;right:1.4vw;bottom:1.4vw;pointer-events:auto;display:flex;gap:.5vw}
#hud .ctrl button{background:rgba(16,19,25,.8);border:1px solid var(--line);border-radius:10px;padding:.5em .8em;cursor:pointer;font-weight:700}
/* cut-scene */
#cut{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .7s}
#cut.on{opacity:1}
body.cutting #hud{opacity:0;transition:opacity .6s}#hud{transition:opacity .6s}
#cut .bar{position:absolute;left:0;right:0;height:10vh;background:#05070a;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#cut .bar.t{top:0;transform:translateY(-100%)}#cut .bar.b{bottom:0;transform:translateY(100%)}
#cut.on .bar{transform:none}
#cut .box{position:absolute;left:0;right:0;bottom:12vh;text-align:center;padding:0 8vw}
#cut .kicker{font-size:clamp(14px,1.3vw,24px);letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:800;opacity:0;transform:translateY(10px);transition:all .8s .3s}
#cut .title{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(34px,4.6vw,92px);line-height:1.02;text-shadow:0 4px 30px rgba(0,0,0,.6);opacity:0;transform:translateY(20px) scale(.98);transition:all .9s .45s}
#cut .sub{font-size:clamp(16px,1.6vw,30px);max-width:62vw;margin:.6em auto 0;color:#efe8d8;text-shadow:0 2px 14px rgba(0,0,0,.8);opacity:0;transition:all .9s .9s;background:rgba(5,7,10,.55);padding:.4em .9em;border-radius:.6em;display:inline-block}
#cut .actors{display:flex;gap:1.2vw;justify-content:center;margin-bottom:1vw;opacity:0;transition:opacity .8s .2s}
#cut .actor{display:flex;align-items:center;gap:.5em;background:rgba(5,7,10,.7);border:2px solid var(--c);border-radius:999px;padding:.35em 1em .35em .4em;font-weight:800;font-size:clamp(14px,1.3vw,26px)}
#cut .actor .e{width:1.8em;height:1.8em;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:1.1em}
#cut .vs{font-size:clamp(18px,1.6vw,30px);color:var(--gold);font-weight:800;align-self:center}
#cut.on .kicker,#cut.on .title,#cut.on .sub,#cut.on .actors{opacity:1;transform:none}
#cut .lines{list-style:none;padding:0;margin:.7em auto 0;max-width:60vw;text-align:left;font-size:clamp(14px,1.35vw,26px);opacity:0;transition:opacity .9s .8s}
#cut.on .lines{opacity:1}#cut .lines li{padding:.3em .6em;background:rgba(5,7,10,.55);border-radius:.4em;margin:.3em 0}
#cut .timer{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:0}
#dice{position:fixed;inset:0;z-index:9;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .4s}
#dice.on{opacity:1}#dice .d{width:22vh;height:22vh;border-radius:3vh;background:linear-gradient(145deg,#fffdf6,#e2dccb);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 -8px 0 rgba(0,0,0,.08);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:800;font-size:14vh;color:#1a1a1a}
#dice.roll .d{animation:roll .18s linear infinite}@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(20deg) scale(.92)}100%{transform:rotate(0) scale(1)}}
#dice .who{position:absolute;top:22vh;font-size:3vh;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.toast-wrap{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,520px)}
.toast{background:#22303e;border:1px solid #37506a;border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .5s}
.toast.err{background:#4b1d20;border-color:#7c2a30}.toast.out{opacity:0}

/* jornal */
#news{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:rgba(5,7,10,.72);opacity:0;pointer-events:none;transition:opacity .6s}
#news.on{opacity:1}
.paper{background:#f2ead6;color:#1f1a12;font-family:'Fraunces',Georgia,serif;box-shadow:0 30px 90px rgba(0,0,0,.6);background-image:radial-gradient(circle at 30% 20%,rgba(255,255,255,.5),transparent 60%),repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 2px,transparent 2px 4px)}
#news .paper{width:min(78vw,1300px);padding:2.4vw 3vw;transform:rotate(-14deg) scale(.2);transition:transform 1.1s cubic-bezier(.2,1.4,.4,1);font-size:clamp(12px,1vw,20px)}
#news.on .paper{transform:rotate(-1.5deg) scale(1)}
.paper .mast{display:flex;justify-content:space-between;align-items:center;border-bottom:4px double #1f1a12;padding-bottom:.4em;gap:1em}
.paper .mast h1{font-size:4.6em;margin:0;font-weight:800;letter-spacing:.02em;font-style:italic}.paper .mast span{font-family:'Nunito Sans';font-weight:800;font-size:.9em;text-transform:uppercase;letter-spacing:.1em}
.paper .sub-mast{text-align:center;font-family:'Nunito Sans';font-size:.85em;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid #1f1a12;padding:.4em 0;margin-bottom:.8em}
.paper .kick{display:inline-block;background:#a3231d;color:#fff;font-family:'Nunito Sans';font-weight:900;letter-spacing:.2em;padding:.2em .7em;font-size:1em}
.paper .head{font-size:3.1em;font-weight:800;line-height:1.08;margin:.3em 0 .5em}
.paper .cols{display:grid;grid-template-columns:1fr 14em 1fr;gap:1.6em;border-top:1px solid #1f1a12;padding-top:.8em;font-size:.95em}.paper .cols p{font-family:Georgia,serif;line-height:1.45;margin:.4em 0 0;color:#3b3224}
.paper .pic{border:1px solid #1f1a12;display:grid;place-items:center;font-size:4.5em;padding:.2em;text-align:center}.paper .pic small{display:block;font-size:.17em;font-family:'Nunito Sans'}
.paper .acks{margin-top:1em;border-top:4px double #1f1a12;padding-top:.7em;font-family:'Nunito Sans';font-weight:800;display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.paper .ack{border:2px solid var(--c);border-radius:999px;padding:.15em .8em;opacity:.55}.paper .ack.ok{opacity:1;background:var(--c);color:#fff}
.paper.sm{padding:16px;border-radius:6px;margin-top:10px}.paper.sm .mast{justify-content:center}.paper.sm .mast h1{font-size:30px}.paper.sm .head{font-size:24px}
.gate{position:fixed;inset:0;z-index:46;background:rgba(10,12,16,.96);overflow:auto;padding:calc(20px + var(--safe-t)) 16px calc(110px + var(--safe-b))}
/* desafio na TV */
#chalTV{position:fixed;left:50%;top:13vh;transform:translate(-50%,-20px);z-index:7;width:min(50vw,980px);background:rgba(16,19,25,.93);border:2px solid var(--gold);border-radius:1.2em;padding:1.4em 2em;text-align:center;font-size:clamp(13px,1.2vw,24px);opacity:0;pointer-events:none;transition:all .6s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#chalTV.on{opacity:1;transform:translate(-50%,0)}body.cutting #chalTV{opacity:0}body.chal #hud .turn{opacity:0}
#chalTV .ck{color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:.8em}#chalTV .ct{font-family:'Fraunces',serif;font-weight:800;font-size:2.4em;margin:.1em 0}
#chalTV .cq{font-family:'Fraunces',serif;font-size:1.6em;margin:.5em 0}#chalTV .cs{color:var(--ink2);margin:.4em 0}#chalTV .crow{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;margin-top:.7em}
#chalTV .copts{display:grid;grid-template-columns:1fr 1fr;gap:.5em;text-align:left;max-width:80%;margin:0 auto}#chalTV .copts div{background:var(--bg3);border-radius:.5em;padding:.4em .8em}
#chalTV .actor{display:inline-flex;align-items:center;gap:.5em;background:rgba(5,7,10,.7);border:2px solid var(--c);border-radius:999px;padding:.3em 1em .3em .4em;font-weight:800}#chalTV .actor .e{width:1.7em;height:1.7em;border-radius:50%;background:var(--c);display:grid;place-items:center}
#chalTV .vs{font-weight:900;color:var(--gold);align-self:center;font-size:1.4em}
/* carta mistério na cut-scene */
#cut .mcard{width:clamp(90px,8vw,160px);aspect-ratio:2/3;margin:0 auto 1vw;border-radius:.8vw;display:grid;place-items:center;align-content:center;background:linear-gradient(160deg,#2a2f3a,#14171d);border:4px solid var(--gold);box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotateY(180deg) scale(.6);opacity:0;transition:all 1s .2s}
#cut.on .mcard{transform:none;opacity:1}#cut .mcard.good{border-color:#4fd18b}#cut .mcard.bad{border-color:#ff5d5d}
#cut .mcard .mi{font-size:clamp(40px,4vw,80px)}#cut .mcard .ml{font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(11px,.9vw,16px)}
/* ---------------------------------------------------------- TELEMÓVEL */
#phone{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.ph-top{padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg2)}
.ph-top .me{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.ph-top .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--c);flex:none}
.ph-top .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph-top .rl{font-size:12px;color:var(--ink2)}
.ph-top .money{font-weight:800;color:var(--gold2);background:#2b2414;border-radius:999px;padding:6px 12px;white-space:nowrap}
.turnbar{padding:9px 14px;font-weight:800;text-align:center;font-size:15px;background:#1a2230;color:var(--ink2)}
.turnbar.mine{background:linear-gradient(90deg,#6b4b12,#a8761f,#6b4b12);color:#fff7e3;animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{filter:brightness(1.15)}}
.ph-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.ph-pad{padding:12px 14px 20px}
.actions{border-top:1px solid var(--line);background:var(--bg2);padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:44vh;overflow:auto}
.actions .full{grid-column:1/-1}.actions .hint{grid-column:1/-1;font-size:13px;color:var(--ink2);text-align:center;padding:2px 0}
.actions .btn{min-height:52px;font-size:15px;padding:8px 10px;text-align:center}
.actions .btn .p{font-size:12px;opacity:.75;font-weight:700;display:block}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#0f1217;padding-bottom:var(--safe-b)}
.nav button{background:none;border:0;padding:9px 0 8px;font-size:12px;font-weight:800;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .i{font-size:21px}.nav button.on{color:var(--gold2)}
.nav button .badge{background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;margin-left:2px}
/* mapa 2D */
.map-wrap{position:relative;height:100%;min-height:300px;touch-action:none;background:#8fb36b;overflow:hidden}
.map-wrap svg{width:100%;height:100%;display:block}
.map-zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2}.map-zoom button{width:42px;height:42px;border-radius:10px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.9);color:#222;font-size:22px;font-weight:800}
.map-legend{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(16,19,25,.86);border-radius:12px;padding:10px 12px;font-size:13px;z-index:2}
.map-legend b{color:var(--gold2)}
.reach-ring{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
/* pistas */
.filters{display:flex;gap:6px;overflow:auto;padding-bottom:6px;margin-bottom:6px}.filters button{flex:none;border:1px solid var(--line);background:var(--bg3);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}.filters button.on{background:#3a2e14;border-color:var(--gold);color:var(--gold2)}
.clue{background:#f3ead6;color:#2a2318;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 #c9b98f;position:relative}
.clue .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#7d6a45;margin-bottom:5px}
.clue .t{font-family:'Fraunces',serif;font-size:17px;line-height:1.3}
.clue.pick{cursor:pointer;outline:3px solid transparent}.clue.pick.sel{outline-color:var(--gold);box-shadow:0 0 0 6px rgba(231,176,74,.3)}
.clue .mine{color:#9a3b1a}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
/* caderno */
.nb h3{margin:16px 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}.nb h3 small{font-family:'Nunito Sans';font-size:12px;color:var(--mute)}
.nb .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg2);margin:5px 0;border:1px solid var(--line)}
.nb .row .nm{font-weight:800}.nb .row .tr{font-size:12px;color:var(--ink2)}
.nb .row.x{opacity:.45}.nb .row.x .nm{text-decoration:line-through}.nb .row.v{border-color:var(--green);background:#16352a}.nb .row.q{border-color:var(--gold)}
.tri{display:flex;gap:4px}.tri button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);font-weight:900;font-size:16px;cursor:pointer}
.tri button.on.x{background:#5b1f22;border-color:#a33}.tri button.on.v{background:#1d5a43;border-color:#2c8a63}.tri button.on.q{background:#4a3814;border-color:var(--gold)}
/* folhas (bottom sheets) */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.open{opacity:1;pointer-events:auto}
#sheet .sh{width:100%;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--safe-b));transform:translateY(30px);transition:transform .25s;border-top:1px solid var(--line)}
#sheet.open .sh{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
#sheet h3{margin:4px 0 10px;font-size:22px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{border:1px solid var(--line);background:var(--bg3);border-radius:12px;padding:12px;cursor:pointer;font-weight:800;text-align:left}.opt small{display:block;color:var(--ink2);font-weight:600;font-size:12px;margin-top:2px}
.opt.sel{border-color:var(--gold);background:#3a2e14}
.theory{display:grid;gap:12px}.theory .cat h4{margin:0 0 6px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--gold2)}
.theory .chips{display:flex;flex-wrap:wrap;gap:6px}.theory .chips button{border:1px solid var(--line);background:var(--bg3);border-radius:999px;padding:8px 11px;font-weight:700;font-size:14px;cursor:pointer}
.theory .chips button.on{background:var(--gold);color:#1c1406;border-color:var(--gold2)}.theory .chips button.x{opacity:.4;text-decoration:line-through}
.ask{position:fixed;inset:0;z-index:45;background:rgba(10,12,16,.96);overflow:auto;padding:calc(20px + var(--safe-t)) 16px calc(100px + var(--safe-b))}
.ask h2{font-size:26px;margin:6px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:var(--bg3);font-weight:800;font-size:13px}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block}
.me-card{border-left:6px solid var(--c)}
.biz{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;background:var(--bg3);border-radius:10px;margin:6px 0}
details{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}summary{font-weight:800;cursor:pointer}
details p,details li{color:var(--ink2);font-size:14px}
.seat{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);margin:8px 0;cursor:pointer;text-align:left}
.seat .e{font-size:30px}.seat.taken{opacity:.5}
.lobby-code{font-family:'Fraunces',serif;font-size:72px;letter-spacing:12px;color:var(--gold2);text-align:center;margin:6px 0}
