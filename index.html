<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Noite de Jogos</title>
<meta name="theme-color" content="#07100c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="rede.js"></script>
<style>
:root{--bg:#07100c;--gold:#d8b25a;--gold2:#f3d68c;--cream:#f3ead6;--muted:#9fb3a7;--line:rgba(216,178,90,.28);--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1b3a2b 0%,#0d1f17 45%,var(--bg) 100%) fixed;color:var(--cream);font-family:Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:repeating-linear-gradient(45deg,rgba(216,178,90,.05) 0 2px,transparent 2px 18px),repeating-linear-gradient(-45deg,rgba(216,178,90,.04) 0 2px,transparent 2px 18px)}
button,input{font:inherit;color:inherit}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.logo{font-family:var(--serif);text-align:center;color:var(--gold);letter-spacing:.28em;text-transform:uppercase;font-size:clamp(34px,7vw,64px);line-height:1}
.logo small{display:block;font-size:.25em;letter-spacing:.45em;color:var(--muted);margin-top:.9em}
.lead{text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.1em}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:18px 20px;border:0;border-radius:16px;background:linear-gradient(180deg,#e6c56f,#b8913c);color:#1a1206;font-weight:800;font-size:1.15em;box-shadow:0 6px 0 #6e5520,0 10px 24px rgba(0,0,0,.4);cursor:pointer;width:100%}
.btn small{font-weight:500;font-size:.68em;opacity:.8}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:active{transform:translateY(3px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px;margin:0 auto;width:100%}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(18,41,31,.92),rgba(9,22,16,.95));border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.games{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.games{grid-template-columns:1fr}}
.game{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(180deg,rgba(18,41,31,.92),rgba(9,22,16,.95));transition:transform .15s, box-shadow .15s;position:relative;overflow:hidden}
.game:hover,.game:focus{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 2px var(--gold);outline:none}
.game .ic{font-size:52px;line-height:1}
.game h2{font-family:var(--serif);font-weight:600;font-size:1.45em;line-height:1.15}
.game p{color:var(--muted);font-size:.95em;line-height:1.4}
.game .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.game .meta span{font-size:.78em;padding:4px 9px;border-radius:99px;background:rgba(216,178,90,.15);color:var(--gold2)}
.game::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.18;filter:blur(8px)}
.join{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media(max-width:760px){.join{grid-template-columns:1fr;text-align:center}}
.code{font-family:var(--serif);font-size:clamp(54px,9vw,96px);letter-spacing:.18em;color:var(--gold2);line-height:1}
#qr{background:#fff;padding:10px;border-radius:14px;display:inline-block;min-width:60px;min-height:60px}
.k{letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-size:.8em}
.inp{width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.3);font-size:2em;text-align:center;letter-spacing:.35em;text-transform:uppercase;outline:none}
.inp:focus{border-color:var(--gold)}
.center{text-align:center}
.muted{color:var(--muted)}
.wait{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 10px}
.wait .ic{font-size:64px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.status{font-size:.9em;color:var(--muted)}
.small{font-size:.85em}
.steps{line-height:1.8;color:var(--cream)}
a{color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
const GAMES = [
  { id:'clube', ic:'🎩', n:'O Clube', d:'Jogo de festa: roleta, apostas, provas malucas e contratos secretos para cumprir durante a noite.', meta:['3–10 jogadores','60–120 min','Edição Fátima'], c:'#d8b25a' },
  { id:'cova', ic:'🏘️', n:'Cova da Fortuna', d:'O Monopoly de Fátima: compra as ruas da terra, constrói casas e leva os amigos à falência.', meta:['2–8 jogadores','bots','Tabuleiro 3D'], c:'#4fa3d9' },
  { id:'ilha', ic:'⛵', n:'Ilha Nova', d:'Colonos, estradas, cidades e um corsário à espreita. Colhe, negoceia e constrói até seres a Lenda da Ilha.', meta:['3–6 jogadores','estilo Catan','90 min'], c:'#5cb85c' },
  { id:'cofre', ic:'🔐', n:'O Cofre de São Segredo', d:'Mistério na vila: quem matou o Comendador, onde, com quê e a que horas? Interroga, compra pistas e abre o cofre.', meta:['5 jogadores','mistério','2 h ou mais'], c:'#b07ad9' },
];
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = new URLSearchParams(location.search);
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newSala = () => Array.from({length:4}, ()=>ALPH[Math.random()*ALPH.length|0]).join('');
const base = location.href.split('?')[0].split('#')[0];
const app = $('#app');
const head = `<div class="logo">Noite de Jogos<small>os jogos da malta</small></div>`;

function home(){
  const pre = qs.get('jogo');
  app.innerHTML = `${head}<p class="lead">Um ecrã grande para o tabuleiro, e cada telemóvel serve de comando. Sem contas, sem instalar nada.</p>
    <div class="two"><button class="btn" id="tv">📺 Este ecrã é a TV<small>escolher o jogo e mostrar o QR</small></button>
    <button class="btn ghost" id="ph">📱 Sou jogador<small>entrar com o código da sala</small></button></div>
    <div class="games" style="margin-top:8px">${GAMES.map(g=>`<div class="game" style="--c:${g.c};cursor:default"><div class="ic">${g.ic}</div><h2>${esc(g.n)}</h2><p>${esc(g.d)}</p><div class="meta">${g.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div></div>`).join('')}</div>
    <p class="center muted small">Dica: a TV e os telemóveis funcionam melhor ligados à mesma rede Wi-Fi.</p>`;
  $('#tv').onclick = () => { const s = newSala(); location.href = `${base}?sala=${s}&tv=1&escolher=1${pre?'&jogo='+pre:''}`; };
  $('#ph').onclick = codeEntry;
}
function codeEntry(){
  app.innerHTML = `${head}<div class="card" style="max-width:460px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px">
    <div class="k center">Código da sala</div><input class="inp" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
    <button class="btn" id="go">Entrar</button><p class="center muted small">O código está na TV, ao lado do QR.</p><button class="btn ghost" id="back">Voltar</button></div>`;
  $('#code').focus();
  const go = () => { const v = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.length===4) location.href = `${base}?sala=${v}`; };
  $('#go').onclick = go; $('#code').onkeydown = e => { if(e.key==='Enter') go(); };
  $('#back').onclick = () => { location.href = base; };
}
function tvChooser(sala){
  const url = `${base}?sala=${sala}`;
  const pre = qs.get('jogo');
  app.innerHTML = `${head}
    <div class="card join"><div class="center"><div id="qr"></div></div>
      <div><div class="k">Sala</div><div class="code">${esc(sala)}</div>
      <ol class="steps"><li>Cada amigo lê o QR com a câmara do telemóvel (ou abre <b>${esc(base.replace(/^https?:\/\//,''))}</b> e escreve o código).</li><li>Escolhe aqui o jogo. Os telemóveis entram sozinhos.</li></ol></div></div>
    <div class="k center" style="margin-top:6px">Escolhe o jogo</div>
    <div class="games">${GAMES.map(g=>`<button class="game" data-g="${g.id}" style="--c:${g.c};${pre===g.id?'box-shadow:inset 0 0 0 2px var(--gold)':''}"><div class="ic">${g.ic}</div><h2>${esc(g.n)}</h2><p>${esc(g.d)}</p><div class="meta">${g.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div></button>`).join('')}</div>
    <p class="center muted small">Podes trocar de jogo a meio da noite: os telemóveis seguem a TV. <a href="${base}">Nova sala</a></p>`;
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { location.href = `jogos/${b.dataset.g}/?sala=${sala}&tv=1`; });
  const drawQR = () => { if(window.QRCode){ try{ new QRCode($('#qr'), { text:url, width:200, height:200, colorDark:'#0b1410', colorLight:'#ffffff' }); }catch(e){} } else setTimeout(drawQR, 300); };
  drawQR();
}
function phoneWait(sala){
  app.innerHTML = `${head}<div class="card wait"><div class="ic">📱</div><h2 style="font-family:var(--serif);font-weight:400">Sala <span style="color:var(--gold2);letter-spacing:.15em">${esc(sala)}</span></h2>
    <p id="msg">À espera que a TV escolha o jogo…</p><p class="status" id="st"></p></div>
    <p class="center muted small">Quando a TV abrir um jogo, este ecrã muda sozinho. <a href="${base}">Outra sala</a></p>`;
  window.__NJ_onInfo = info => { if(info && info.game){ $('#msg').textContent = 'A abrir o jogo…'; location.href = `jogos/${info.game}/?sala=${sala}`; } };
  if(window.__NJ) window.__NJ.onStatus(s => { const el = $('#st'); if(el) el.textContent = s.text; });
}
const sala = (qs.get('sala')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
if(sala && qs.get('tv')==='1') tvChooser(sala);
else if(sala) phoneWait(sala);
else home();
})();
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
